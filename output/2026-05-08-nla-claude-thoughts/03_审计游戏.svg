<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#37352F">审计游戏：从 3% 到 15%，量级跃迁</text>
  <text x="400" y="62" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">在故意训歪的模型里挖隐藏偏好的命中率</text>

  <!-- Game flow at top -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="700" height="80" rx="10" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="1"/>

    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#37352F">第1步</text>
      <text x="70" y="33" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">秘密训歪模型</text>
    </g>

    <line x1="170" y1="40" x2="200" y2="40" stroke="#37352F" stroke-width="2" marker-end="url(#arr3)"/>

    <g transform="translate(210, 20)">
      <rect x="0" y="0" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#37352F">第2步</text>
      <text x="70" y="33" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">审计员只看激活</text>
    </g>

    <line x1="360" y1="40" x2="390" y2="40" stroke="#37352F" stroke-width="2" marker-end="url(#arr3)"/>

    <g transform="translate(400, 20)">
      <rect x="0" y="0" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#37352F">第3步</text>
      <text x="70" y="33" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">猜出隐藏偏好？</text>
    </g>

    <line x1="550" y1="40" x2="580" y2="40" stroke="#37352F" stroke-width="2" marker-end="url(#arr3)"/>

    <g transform="translate(590, 20)">
      <rect x="0" y="0" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="1"/>
      <text x="45" y="26" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">命中率</text>
    </g>
  </g>

  <!-- Bar chart comparison -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#37352F">命中率对比</text>

    <!-- baseline bar -->
    <text x="0" y="50" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">对照组 (其他可解释性工具)</text>
    <rect x="240" y="35" width="40" height="30" rx="4" fill="#EB5757" opacity="0.7"/>
    <text x="290" y="55" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#EB5757">&lt; 3%</text>
    <text x="350" y="55" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">基本等于瞎猜</text>

    <!-- NLA bar -->
    <text x="0" y="120" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">NLA 组</text>
    <rect x="240" y="105" width="200" height="30" rx="4" fill="#2383E2"/>
    <text x="450" y="125" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#2383E2">12–15%</text>
    <text x="520" y="125" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">数量级跃迁</text>

    <!-- gridline -->
    <line x1="240" y1="170" x2="640" y2="170" stroke="#E3E2E0" stroke-width="1"/>
    <text x="240" y="190" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">0%</text>
    <text x="438" y="190" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">10%</text>
    <text x="635" y="190" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">20%</text>
  </g>

  <!-- Why bigger -->
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="680" height="55" rx="6" fill="#FFF8E1" stroke="#FFB020" stroke-width="1"/>
    <text x="340" y="22" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#E6A010">为什么 NLA 能赢这么多</text>
    <text x="340" y="42" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">输出是文字 → 可批量过滤、关键词搜索、再扔给另一只模型审 → alignment 从手工业进流水线</text>
  </g>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37352F"/>
    </marker>
  </defs>
</svg>
