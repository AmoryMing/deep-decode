<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <style>
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif; font-weight: 700; }
      .sub { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 400; }
      .en { font-family: 'PingFang SC', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="800" height="560" fill="#FAF8F5"/>
  <rect x="0" y="0" width="800" height="8" fill="#CC785C"/>

  <text x="48" y="50" class="en" font-size="13" fill="#7A6B5A" letter-spacing="2">04 · THREE LABS · THREE LANGUAGES</text>
  <text x="48" y="92" class="title" font-size="26" fill="#1F1B16">三家头部，三套监管话语</text>
  <text x="48" y="120" class="sub" font-size="14" fill="#7A6B5A">谁的词被立法者借用，谁就占了合规模板的位置。</text>

  <!-- table header -->
  <g transform="translate(48, 160)">
    <rect x="0" y="0" width="704" height="42" fill="#1F1B16"/>
    <text x="20" y="27" class="en" font-size="13" fill="#CC785C" letter-spacing="2">LAB</text>
    <text x="180" y="27" class="en" font-size="13" fill="#CC785C" letter-spacing="2">KEY VOCAB</text>
    <text x="430" y="27" class="en" font-size="13" fill="#CC785C" letter-spacing="2">POSTURE</text>
    <text x="600" y="27" class="en" font-size="13" fill="#CC785C" letter-spacing="2">REGULATORY FIT</text>
  </g>

  <!-- Anthropic row -->
  <g transform="translate(48, 210)">
    <rect x="0" y="0" width="704" height="100" fill="#CC785C" fill-opacity="0.10"/>
    <rect x="0" y="0" width="6" height="100" fill="#CC785C"/>
    <text x="20" y="36" class="title" font-size="18" fill="#1F1B16">Anthropic</text>
    <text x="20" y="60" class="en" font-size="11" fill="#7A6B5A">safety lab</text>
    <text x="180" y="36" class="sub" font-size="13" fill="#37352F">constitution · alignment</text>
    <text x="180" y="58" class="sub" font-size="13" fill="#37352F">moral formation · safe other</text>
    <text x="180" y="80" class="en" font-size="11" fill="#CC785C">自带"应该"的味道</text>
    <text x="430" y="48" class="sub" font-size="13" fill="#37352F">主动收集</text>
    <text x="430" y="70" class="sub" font-size="13" fill="#37352F">"对话权"</text>
    <text x="600" y="48" class="title" font-size="15" fill="#CC785C">高度契合</text>
    <text x="600" y="72" class="sub" font-size="12" fill="#37352F">已有现成模板</text>
  </g>

  <!-- OpenAI row -->
  <g transform="translate(48, 318)">
    <rect x="0" y="0" width="704" height="100" fill="#1F1B16" fill-opacity="0.06"/>
    <rect x="0" y="0" width="6" height="100" fill="#1F1B16"/>
    <text x="20" y="36" class="title" font-size="18" fill="#1F1B16">OpenAI</text>
    <text x="20" y="60" class="en" font-size="11" fill="#7A6B5A">product lab</text>
    <text x="180" y="36" class="sub" font-size="13" fill="#37352F">preparedness levels</text>
    <text x="180" y="58" class="sub" font-size="13" fill="#37352F">risk-based 技术披露</text>
    <text x="180" y="80" class="en" font-size="11" fill="#7A6B5A">工程化、可量化</text>
    <text x="430" y="48" class="sub" font-size="13" fill="#37352F">卖产品</text>
    <text x="430" y="70" class="sub" font-size="13" fill="#37352F">扩张订阅</text>
    <text x="600" y="48" class="title" font-size="15" fill="#1F1B16">技术失声</text>
    <text x="600" y="72" class="sub" font-size="12" fill="#37352F">缺道德叙事</text>
  </g>

  <!-- xAI row -->
  <g transform="translate(48, 426)">
    <rect x="0" y="0" width="704" height="100" fill="#1F1B16" fill-opacity="0.06"/>
    <rect x="0" y="0" width="6" height="#7A6B5A" fill="#7A6B5A"/>
    <rect x="0" y="0" width="6" height="100" fill="#7A6B5A"/>
    <text x="20" y="36" class="title" font-size="18" fill="#1F1B16">xAI</text>
    <text x="20" y="60" class="en" font-size="11" fill="#7A6B5A">truth lab</text>
    <text x="180" y="36" class="sub" font-size="13" fill="#37352F">truth-seeking</text>
    <text x="180" y="58" class="sub" font-size="13" fill="#37352F">anti-woke 公关话术</text>
    <text x="180" y="80" class="en" font-size="11" fill="#7A6B5A">立场化、对抗化</text>
    <text x="430" y="48" class="sub" font-size="13" fill="#37352F">打嘴炮</text>
    <text x="430" y="70" class="sub" font-size="13" fill="#37352F">立场对抗</text>
    <text x="600" y="48" class="title" font-size="15" fill="#7A6B5A">边缘化</text>
    <text x="600" y="72" class="sub" font-size="12" fill="#37352F">不进监管词汇</text>
  </g>
