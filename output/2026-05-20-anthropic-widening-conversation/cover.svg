<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif; font-weight: 700; }
      .sub { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 400; }
      .en { font-family: 'PingFang SC', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 500; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F1EB"/>
      <stop offset="1" stop-color="#E8DFD3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Anthropic brand stripe -->
  <rect x="0" y="0" width="800" height="8" fill="#CC785C"/>

  <!-- Top label -->
  <text x="48" y="60" class="en" font-size="14" fill="#7A6B5A" letter-spacing="2">ANTHROPIC · POLICY POSTURE</text>

  <!-- Main title (Chinese) -->
  <text x="48" y="130" class="title" font-size="38" fill="#1F1B16">把对话向神职人员打开</text>
  <text x="48" y="178" class="title" font-size="38" fill="#1F1B16">safety lab 的定位战</text>

  <!-- English subtitle -->
  <text x="48" y="220" class="en" font-size="18" fill="#CC785C">Widening the Conversation on AI</text>

  <!-- Three circles: policy / research / education -->
  <g transform="translate(140, 320)">
    <!-- policy -->
    <circle cx="0" cy="0" r="62" fill="#CC785C" fill-opacity="0.78"/>
    <text x="0" y="6" text-anchor="middle" class="title" font-size="20" fill="#FFFFFF">政策</text>
    <text x="0" y="28" text-anchor="middle" class="en" font-size="11" fill="#FFE8DE" letter-spacing="1">POLICY</text>
  </g>

  <g transform="translate(260, 320)">
    <!-- research -->
    <circle cx="0" cy="0" r="62" fill="#1F1B16" fill-opacity="0.82"/>
    <text x="0" y="6" text-anchor="middle" class="title" font-size="20" fill="#FFFFFF">研究</text>
    <text x="0" y="28" text-anchor="middle" class="en" font-size="11" fill="#D9CFC3" letter-spacing="1">RESEARCH</text>
  </g>

  <g transform="translate(380, 320)">
    <!-- education -->
    <circle cx="0" cy="0" r="62" fill="#7A6B5A" fill-opacity="0.85"/>
    <text x="0" y="6" text-anchor="middle" class="title" font-size="20" fill="#FFFFFF">教育</text>
    <text x="0" y="28" text-anchor="middle" class="en" font-size="11" fill="#F5F1EB" letter-spacing="1">EDUCATION</text>
  </g>

  <!-- arrow toward right -->
  <g transform="translate(490, 320)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#1F1B16" stroke-width="2"/>
    <polygon points="80,0 70,-6 70,6" fill="#1F1B16"/>
    <text x="40" y="-14" text-anchor="middle" class="sub" font-size="13" fill="#1F1B16">监管语境</text>
  </g>

  <!-- Anthropic logo wordmark (simple text mark) -->
  <g transform="translate(620, 320)">
    <rect x="0" y="-30" width="130" height="60" fill="none" stroke="#CC785C" stroke-width="1.5"/>
    <text x="65" y="-2" text-anchor="middle" class="en" font-size="14" fill="#1F1B16" letter-spacing="1">ANTHROPIC</text>
    <text x="65" y="18" text-anchor="middle" class="en" font-size="10" fill="#7A6B5A">SAFETY LAB</text>
  </g>

  <!-- Date footer -->
  <text x="48" y="415" class="en" font-size="12" fill="#7A6B5A">2026-05-20  /  decode</text>
  <text x="752" y="415" text-anchor="end" class="en" font-size="12" fill="#7A6B5A">anthropic.com/news/widening-conversation-ai</text>
</svg>
