<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <style>
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif; font-weight: 700; }
      .sub { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 400; }
      .en { font-family: 'PingFang SC', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="800" height="560" fill="#FAF8F5"/>
  <rect x="0" y="0" width="800" height="8" fill="#CC785C"/>

  <text x="48" y="50" class="en" font-size="13" fill="#7A6B5A" letter-spacing="2">03 · POLICY CAPTURE FLOW</text>
  <text x="48" y="92" class="title" font-size="28" fill="#1F1B16">安全姿态的扩音器策略</text>
  <text x="48" y="124" class="en" font-size="16" fill="#CC785C">Safety-Posture Amplifier · 三层结构</text>

  <!-- Layer 1 -->
  <g transform="translate(48, 170)">
    <circle cx="34" cy="34" r="22" fill="#CC785C"/>
    <text x="34" y="40" text-anchor="middle" class="title" font-size="18" fill="#FFFFFF">1</text>
    <text x="80" y="28" class="title" font-size="17" fill="#1F1B16">内部命名升级</text>
    <text x="80" y="52" class="sub" font-size="13" fill="#37352F">alignment → constitution / moral formation / safe other</text>
    <text x="80" y="74" class="sub" font-size="12" fill="#7A6B5A">让工程问题听起来像伦理问题</text>
  </g>

  <line x1="82" y1="252" x2="82" y2="292" stroke="#CC785C" stroke-width="2"/>
  <polygon points="82,292 76,282 88,282" fill="#CC785C"/>

  <!-- Layer 2 -->
  <g transform="translate(48, 308)">
    <circle cx="34" cy="34" r="22" fill="#CC785C"/>
    <text x="34" y="40" text-anchor="middle" class="title" font-size="18" fill="#FFFFFF">2</text>
    <text x="80" y="28" class="title" font-size="17" fill="#1F1B16">找外部传声筒做结构化对话</text>
    <text x="80" y="52" class="sub" font-size="13" fill="#37352F">神职 / 哲学 / 伦理学者 → 非商业道德权威</text>
    <text x="80" y="74" class="sub" font-size="12" fill="#7A6B5A">他们的话语会被媒体和监管引用</text>
  </g>

  <line x1="82" y1="390" x2="82" y2="430" stroke="#CC785C" stroke-width="2"/>
  <polygon points="82,430 76,420 88,420" fill="#CC785C"/>

  <!-- Layer 3 -->
  <g transform="translate(48, 446)">
    <circle cx="34" cy="34" r="22" fill="#1F1B16"/>
    <text x="34" y="40" text-anchor="middle" class="title" font-size="18" fill="#FFFFFF">3</text>
    <text x="80" y="28" class="title" font-size="17" fill="#1F1B16">监管语境默认收编</text>
    <text x="80" y="52" class="sub" font-size="13" fill="#37352F">立法草案里出现 Anthropic 命名的术语</text>
    <text x="80" y="74" class="sub" font-size="12" fill="#7A6B5A">而公司自己不需要再说一次</text>
  </g>

  <!-- right comparison -->
  <g transform="translate(480, 170)">
    <rect x="0" y="0" width="272" height="350" fill="#1F1B16" fill-opacity="0.04" stroke="#1F1B16" stroke-width="1"/>
    <text x="20" y="34" class="en" font-size="12" fill="#7A6B5A" letter-spacing="2">VS  LOBBYING</text>
    <text x="20" y="64" class="title" font-size="15" fill="#1F1B16">和传统游说的区别</text>

    <text x="20" y="110" class="title" font-size="13" fill="#CC785C">Lobby</text>
    <text x="20" y="132" class="sub" font-size="12" fill="#37352F">直接给立法者答案</text>
    <text x="20" y="150" class="sub" font-size="12" fill="#37352F">付钱给说客</text>
    <text x="20" y="168" class="sub" font-size="12" fill="#37352F">公开数据库可追溯</text>

    <line x1="20" y1="195" x2="252" y2="195" stroke="#CC785C" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="20" y="224" class="title" font-size="13" fill="#CC785C">Amplifier</text>
    <text x="20" y="246" class="sub" font-size="12" fill="#37352F">塑造立法者将听到的语言</text>
    <text x="20" y="264" class="sub" font-size="12" fill="#37352F">通过中立第三方传导</text>
    <text x="20" y="282" class="sub" font-size="12" fill="#37352F">不会出现在游说支出表里</text>

    <rect x="20" y="306" width="232" height="30" fill="#CC785C"/>
    <text x="136" y="326" text-anchor="middle" class="title" font-size="13" fill="#FFFFFF">比 lobby 隐形，比 PR 长效</text>
  </g>
</svg>
