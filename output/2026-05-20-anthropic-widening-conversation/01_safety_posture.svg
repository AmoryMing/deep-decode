<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <style>
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif; font-weight: 700; }
      .sub { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 400; }
      .en { font-family: 'PingFang SC', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#FAF8F5"/>
  <rect x="0" y="0" width="800" height="8" fill="#CC785C"/>

  <text x="48" y="50" class="en" font-size="13" fill="#7A6B5A" letter-spacing="2">01 · SAFETY POSTURE</text>
  <text x="48" y="92" class="title" font-size="30" fill="#1F1B16">safety lab 是身份，</text>
  <text x="48" y="128" class="title" font-size="30" fill="#1F1B16">不是产品 SKU。</text>

  <!-- left column: 公司说自己是 -->
  <g transform="translate(48, 180)">
    <text x="0" y="0" class="en" font-size="12" fill="#7A6B5A" letter-spacing="1">SELF-IDENTITY</text>
    <text x="0" y="28" class="title" font-size="18" fill="#1F1B16">Anthropic 自我定位</text>
    <rect x="0" y="48" width="320" height="58" fill="#CC785C" fill-opacity="0.12" stroke="#CC785C" stroke-width="1.5"/>
    <text x="16" y="84" class="title" font-size="22" fill="#CC785C">"AI safety lab"</text>
    <text x="0" y="138" class="sub" font-size="14" fill="#37352F">所有公开材料、博客、招聘页</text>
    <text x="0" y="160" class="sub" font-size="14" fill="#37352F">第一句话都把 safety 放最前。</text>
  </g>

  <!-- right column: 实际在做什么 -->
  <g transform="translate(432, 180)">
    <text x="0" y="0" class="en" font-size="12" fill="#7A6B5A" letter-spacing="1">WHAT IT ACTUALLY DOES</text>
    <text x="0" y="28" class="title" font-size="18" fill="#1F1B16">实际业务结构</text>
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="320" height="38" fill="#1F1B16" fill-opacity="0.06"/>
      <text x="14" y="25" class="sub" font-size="14" fill="#1F1B16">Claude API · 模型商业化</text>
    </g>
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="320" height="38" fill="#1F1B16" fill-opacity="0.06"/>
      <text x="14" y="25" class="sub" font-size="14" fill="#1F1B16">企业部署 · KPMG / PwC</text>
    </g>
    <g transform="translate(0, 148)">
      <rect x="0" y="0" width="320" height="38" fill="#1F1B16" fill-opacity="0.06"/>
      <text x="14" y="25" class="sub" font-size="14" fill="#1F1B16">AWS / Google Cloud 合约</text>
    </g>
  </g>

  <!-- arrow + insight -->
  <line x1="368" y1="280" x2="412" y2="280" stroke="#CC785C" stroke-width="2"/>
  <polygon points="412,280 402,274 402,286" fill="#CC785C"/>

  <g transform="translate(48, 410)">
    <rect x="0" y="0" width="704" height="62" fill="#1F1B16"/>
    <text x="20" y="28" class="title" font-size="14" fill="#FAF8F5">姿态 = 监管语境里的入场券</text>
    <text x="20" y="50" class="sub" font-size="13" fill="#D9CFC3">把自己钉在"AI 实验室"和"公共议题中介"之间——一个原本由学者、智库、NGO 占据的空格。</text>
  </g>
</svg>
