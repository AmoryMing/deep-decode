<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <text x="54" y="70" font-family="PingFang SC, Inter, sans-serif" font-size="28" font-weight="700" fill="#111827">不是 demo，是行业样板间</text>
  <rect x="76" y="140" width="300" height="250" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="154" y="184" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#9A3412">普通 demo</text>
  <text x="116" y="230" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#7C2D12">展示一次能力</text>
  <text x="116" y="268" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#7C2D12">客户回去补流程</text>
  <text x="116" y="306" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#7C2D12">数据和审核悬空</text>
  <rect x="424" y="140" width="300" height="250" rx="16" fill="#EFF6FF" stroke="#2383E2" stroke-width="2"/>
  <text x="490" y="184" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">行业样板间</text>
  <text x="464" y="230" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#1E3A8A">命名工作流</text>
  <text x="464" y="268" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#1E3A8A">skills 和 commands</text>
  <text x="464" y="306" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#1E3A8A">数据连接器和签核边界</text>
  <path d="M386 262 H414" stroke="#2383E2" stroke-width="4"/>
  <text x="90" y="444" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#374151">样板间的价值：客户不用从空白聊天框开始，而是从一套业务目录开始。</text>
</svg>
