<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="40" y="50" font-size="20" font-weight="700" fill="#1A1A1A">图 5·V4 的偏科图谱</text>
  <text x="40" y="76" font-size="13" fill="#666">代码强 · 数学贴近 · 知识弱 — 不会被官方主动说的事</text>

  <!-- Strong side -->
  <text x="40" y="120" font-size="14" font-weight="700" fill="#FFA500">强项</text>

  <text x="40" y="155" font-size="12" fill="#1A1A1A">LiveCodeBench</text>
  <rect x="200" y="143" width="374" height="18" fill="#FFA500" rx="2"/>
  <text x="582" y="158" font-size="12" font-weight="700" fill="#1A1A1A">93.5%（V4 第一）</text>

  <text x="40" y="190" font-size="12" fill="#1A1A1A">Codeforces Rating</text>
  <rect x="200" y="178" width="385" height="18" fill="#FFA500" rx="2"/>
  <text x="593" y="193" font-size="12" font-weight="700" fill="#1A1A1A">3206（领先 GPT-5.4）</text>

  <text x="40" y="225" font-size="12" fill="#1A1A1A">Terminal-Bench 2.0</text>
  <rect x="200" y="213" width="272" height="18" fill="#FFA500" rx="2"/>
  <text x="480" y="228" font-size="12" font-weight="700" fill="#1A1A1A">67.9%（领先 Opus 4.6）</text>

  <line x1="40" y1="255" x2="860" y2="255" stroke="#E0E0E0"/>

  <!-- Weak side -->
  <text x="40" y="285" font-size="14" font-weight="700" fill="#2383E2">弱项</text>

  <text x="40" y="320" font-size="12" fill="#1A1A1A">SimpleQA-Verified</text>
  <rect x="200" y="308" width="232" height="18" fill="#2383E2" rx="2"/>
  <text x="440" y="323" font-size="12" font-weight="700" fill="#1A1A1A">57.9%（vs Gemini 75.6%）</text>

  <text x="40" y="355" font-size="12" fill="#1A1A1A">HLE</text>
  <rect x="200" y="343" width="151" height="18" fill="#2383E2" rx="2"/>
  <text x="359" y="358" font-size="12" font-weight="700" fill="#1A1A1A">37.7%（vs Gemini 44.4%）</text>

  <text x="40" y="390" font-size="12" fill="#1A1A1A">HMMT 2026 Math</text>
  <rect x="200" y="378" width="381" height="18" fill="#2383E2" rx="2"/>
  <text x="589" y="393" font-size="12" font-weight="700" fill="#1A1A1A">95.2%（vs GPT-5.4 97.7%）</text>

  <!-- Conclusion -->
  <rect x="40" y="420" width="820" height="50" fill="#FFF3E0" rx="3"/>
  <text x="56" y="445" font-size="13" font-weight="600" fill="#1A1A1A">事实查询类任务（财报、人物、年份）保留闭源做兜底；agent coding 全栈可切 V4</text>
  <text x="56" y="463" font-size="11" fill="#666">官方公告对短板用一句外交辞令带过：trails only Gemini-3.1-Pro</text>

  <text x="40" y="492" font-size="10" fill="#999">数据来源：Buildfastwithai 横评 + DeepSeek 官方公告对比措辞</text>
</svg>
