<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383E2"/>
    </marker>
    <marker id="ar3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#787774"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#37352F">Dreaming 工作机制</text>
  <text x="400" y="68" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">闲时回放历史会话 · 找规律 · 改自己的系统提示</text>

  <!-- Step 1: Sessions log -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="90" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F">1 · 历史会话池</text>
    <line x1="20" y1="42" x2="160" y2="42" stroke="#E3E2E0"/>
    <rect x="20" y="52" width="140" height="14" rx="3" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="28" y="63" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">session #1273 ✓</text>
    <rect x="20" y="72" width="140" height="14" rx="3" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="28" y="83" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#EB5757">session #1274 ✗</text>
    <rect x="20" y="92" width="140" height="14" rx="3" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="28" y="103" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">session #1275 ✓</text>
  </g>

  <!-- Step 2: Reviewer agent -->
  <g transform="translate(310, 130)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#EAF4FE" stroke="#2383E2"/>
    <text x="90" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#2383E2">2 · 复盘 agent</text>
    <text x="90" y="56" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">这一周哪些任务卡住了？</text>
    <text x="90" y="76" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">重复出现的失败模式？</text>
    <text x="90" y="96" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">提示词哪里没写清？</text>
  </g>

  <!-- Step 3: Patch -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#FFF8E8" stroke="#FFB020"/>
    <text x="90" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#FFB020">3 · 改写规则</text>
    <text x="90" y="56" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">系统提示词增量</text>
    <text x="90" y="76" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">工具使用规范</text>
    <text x="90" y="96" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">边界条件处理</text>
  </g>

  <!-- arrows -->
  <line x1="240" y1="190" x2="308" y2="190" stroke="#787774" stroke-width="1.6" marker-end="url(#ar3g)"/>
  <line x1="490" y1="190" x2="558" y2="190" stroke="#787774" stroke-width="1.6" marker-end="url(#ar3g)"/>

  <!-- Branching: auto vs human review -->
  <g transform="translate(310, 290)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#EAF4FE" stroke="#2383E2"/>
    <text x="90" y="26" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#37352F">两种落地路径</text>
    <text x="90" y="46" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">谁来批准这次"梦境"？</text>
  </g>
  <line x1="650" y1="252" x2="490" y2="320" stroke="#2383E2" stroke-width="1.6" marker-end="url(#ar3)"/>

  <g transform="translate(120, 400)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="#FFFFFF" stroke="#4DB6AC" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#4DB6AC">自动模式</text>
    <text x="120" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">复盘通过 → 直接更新</text>
    <text x="120" y="68" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">速度快 · 适合内部 agent</text>
  </g>

  <g transform="translate(440, 400)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="#FFFFFF" stroke="#9B51E0" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#9B51E0">人工审核</text>
    <text x="120" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">复盘建议 → 人点头才合并</text>
    <text x="120" y="68" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">可控 · 适合面向客户的 agent</text>
  </g>

  <line x1="370" y1="350" x2="240" y2="396" stroke="#4DB6AC" stroke-width="1.5" marker-end="url(#ar3g)"/>
  <line x1="430" y1="350" x2="560" y2="396" stroke="#9B51E0" stroke-width="1.5" marker-end="url(#ar3g)"/>

  <!-- Outcome ribbon -->
  <rect x="60" y="498" width="680" height="1" fill="#E3E2E0"/>
  <text x="400" y="510" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Harvey 报告：上线 dreaming 后任务完成率提升约 6 倍</text>
</svg>
