<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1024"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE6A8" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#FFB020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#787774"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="200" cy="60" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="640" cy="90" r="1.3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="720" cy="55" r="0.9" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="100" cy="380" r="0.8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="700" cy="370" r="1.0" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="60" cy="200" r="0.7" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="760" cy="220" r="0.7" fill="#FFFFFF" opacity="0.4"/>

  <!-- Series label -->
  <rect x="20" y="15" width="120" height="26" rx="4" fill="#EB5757" opacity="0.9"/>
  <text x="80" y="33" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">AI 前沿拆解</text>

  <!-- Moon halo (right side, dreaming) -->
  <circle cx="600" cy="200" r="120" fill="url(#moon)"/>
  <circle cx="600" cy="200" r="55" fill="#FFE6A8" opacity="0.85"/>

  <!-- Sleeping agent (center) -->
  <g transform="translate(360, 200)">
    <!-- box body -->
    <rect x="-58" y="-18" width="116" height="60" rx="10" fill="#2383E2" opacity="0.18" stroke="#2383E2" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#FFFFFF">agent</text>
    <text x="0" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">在做梦</text>
    <!-- closed eyes -->
    <path d="M -22 -34 Q -16 -38 -10 -34" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 10 -34 Q 16 -38 22 -34" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- ZZZ -->
    <text x="68" y="-30" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#FFE6A8" opacity="0.9">z</text>
    <text x="78" y="-44" font-family="PingFang SC, Inter, sans-serif" font-size="18" fill="#FFE6A8" opacity="0.85">Z</text>
    <text x="92" y="-62" font-family="PingFang SC, Inter, sans-serif" font-size="22" fill="#FFE6A8" opacity="0.8">Z</text>
  </g>

  <!-- Memory thread from agent looping back -->
  <path d="M 360 240 Q 240 320 200 280 Q 160 230 240 200 Q 300 180 358 198"
        fill="none" stroke="#9B51E0" stroke-width="1.8" stroke-dasharray="5,4" opacity="0.7" marker-end="url(#arr1)"/>
  <text x="180" y="340" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#c69bff" opacity="0.85">回放历史 · 自我修订</text>

  <!-- Title -->
  <text x="400" y="62" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">agent 学会了做梦</text>
  <text x="400" y="92" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#9bb8e0">人类晚上才做的事，被写进了 Anthropic 的产品</text>

  <!-- Bottom data strip -->
  <rect x="80" y="370" width="640" height="1" fill="#787774" opacity="0.3"/>
  <g transform="translate(140, 405)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#FFB020">6×</text>
    <text x="32" y="-2" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">Harvey</text>
    <text x="32" y="13" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">完成率</text>
  </g>
  <g transform="translate(290, 405)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#4DB6AC">+10pp</text>
    <text x="60" y="-2" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">Outcomes</text>
    <text x="60" y="13" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">任务成功率</text>
  </g>
  <g transform="translate(490, 405)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#2383E2">数百</text>
    <text x="55" y="-2" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">Netflix</text>
    <text x="55" y="13" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9bb8e0">并行子 agent</text>
  </g>
  <text x="720" y="412" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">2026-05-08</text>
</svg>
