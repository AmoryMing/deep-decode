<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="36" font-family="PingFang SC, Inter, sans-serif" font-size="20" fill="#37352F" text-anchor="middle" font-weight="bold">可变奖赏 + 劳动错觉 = 成瘾飞轮</text>

  <!-- Flywheel in center -->
  <circle cx="400" cy="240" r="130" fill="none" stroke="#E3E2E0" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="400" cy="240" r="45" fill="#F7F7F5" stroke="#37352F" stroke-width="2"/>
  <text x="400" y="236" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" text-anchor="middle" font-weight="bold">再来</text>
  <text x="400" y="252" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" text-anchor="middle" font-weight="bold">一次</text>

  <!-- Node 1: Prompt (top) -->
  <rect x="340" y="70" width="120" height="44" rx="8" fill="#2383E2" stroke="none"/>
  <text x="400" y="97" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">写 Prompt</text>
  <!-- Arrow from prompt to watch -->
  <path d="M 460 100 Q 510 120 530 165" stroke="#37352F" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Node 2: Watch work (right) -->
  <rect x="510" y="165" width="140" height="56" rx="8" fill="#F7F7F5" stroke="#37352F" stroke-width="1.5"/>
  <text x="580" y="188" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle" font-weight="600">看 AI 工作</text>
  <text x="580" y="208" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774" text-anchor="middle">劳动错觉：价值感 +8%</text>
  <!-- Arrow to result -->
  <path d="M 580 221 Q 560 280 500 320" stroke="#37352F" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Node 3: Variable result (bottom right) -->
  <rect x="420" y="310" width="130" height="80" rx="8" fill="#F7F7F5" stroke="#37352F" stroke-width="1.5"/>
  <text x="485" y="334" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle" font-weight="600">结果不确定</text>
  <!-- Three outcomes -->
  <text x="445" y="358" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#4DB6AC">80%</text>
  <text x="470" y="358" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">不错</text>
  <text x="445" y="375" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#2383E2">10%</text>
  <text x="470" y="375" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">惊艳</text>
  <text x="445" y="392" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#EB5757">10%</text>
  <text x="470" y="392" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">差一点</text>
  <!-- Arrow to "almost" -->
  <path d="M 420 370 Q 360 390 280 350" stroke="#EB5757" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Node 4: Almost moment (bottom left) -->
  <rect x="150" y="310" width="140" height="56" rx="8" fill="#FFF5F5" stroke="#EB5757" stroke-width="1.5"/>
  <text x="220" y="333" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#EB5757" text-anchor="middle" font-weight="bold">"差一点就成了"</text>
  <text x="220" y="353" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774" text-anchor="middle">老虎机时刻：最强驱动力</text>
  <!-- Arrow back to prompt -->
  <path d="M 220 310 Q 200 260 260 165" stroke="#EB5757" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- Node 5: Visible progress (left) -->
  <rect x="130" y="165" width="140" height="56" rx="8" fill="#F7F7F5" stroke="#37352F" stroke-width="1.5"/>
  <text x="200" y="188" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle" font-weight="600">项目在生长</text>
  <text x="200" y="208" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774" text-anchor="middle">文件树 = 进度条</text>
  <!-- Arrow back to prompt -->
  <path d="M 270 175 Q 310 130 340 100" stroke="#37352F" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Bottom insight -->
  <rect x="140" y="430" width="520" height="36" rx="8" fill="#F7F7F5" stroke="none"/>
  <text x="400" y="453" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">不是"赢了"让你继续玩，是"差一点就赢了"让你继续玩</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6" fill="none" stroke="#37352F" stroke-width="1"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6" fill="none" stroke="#EB5757" stroke-width="1"/>
    </marker>
  </defs>
</svg>