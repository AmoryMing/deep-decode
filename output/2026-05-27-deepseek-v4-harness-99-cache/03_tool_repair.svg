<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="PingFang SC, Inter, sans-serif">
  <rect width="800" height="500" fill="#F7F1E8"/>
  <text x="400" y="50" font-size="22" font-weight="700" fill="#2A241B" text-anchor="middle">工具调用四轮修复：错误不污染上下文</text>
  <text x="400" y="78" font-size="14" fill="#8A8472" text-anchor="middle">修复发生在 harness 层 模型看到的对话流始终干净</text>

  <!-- 4 rounds -->
  <g>
    <rect x="80" y="120" width="160" height="280" fill="#FFFFFF" stroke="#2A241B" stroke-width="1.5" rx="6"/>
    <text x="160" y="150" font-size="16" font-weight="700" fill="#2A241B" text-anchor="middle">第 1 轮</text>
    <text x="160" y="180" font-size="13" fill="#2A241B" text-anchor="middle">直接解析</text>
    <text x="160" y="205" font-size="13" fill="#2A241B" text-anchor="middle">模型 JSON 输出</text>
    <text x="160" y="350" font-size="12" fill="#8A8472" text-anchor="middle">成功？</text>
    <text x="160" y="375" font-size="13" font-weight="600" fill="#2A241B" text-anchor="middle">→ 返回结果</text>
  </g>

  <g>
    <rect x="260" y="120" width="160" height="280" fill="#FFFFFF" stroke="#B85A3A" stroke-width="1.5" rx="6"/>
    <text x="340" y="150" font-size="16" font-weight="700" fill="#B85A3A" text-anchor="middle">第 2 轮</text>
    <text x="340" y="180" font-size="13" fill="#2A241B" text-anchor="middle">本地修</text>
    <text x="340" y="205" font-size="13" fill="#2A241B" text-anchor="middle">JSON 引号 / 参数 schema</text>
    <text x="340" y="350" font-size="12" fill="#8A8472" text-anchor="middle">不重新请求模型</text>
    <text x="340" y="375" font-size="13" font-weight="600" fill="#B85A3A" text-anchor="middle">→ 0 token 修复</text>
  </g>

  <g>
    <rect x="440" y="120" width="160" height="280" fill="#FFFFFF" stroke="#B85A3A" stroke-width="1.5" rx="6"/>
    <text x="520" y="150" font-size="16" font-weight="700" fill="#B85A3A" text-anchor="middle">第 3 轮</text>
    <text x="520" y="180" font-size="13" fill="#2A241B" text-anchor="middle">构造修正请求</text>
    <text x="520" y="205" font-size="13" fill="#2A241B" text-anchor="middle">明确告诉模型</text>
    <text x="520" y="230" font-size="13" fill="#2A241B" text-anchor="middle">上轮错在哪</text>
    <text x="520" y="350" font-size="12" fill="#8A8472" text-anchor="middle">单独走子上下文</text>
    <text x="520" y="375" font-size="13" font-weight="600" fill="#B85A3A" text-anchor="middle">→ 不污染主链</text>
  </g>

  <g>
    <rect x="620" y="120" width="160" height="280" fill="#FFFFFF" stroke="#8A8472" stroke-width="1.5" rx="6"/>
    <text x="700" y="150" font-size="16" font-weight="700" fill="#8A8472" text-anchor="middle">第 4 轮</text>
    <text x="700" y="180" font-size="13" fill="#2A241B" text-anchor="middle">降级</text>
    <text x="700" y="205" font-size="13" fill="#2A241B" text-anchor="middle">reasonix run 单步</text>
    <text x="700" y="350" font-size="12" fill="#8A8472" text-anchor="middle">不走复杂多轮</text>
    <text x="700" y="375" font-size="13" font-weight="600" fill="#8A8472" text-anchor="middle">→ 兜底</text>
  </g>

  <!-- arrows -->
  <text x="250" y="270" font-size="20" fill="#2A241B" text-anchor="middle">→</text>
  <text x="430" y="270" font-size="20" fill="#2A241B" text-anchor="middle">→</text>
  <text x="610" y="270" font-size="20" fill="#2A241B" text-anchor="middle">→</text>

  <!-- judgment -->
  <text x="400" y="450" font-size="14" font-style="italic" fill="#2A241B" text-anchor="middle">关键不在四轮本身 关键在修复发生在 harness 层 不污染上下文 前缀稳定性保住</text>
  <text x="400" y="475" font-size="12" fill="#8A8472" text-anchor="middle">DeepSeek 的 JSON 怪癖 → 按 DeepSeek 错误分布调优 → 搬到 GPT-5 是负优化</text>
</svg>
