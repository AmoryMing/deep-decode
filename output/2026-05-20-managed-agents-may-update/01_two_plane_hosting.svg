<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .ja { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
      .ttl { font-size: 28px; font-weight: 700; fill: #1F1B16; }
      .lbl { font-size: 16px; font-weight: 600; fill: #1F1B16; }
      .sub { font-size: 13px; fill: #5b524a; }
      .tag { font-size: 12px; font-weight: 600; fill: #fff; }
      .meta { font-size: 12px; fill: #8a7d72; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="6" height="500" fill="#DA7756"/>
  <text x="40" y="56" class="ja ttl">两面托管 · 一个 agent，两个机房</text>
  <text x="40" y="82" class="ja meta">orchestration plane 在 Anthropic / execution plane 在你这边</text>

  <!-- Anthropic side -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="300" height="320" rx="12" fill="#fff" stroke="#DA7756" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="40" rx="12" fill="#DA7756"/>
    <text x="150" y="26" class="ja tag" text-anchor="middle">Anthropic Infra</text>
    <text x="150" y="74" class="ja lbl" text-anchor="middle">Orchestration plane</text>

    <g transform="translate(30, 100)">
      <rect width="240" height="40" rx="6" fill="#FBEFE7"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle">推理调度 / state machine</text>
    </g>
    <g transform="translate(30, 150)">
      <rect width="240" height="40" rx="6" fill="#FBEFE7"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle">dreaming 复盘 agent</text>
    </g>
    <g transform="translate(30, 200)">
      <rect width="240" height="40" rx="6" fill="#FBEFE7"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle">outcomes grader</text>
    </g>
    <g transform="translate(30, 250)">
      <rect width="240" height="40" rx="6" fill="#FBEFE7"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle">multiagent 拆分</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(380, 270)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#DA7756" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="60,-6 72,0 60,6" fill="#DA7756"/>
    <text x="36" y="-12" class="ja sub" text-anchor="middle">tool call</text>
    <text x="36" y="22" class="ja sub" text-anchor="middle">result</text>
    <line x1="60" y1="20" x2="0" y2="20" stroke="#DA7756" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="0,14 -12,20 0,26" fill="#DA7756"/>
  </g>

  <!-- Customer side -->
  <g transform="translate(460, 130)">
    <rect x="0" y="0" width="300" height="320" rx="12" fill="#1F1B16"/>
    <rect x="0" y="0" width="300" height="40" rx="12" fill="#1F1B16"/>
    <text x="150" y="26" class="ja tag" text-anchor="middle">你的机房 / VPC</text>
    <text x="150" y="74" class="ja lbl" text-anchor="middle" fill="#f5e9e0">Execution plane</text>

    <g transform="translate(30, 100)">
      <rect width="240" height="40" rx="6" fill="#3a2f25"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle" fill="#f5e9e0">工具执行 / 代码运行</text>
    </g>
    <g transform="translate(30, 150)">
      <rect width="240" height="40" rx="6" fill="#3a2f25"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle" fill="#f5e9e0">文件读写</text>
    </g>
    <g transform="translate(30, 200)">
      <rect width="240" height="40" rx="6" fill="#3a2f25"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle" fill="#f5e9e0">敏感数据驻留</text>
    </g>
    <g transform="translate(30, 250)">
      <rect width="240" height="40" rx="6" fill="#3a2f25"/>
      <text x="120" y="25" class="ja sub" text-anchor="middle" fill="#f5e9e0">合规审计边界</text>
    </g>
  </g>

  <text x="400" y="480" class="ja meta" text-anchor="middle">一个 agent 物理上分布在两个机房，语义上仍是一个 agent</text>
</svg>
