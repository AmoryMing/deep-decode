<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .ja { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
      .ttl { font-size: 28px; font-weight: 700; fill: #1F1B16; }
      .lbl { font-size: 16px; font-weight: 600; fill: #1F1B16; }
      .sub { font-size: 13px; fill: #5b524a; }
      .meta { font-size: 12px; fill: #8a7d72; }
      .col { font-size: 13px; font-weight: 600; fill: #1F1B16; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="6" height="500" fill="#DA7756"/>

  <text x="40" y="56" class="ja ttl">客户名单暗线 · vertical 全景而非 logo 三件套</text>
  <text x="40" y="82" class="ja meta">从 top-of-the-line logo 转向 industry-by-industry penetration</text>

  <!-- table -->
  <g transform="translate(60, 120)">
    <!-- header -->
    <rect x="0" y="0" width="680" height="36" fill="#1F1B16"/>
    <text x="20" y="24" class="ja col" fill="#f5e9e0">客户</text>
    <text x="160" y="24" class="ja col" fill="#f5e9e0">行业</text>
    <text x="320" y="24" class="ja col" fill="#f5e9e0">agent 应用</text>
    <text x="540" y="24" class="ja col" fill="#f5e9e0">阶段</text>

    <!-- rows -->
    <g transform="translate(0, 36)">
      <rect width="680" height="50" fill="#FBEFE7"/>
      <text x="20" y="30" class="ja lbl">Amplitude</text>
      <text x="160" y="30" class="ja sub">分析工具</text>
      <text x="320" y="30" class="ja sub">Design Agent (UI/营销)</text>
      <rect x="525" y="14" width="80" height="22" rx="4" fill="#DA7756"/>
      <text x="565" y="30" class="ja sub" text-anchor="middle" fill="#fff">in build</text>
    </g>

    <g transform="translate(0, 86)">
      <rect width="680" height="50" fill="#fff"/>
      <text x="20" y="30" class="ja lbl">Clay</text>
      <text x="160" y="30" class="ja sub">数据丰富化</text>
      <text x="320" y="30" class="ja sub">Sculptor (GTM 工程)</text>
      <rect x="525" y="14" width="80" height="22" rx="4" fill="#DA7756"/>
      <text x="565" y="30" class="ja sub" text-anchor="middle" fill="#fff">in build</text>
    </g>

    <g transform="translate(0, 136)">
      <rect width="680" height="50" fill="#FBEFE7"/>
      <text x="20" y="30" class="ja lbl">Rogo</text>
      <text x="160" y="30" class="ja sub">机构金融</text>
      <text x="320" y="30" class="ja sub">institutional finance agent</text>
      <rect x="525" y="14" width="100" height="22" rx="4" fill="#1F1B16"/>
      <text x="575" y="30" class="ja sub" text-anchor="middle" fill="#f5e9e0">in production</text>
    </g>

    <g transform="translate(0, 186)">
      <rect width="680" height="50" fill="#fff"/>
      <text x="20" y="30" class="ja lbl">Mason</text>
      <text x="160" y="30" class="ja sub">内部工具</text>
      <text x="320" y="30" class="ja sub">workflow 编排</text>
      <rect x="525" y="14" width="80" height="22" rx="4" fill="#DA7756"/>
      <text x="565" y="30" class="ja sub" text-anchor="middle" fill="#fff">in build</text>
    </g>

    <g transform="translate(0, 236)">
      <rect width="680" height="50" fill="#FBEFE7"/>
      <text x="20" y="30" class="ja lbl">DoorDash</text>
      <text x="160" y="30" class="ja sub">marketplace</text>
      <text x="320" y="30" class="ja sub">agentic commerce</text>
      <rect x="525" y="14" width="100" height="22" rx="4" fill="none" stroke="#8a7d72" stroke-width="1.5"/>
      <text x="575" y="30" class="ja sub" text-anchor="middle" fill="#8a7d72">evaluating</text>
    </g>
  </g>

  <text x="40" y="440" class="ja meta">纵向：金融 / 设计 / GTM / commerce 各放一个</text>
  <text x="40" y="462" class="ja meta">深度：从 evaluating 到 in production 全档位铺心理预期</text>
  <text x="40" y="484" class="ja sub" fill="#DA7756">态度转向：vertical agent 厂愿意把 hosting 让给 Anthropic 而不是自建</text>
</svg>
