<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#1A1A1A">为什么终端 Agent 的上下文特别脏</text>
  <line x1="40" y1="58" x2="180" y2="58" stroke="#2383E2" stroke-width="3"/>

  <!-- Top: command in -->
  <rect x="40" y="90" width="200" height="56" fill="#F0F7FF" stroke="#2383E2" stroke-width="1.5"/>
  <text x="140" y="115" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Agent 决策</text>
  <text x="140" y="134" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#555">apt-get install -y ...</text>

  <text x="270" y="124" font-family="PingFang SC, sans-serif" font-size="22" fill="#888">→</text>

  <!-- Right: raw output box -->
  <rect x="310" y="78" width="450" height="200" fill="#FAFAFA" stroke="#E3E2E0"/>
  <text x="324" y="100" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#555">Terminal 输出（10071 字符）</text>

  <rect x="324" y="112" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="123" font-family="Menlo, monospace" font-size="10" fill="#999">Unpacking package-1 (1.2.3) ... done</text>

  <rect x="324" y="128" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="139" font-family="Menlo, monospace" font-size="10" fill="#999">Unpacking package-2 (2.4.0) ... done</text>

  <rect x="324" y="144" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="155" font-family="Menlo, monospace" font-size="10" fill="#999">... 200 行重复 unpacking ...</text>

  <rect x="324" y="160" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="171" font-family="Menlo, monospace" font-size="10" fill="#999">Unpacking package-N ... done</text>

  <rect x="324" y="176" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="187" font-family="Menlo, monospace" font-size="10" fill="#999">Setting up alternatives ...</text>

  <rect x="324" y="192" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="203" font-family="Menlo, monospace" font-size="10" fill="#999">Processing triggers ...</text>

  <rect x="324" y="208" width="420" height="14" fill="#E8E8E8"/>
  <text x="330" y="219" font-family="Menlo, monospace" font-size="10" fill="#999">ldconfig deferred processing</text>

  <!-- Critical signal -->
  <rect x="324" y="234" width="420" height="20" fill="#FFF3E0" stroke="#E68A00" stroke-width="1"/>
  <text x="330" y="249" font-family="Menlo, monospace" font-size="11" font-weight="600" fill="#E68A00">Successfully installed 228 packages</text>

  <!-- Annotations -->
  <text x="324" y="270" font-family="PingFang SC, sans-serif" font-size="12" fill="#D9534F">99% 噪声</text>
  <text x="600" y="270" font-family="PingFang SC, sans-serif" font-size="12" fill="#E68A00">1% 决定下一步</text>

  <!-- Bottom row: statistics -->
  <rect x="40" y="320" width="220" height="120" fill="#FAFAFA" stroke="#E3E2E0"/>
  <text x="60" y="346" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">TerminalBench 2.0 实测</text>
  <text x="60" y="376" font-family="PingFang SC, sans-serif" font-size="38" font-weight="700" fill="#2383E2">24.6%</text>
  <text x="160" y="370" font-family="PingFang SC, sans-serif" font-size="22" fill="#555">–</text>
  <text x="180" y="376" font-family="PingFang SC, sans-serif" font-size="38" font-weight="700" fill="#D9534F">44.1%</text>
  <text x="60" y="408" font-family="PingFang SC, sans-serif" font-size="13" fill="#555">raw prompt 中低价值冗余占比</text>
  <text x="60" y="426" font-family="PingFang SC, sans-serif" font-size="11" fill="#888">即「窗口够大但内容是垃圾」</text>

  <rect x="290" y="320" width="220" height="120" fill="#FAFAFA" stroke="#E3E2E0"/>
  <text x="310" y="346" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">极端案例 / apt install</text>
  <text x="310" y="380" font-family="PingFang SC, sans-serif" font-size="14" fill="#555">10071</text>
  <text x="372" y="380" font-family="PingFang SC, sans-serif" font-size="14" fill="#555">→</text>
  <text x="394" y="380" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#2383E2">73 字符</text>
  <text x="310" y="404" font-family="PingFang SC, sans-serif" font-size="12" fill="#555">压缩比 0.7%，关键信号 0 损失</text>

  <rect x="540" y="320" width="220" height="120" fill="#FAFAFA" stroke="#E3E2E0"/>
  <text x="560" y="346" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">代价</text>
  <text x="560" y="378" font-family="PingFang SC, sans-serif" font-size="13" fill="#555">token 成本随步数</text>
  <text x="560" y="398" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#D9534F">二次方增长</text>
  <text x="560" y="424" font-family="PingFang SC, sans-serif" font-size="11" fill="#888">长程任务越跑越贵越懵</text>
</svg>
