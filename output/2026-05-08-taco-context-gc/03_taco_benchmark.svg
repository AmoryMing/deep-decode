<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#1A1A1A">TACO 跨 benchmark 数据：token 砍掉 + 准确率涨</text>
  <line x1="40" y1="58" x2="180" y2="58" stroke="#2383E2" stroke-width="3"/>

  <!-- Table header -->
  <rect x="40" y="90" width="720" height="40" fill="#F0F7FF"/>
  <text x="60" y="115" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Benchmark</text>
  <text x="280" y="115" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">准确率（无 → 有 TACO）</text>
  <text x="540" y="115" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Token 总量（M）</text>

  <!-- Row 1 -->
  <rect x="40" y="130" width="720" height="40" fill="#FFFFFF" stroke="#E3E2E0"/>
  <text x="60" y="156" font-family="PingFang SC, sans-serif" font-size="13" fill="#1A1A1A">SWE-Bench Lite</text>
  <text x="280" y="156" font-family="Menlo, monospace" font-size="13" fill="#555">56.30%</text>
  <text x="356" y="156" font-family="Menlo, monospace" font-size="13" fill="#888">→</text>
  <text x="378" y="156" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">57.12%</text>
  <text x="540" y="156" font-family="Menlo, monospace" font-size="13" fill="#555">307.61</text>
  <text x="612" y="156" font-family="Menlo, monospace" font-size="13" fill="#888">→</text>
  <text x="634" y="156" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">270.53</text>

  <!-- Row 2 -->
  <rect x="40" y="170" width="720" height="40" fill="#FAFAFA" stroke="#E3E2E0"/>
  <text x="60" y="196" font-family="PingFang SC, sans-serif" font-size="13" fill="#1A1A1A">DevEval</text>
  <text x="280" y="196" font-family="Menlo, monospace" font-size="13" fill="#555">38.10%</text>
  <text x="356" y="196" font-family="Menlo, monospace" font-size="13" fill="#888">→</text>
  <text x="378" y="196" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">39.74%</text>
  <text x="540" y="196" font-family="Menlo, monospace" font-size="13" fill="#555">36.72</text>
  <text x="612" y="196" font-family="Menlo, monospace" font-size="13" fill="#888">→</text>
  <text x="634" y="196" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">26.82 (-27%)</text>

  <!-- Row 3 -->
  <rect x="40" y="210" width="720" height="40" fill="#FFFFFF" stroke="#E3E2E0"/>
  <text x="60" y="236" font-family="PingFang SC, sans-serif" font-size="13" fill="#1A1A1A">CRUST-Bench</text>
  <text x="280" y="236" font-family="Menlo, monospace" font-size="13" fill="#555">47.00%</text>
  <text x="356" y="236" font-family="Menlo, monospace" font-size="13" fill="#888">→</text>
  <text x="378" y="236" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">48.05%</text>
  <text x="540" y="236" font-family="Menlo, monospace" font-size="13" fill="#555">163.53</text>
  <text x="612" y="236" font-family="Menlo, monospace" font-size="13" fill="#888">→</text>
  <text x="634" y="236" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">134.97</text>

  <!-- Ablation header -->
  <text x="40" y="298" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">消融实验：DeepSeek-V3.2 / TerminalBench 2.0</text>
  <line x1="40" y1="306" x2="180" y2="306" stroke="#2383E2" stroke-width="2"/>

  <!-- Ablation rows: bar charts -->
  <text x="40" y="340" font-family="PingFang SC, sans-serif" font-size="13" fill="#555">完整 TACO</text>
  <rect x="180" y="326" width="285" height="20" fill="#2383E2"/>
  <text x="475" y="341" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#2383E2">42.7% acc · 12.2% token ↓</text>

  <text x="40" y="380" font-family="PingFang SC, sans-serif" font-size="13" fill="#555">去掉全局池演化</text>
  <rect x="180" y="366" width="270" height="20" fill="#9CC4ED"/>
  <text x="460" y="381" font-family="Menlo, monospace" font-size="13" fill="#555">40.4% acc · 18.1% token ↓</text>

  <text x="40" y="420" font-family="PingFang SC, sans-serif" font-size="13" fill="#555">去掉任务内演化</text>
  <rect x="180" y="406" width="259" height="20" fill="#D9D9D9"/>
  <text x="449" y="421" font-family="Menlo, monospace" font-size="13" fill="#888">38.9% acc · 30.7% token ↓</text>

  <text x="40" y="464" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#D9534F">注意：单纯压缩不是目的</text>
  <text x="40" y="484" font-family="PingFang SC, sans-serif" font-size="12" fill="#555">「去掉任务内演化」token 砍最猛，但准确率最低 — 把关键信号也压掉了</text>
  <text x="40" y="504" font-family="PingFang SC, sans-serif" font-size="12" fill="#555">完整 TACO 选择留 token 换准确率，因为有意义的信号 token 不能省</text>
</svg>
