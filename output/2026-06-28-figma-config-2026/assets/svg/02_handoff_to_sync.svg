<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <style>
    .bg { fill: #F7F1E8; }
    .h1 { font: 800 26px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .sub { font: 500 15px 'PingFang SC', Inter, sans-serif; fill: #5A5044; }
    .panellabel { font: 700 16px 'PingFang SC', Inter, sans-serif; }
    .role { font: 600 15px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .note { font: 400 13px 'PingFang SC', Inter, sans-serif; fill: #8A7E6C; }
    .wall { fill: #C2B6A0; }
    .walltext { font: 600 13px 'PingFang SC', Inter, sans-serif; fill: #5A5044; }
    .footer { font: 400 12px 'PingFang SC', Inter, sans-serif; fill: #8A7E6C; }
  </style>
  <rect class="bg" width="800" height="480"/>

  <text class="h1" x="40" y="54">把"交接"删掉，换成"同步"</text>
  <text class="sub" x="40" y="82">Code Layers 把单行道改成双向同步的车道</text>

  <!-- 上：旧 design-to-code -->
  <rect x="40" y="106" width="720" height="138" rx="12" fill="#FFFFFF" stroke="#D9CFBE" stroke-width="1.5"/>
  <text class="panellabel" x="62" y="138" fill="#8A7E6C">旧：design-to-code（设计到代码）</text>

  <rect x="62" y="156" width="190" height="64" rx="9" fill="#F2EADD" stroke="#D9CFBE" stroke-width="1.2"/>
  <text class="role" x="82" y="184">设计师</text>
  <text class="note" x="82" y="206">产出像素，扔过墙</text>

  <!-- 墙 -->
  <rect class="wall" x="300" y="150" width="36" height="78" rx="4"/>
  <text class="walltext" x="318" y="244" text-anchor="middle">墙</text>

  <rect x="384" y="156" width="190" height="64" rx="9" fill="#F2EADD" stroke="#D9CFBE" stroke-width="1.2"/>
  <text class="role" x="404" y="184">工程师</text>
  <text class="note" x="404" y="206">对着 PNG 猜，猜错返工</text>

  <text x="640" y="180" font="600 14px 'PingFang SC', Inter, sans-serif" fill="#B85A3A">单行道</text>
  <text class="note" x="640" y="204" >翻译损耗最贵</text>
  <!-- 单向箭头 -->
  <line x1="252" y1="188" x2="294" y2="188" stroke="#C2B6A0" stroke-width="2"/>
  <polygon points="294,182 308,188 294,194" fill="#C2B6A0"/>
  <line x1="342" y1="188" x2="378" y2="188" stroke="#C2B6A0" stroke-width="2"/>
  <polygon points="378,182 392,188 378,194" fill="#C2B6A0"/>

  <!-- 下：新 design-with-code -->
  <rect x="40" y="262" width="720" height="150" rx="12" fill="#B85A3A"/>
  <text class="panellabel" x="62" y="294" fill="#F7F1E8">新：design-with-code（带着代码一起设计）</text>

  <rect x="62" y="312" width="210" height="74" rx="9" fill="#A04E32"/>
  <text class="role" x="82" y="342" fill="#F7F1E8">设计师</text>
  <text class="note" x="82" y="366" fill="#F2D9CC">当场看见能不能跑</text>

  <rect x="528" y="312" width="210" height="74" rx="9" fill="#A04E32"/>
  <text class="role" x="548" y="342" fill="#F7F1E8">工程师</text>
  <text class="note" x="548" y="366" fill="#F2D9CC">和 GitHub 双向同步</text>

  <!-- 中间同一份文件 -->
  <rect x="312" y="316" width="176" height="66" rx="9" fill="#F7F1E8"/>
  <text x="400" y="346" text-anchor="middle" font="700 15px 'PingFang SC', Inter, sans-serif" fill="#2A241B">同一份文件</text>
  <text x="400" y="368" text-anchor="middle" font="400 12px 'PingFang SC', Inter, sans-serif" fill="#8A7E6C">两拨人改同一个东西</text>

  <!-- 双向箭头 -->
  <line x1="276" y1="349" x2="306" y2="349" stroke="#F7F1E8" stroke-width="2.5"/>
  <polygon points="306,343 318,349 306,355" fill="#F7F1E8"/>
  <polygon points="282,343 270,349 282,355" fill="#F7F1E8"/>
  <line x1="494" y1="349" x2="524" y2="349" stroke="#F7F1E8" stroke-width="2.5"/>
  <polygon points="524,343 536,349 524,355" fill="#F7F1E8"/>
  <polygon points="500,343 488,349 500,355" fill="#F7F1E8"/>

  <text class="footer" x="40" y="442">墙没了，同步没了——剩下的是两拨人对着同一份文件改同一个东西</text>
  <text class="footer" x="40" y="464">注：Code Layers 仍是六样里唯一未开放的，2026 年 7 月起封闭测试逐步放量</text>
</svg>
