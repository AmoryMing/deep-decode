<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="400" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#37352F" text-anchor="middle">三种计费模型在 Agent 时代的适配</text>

  <!-- table -->
  <g transform="translate(80,90)">
    <!-- header row -->
    <rect x="0" y="0" width="180" height="50" fill="#F7F7F5" stroke="#E3E2E0"/>
    <rect x="180" y="0" width="160" height="50" fill="#F7F7F5" stroke="#E3E2E0"/>
    <rect x="340" y="0" width="160" height="50" fill="#F7F7F5" stroke="#E3E2E0"/>
    <rect x="500" y="0" width="140" height="50" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="90" y="32" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F" text-anchor="middle">维度</text>
    <text x="260" y="32" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F" text-anchor="middle">按调用次数</text>
    <text x="420" y="32" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F" text-anchor="middle">按 MAU</text>
    <text x="570" y="32" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F" text-anchor="middle">Skill 批发</text>

    <!-- row 1 付费方 -->
    <rect x="0" y="50" width="180" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="180" y="50" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="340" y="50" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="500" y="50" width="140" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="90" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">付费方</text>
    <text x="260" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">App 开发者</text>
    <text x="420" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">App 厂商</text>
    <text x="570" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">Agent 平台</text>

    <!-- row 2 颗粒度 -->
    <rect x="0" y="110" width="180" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="180" y="110" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="340" y="110" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="500" y="110" width="140" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="90" y="145" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">颗粒度</text>
    <text x="260" y="145" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">单次 API</text>
    <text x="420" y="145" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">月活用户</text>
    <text x="570" y="145" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">订阅 + 分成</text>

    <!-- row 3 增长 -->
    <rect x="0" y="170" width="180" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="180" y="170" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="340" y="170" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="500" y="170" width="140" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="90" y="205" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">增长曲线</text>
    <text x="260" y="205" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">线性 + 缓慢</text>
    <text x="420" y="205" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">线性</text>
    <text x="570" y="205" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">非线性</text>

    <!-- row 4 用户感知 -->
    <rect x="0" y="230" width="180" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="180" y="230" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="340" y="230" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="500" y="230" width="140" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="90" y="265" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">用户感知</text>
    <text x="260" y="265" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">显式</text>
    <text x="420" y="265" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">中间</text>
    <text x="570" y="265" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">无感（嵌入对话）</text>

    <!-- row 5 厂商关系 -->
    <rect x="0" y="290" width="180" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="180" y="290" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="340" y="290" width="160" height="60" fill="#FFFFFF" stroke="#E3E2E0"/>
    <rect x="500" y="290" width="140" height="60" fill="#FFFFFF" stroke="#2383E2" stroke-width="2"/>
    <text x="90" y="325" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">和终端关系</text>
    <text x="260" y="325" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">间接</text>
    <text x="420" y="325" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#666" text-anchor="middle">间接</text>
    <text x="570" y="325" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#2383E2" text-anchor="middle">退到水电级</text>
  </g>

  <text x="400" y="450" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#888" text-anchor="middle">[分析判断] 高德官方未明示个人地图 Skill 的具体计费</text>
</svg>
