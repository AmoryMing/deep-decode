<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#37352F" text-anchor="middle">"零门槛"承诺的真实衰减</text>

  <!-- funnel layers -->
  <g font-family="PingFang SC, Inter, sans-serif">
    <!-- layer 1 -->
    <polygon points="100,90 700,90 660,150 140,150" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="1.5"/>
    <text x="400" y="125" font-size="14" font-weight="bold" fill="#37352F" text-anchor="middle">用户期望：随便说一句话，要什么得什么</text>

    <!-- layer 2 -->
    <polygon points="140,160 660,160 620,220 180,220" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="1.5"/>
    <text x="400" y="195" font-size="13" fill="#37352F" text-anchor="middle">简单意图：找店、规划一条路 — 基本可达</text>

    <!-- layer 3 -->
    <polygon points="180,230 620,230 580,290 220,290" fill="#FFFFFF" stroke="#FFB020" stroke-width="2"/>
    <text x="400" y="265" font-size="13" fill="#37352F" text-anchor="middle">复杂意图：多步规划 / 跨数据源融合 — 容易出错</text>

    <!-- layer 4 -->
    <polygon points="220,300 580,300 540,360 260,360" fill="#FFFFFF" stroke="#EB5757" stroke-width="2"/>
    <text x="400" y="335" font-size="13" fill="#37352F" text-anchor="middle">长尾意图：模糊语义、非标排序 — 不可控</text>

    <!-- layer 5 friction -->
    <polygon points="260,370 540,370 500,420 300,420" fill="#FFFFFF" stroke="#37352F" stroke-width="1.5"/>
    <text x="400" y="400" font-size="12" fill="#37352F" text-anchor="middle">真实摩擦：账号 / 鉴权 / 隐私 / 生成质量</text>
  </g>

  <text x="400" y="445" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#888" text-anchor="middle"></text>
</svg>
