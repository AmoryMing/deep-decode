<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="PingFang SC, Inter, sans-serif">
  <rect width="1200" height="750" fill="#F7F1E8"/>

  <text x="80" y="80" font-size="34" font-weight="700" fill="#2A241B">深模块 vs 浅模块：AI 的地形图</text>
  <text x="80" y="116" font-size="16" fill="#5C5345" font-style="italic" font-family="Cormorant Garamond, Songti SC, serif">好的架构不只是工程师工具，是 AI 的导航系统</text>
  <line x1="80" y1="138" x2="320" y2="138" stroke="#B85A3A" stroke-width="2"/>

  <!-- LEFT: shallow modules (mountains) -->
  <g transform="translate(80,200)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#2A241B">浅模块 codebase</text>
    <text x="0" y="24" font-size="12" fill="#5C5345" font-family="SF Mono, Menlo, monospace" letter-spacing="2">SHALLOW · 几十座小尖山 · AI 迷路</text>

    <!-- many small triangles -->
    <g transform="translate(0,60)">
      <!-- row 1 -->
      <polygon points="20,180 50,100 80,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="70,180 110,90 150,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="140,180 180,110 220,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="210,180 250,100 290,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="280,180 320,120 360,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="350,180 380,110 410,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="400,180 440,105 480,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>
      <polygon points="470,180 500,115 530,180" fill="#ECE5D3" stroke="#5C5345" stroke-width="1"/>

      <!-- row 2 (further back) -->
      <polygon points="35,260 70,210 110,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1"/>
      <polygon points="110,260 150,200 190,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1"/>
      <polygon points="190,260 230,205 280,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1"/>
      <polygon points="280,260 320,210 370,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1"/>
      <polygon points="370,260 410,215 450,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1"/>
      <polygon points="450,260 490,205 540,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1"/>

      <!-- AI agent lost line -->
      <path d="M 20 290 Q 80 230 110 270 Q 150 220 200 280 Q 240 240 290 290 Q 340 260 400 290 Q 450 270 540 295" fill="none" stroke="#B85A3A" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="20" cy="290" r="4" fill="#B85A3A"/>
      <text x="0" y="320" font-size="12" font-family="SF Mono, Menlo, monospace" letter-spacing="2" fill="#B85A3A">AI 在浅模块间绕路 · 上下文耗光</text>
    </g>

    <text x="0" y="430" font-size="13" fill="#5C5345">• interface ≈ implementation 厚度</text>
    <text x="0" y="455" font-size="13" fill="#5C5345">• 每个 module 都要读才能理解依赖</text>
    <text x="0" y="480" font-size="13" fill="#5C5345">• AI 容易在没读完前提下做局部修改</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="180" x2="600" y2="700" stroke="#ECE5D3" stroke-width="2"/>

  <!-- RIGHT: deep modules -->
  <g transform="translate(640,200)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#2A241B">深模块 codebase</text>
    <text x="0" y="24" font-size="12" fill="#5C5345" font-family="SF Mono, Menlo, monospace" letter-spacing="2">DEEP · 几座大山 · AI 在 interface 上委托</text>

    <g transform="translate(0,60)">
      <!-- few tall mountains -->
      <polygon points="20,260 130,40 240,260" fill="#ECE5D3" stroke="#5C5345" stroke-width="1.5"/>
      <polygon points="240,260 360,80 480,260" fill="#ECE5D3" stroke="#5C5345" stroke-width="1.5"/>
      <polygon points="420,260 500,50 580,260" fill="#FFFEFA" stroke="#8A8472" stroke-width="1.5"/>

      <!-- interface ridges on top -->
      <line x1="100" y1="80" x2="160" y2="80" stroke="#B85A3A" stroke-width="3"/>
      <text x="130" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#B85A3A">interface</text>

      <line x1="330" y1="120" x2="390" y2="120" stroke="#B85A3A" stroke-width="3"/>
      <text x="360" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#B85A3A">interface</text>

      <line x1="470" y1="90" x2="530" y2="90" stroke="#B85A3A" stroke-width="3"/>
      <text x="500" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#B85A3A">interface</text>

      <!-- AI direct path on top ridges -->
      <path d="M 130 78 L 360 118 L 500 88" fill="none" stroke="#B85A3A" stroke-width="2.5"/>
      <circle cx="130" cy="78" r="5" fill="#B85A3A"/>
      <circle cx="360" cy="118" r="5" fill="#B85A3A"/>
      <circle cx="500" cy="88" r="5" fill="#B85A3A"/>

      <text x="0" y="320" font-size="12" font-family="SF Mono, Menlo, monospace" letter-spacing="2" fill="#B85A3A">AI 沿接口走 · 内部留作灰盒</text>
    </g>

    <text x="0" y="430" font-size="13" fill="#5C5345">• interface 简单 · implementation 复杂</text>
    <text x="0" y="455" font-size="13" fill="#5C5345">• 几个 module 足够覆盖大部分功能</text>
    <text x="0" y="480" font-size="13" fill="#5C5345">• AI 在 interface 上做决策 · 委托内部</text>
  </g>

  <text x="80" y="735" font-family="SF Mono, Menlo, monospace" font-size="10" letter-spacing="3" fill="#8A8472">AI FORCE · 慕铭整理 · 出处：A PHILOSOPHY OF SOFTWARE DESIGN · OUSTERHOUT</text>
</svg>
