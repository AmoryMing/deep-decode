<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="PingFang SC, Inter, sans-serif">
  <rect width="1200" height="750" fill="#F7F1E8"/>

  <text x="80" y="80" font-size="34" font-weight="700" fill="#2A241B">两种闭环：specs-to-code vs Pocock</text>
  <text x="80" y="116" font-size="16" fill="#5C5345" font-style="italic" font-family="Cormorant Garamond, Songti SC, serif">一种把代码当编译产物，一种把接口当合约</text>
  <line x1="80" y1="138" x2="320" y2="138" stroke="#B85A3A" stroke-width="2"/>

  <!-- left loop: specs-to-code -->
  <g transform="translate(80,200)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#2A241B">specs-to-code 闭环</text>
    <text x="0" y="24" font-size="12" fill="#5C5345" font-family="SF Mono, Menlo, monospace" letter-spacing="2">CODE IS CHEAP · 越跑越烂</text>

    <!-- circle nodes -->
    <g transform="translate(260,260)">
      <circle r="240" fill="none" stroke="#8A8472" stroke-width="1.5" stroke-dasharray="4,4"/>
      <!-- node 1 -->
      <g transform="translate(0,-240)">
        <rect x="-80" y="-30" width="160" height="60" fill="#FFFEFA" stroke="#2A241B" stroke-width="1.5" rx="4"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="600" fill="#2A241B">写 spec</text>
      </g>
      <!-- node 2 -->
      <g transform="translate(240,0)">
        <rect x="-80" y="-30" width="160" height="60" fill="#FFFEFA" stroke="#2A241B" stroke-width="1.5" rx="4"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="600" fill="#2A241B">跑 AI compiler</text>
      </g>
      <!-- node 3 (bad) -->
      <g transform="translate(0,240)">
        <rect x="-80" y="-30" width="160" height="60" fill="#ECE5D3" stroke="#B85A3A" stroke-width="1.5" rx="4"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="600" fill="#B85A3A">代码越来越烂</text>
      </g>
      <!-- node 4 -->
      <g transform="translate(-240,0)">
        <rect x="-80" y="-30" width="160" height="60" fill="#FFFEFA" stroke="#2A241B" stroke-width="1.5" rx="4"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="600" fill="#2A241B">回去改 spec</text>
      </g>

      <!-- arrow heads (approximate on circle) -->
      <polygon points="170,-170 180,-150 160,-150" fill="#B85A3A"/>
      <polygon points="170,170 160,150 180,150" fill="#B85A3A"/>
      <polygon points="-170,170 -180,150 -160,150" fill="#B85A3A"/>
      <polygon points="-170,-170 -160,-150 -180,-150" fill="#B85A3A"/>

      <!-- center diagnosis -->
      <text x="0" y="-6" text-anchor="middle" font-size="13" font-weight="700" fill="#2A241B">熵注入</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#5C5345">每圈累积</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="600" y1="180" x2="600" y2="700" stroke="#ECE5D3" stroke-width="2"/>

  <!-- right loop: Pocock -->
  <g transform="translate(640,200)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#2A241B">Pocock 的设计闭环</text>
    <text x="0" y="24" font-size="12" fill="#5C5345" font-family="SF Mono, Menlo, monospace" letter-spacing="2">DESIGN THE INTERFACE · 灰盒委托</text>

    <g transform="translate(260,260)">
      <circle r="240" fill="none" stroke="#8A8472" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g transform="translate(0,-240)">
        <rect x="-90" y="-30" width="180" height="60" fill="#FFFEFA" stroke="#2A241B" stroke-width="1.5" rx="4"/>
        <text x="0" y="-2" text-anchor="middle" font-size="14" font-weight="600" fill="#2A241B">grill-me 对齐</text>
        <text x="0" y="18" text-anchor="middle" font-size="11" fill="#5C5345">design concept</text>
      </g>
      <g transform="translate(240,0)">
        <rect x="-90" y="-30" width="180" height="60" fill="#FFFEFA" stroke="#2A241B" stroke-width="1.5" rx="4"/>
        <text x="0" y="-2" text-anchor="middle" font-size="14" font-weight="600" fill="#2A241B">定 interface</text>
        <text x="0" y="18" text-anchor="middle" font-size="11" fill="#5C5345">deep module 边界</text>
      </g>
      <g transform="translate(0,240)">
        <rect x="-90" y="-30" width="180" height="60" fill="#ECE5D3" stroke="#B85A3A" stroke-width="1.5" rx="4"/>
        <text x="0" y="-2" text-anchor="middle" font-size="14" font-weight="600" fill="#B85A3A">委托 AI 实现</text>
        <text x="0" y="18" text-anchor="middle" font-size="11" fill="#5C5345">TDD 卡步长</text>
      </g>
      <g transform="translate(-240,0)">
        <rect x="-90" y="-30" width="180" height="60" fill="#FFFEFA" stroke="#2A241B" stroke-width="1.5" rx="4"/>
        <text x="0" y="-2" text-anchor="middle" font-size="14" font-weight="600" fill="#2A241B">测试验 interface</text>
        <text x="0" y="18" text-anchor="middle" font-size="11" fill="#5C5345">不读内部代码</text>
      </g>

      <polygon points="170,-170 180,-150 160,-150" fill="#B85A3A"/>
      <polygon points="170,170 160,150 180,150" fill="#B85A3A"/>
      <polygon points="-170,170 -180,150 -160,150" fill="#B85A3A"/>
      <polygon points="-170,-170 -160,-150 -180,-150" fill="#B85A3A"/>

      <text x="0" y="-6" text-anchor="middle" font-size="13" font-weight="700" fill="#2A241B">设计资产</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#5C5345">每圈复利</text>
    </g>
  </g>

  <text x="80" y="735" font-family="SF Mono, Menlo, monospace" font-size="10" letter-spacing="3" fill="#8A8472">AI FORCE · 慕铭整理</text>
</svg>
