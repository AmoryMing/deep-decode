<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="PingFang SC, Inter, sans-serif">
  <rect width="1200" height="750" fill="#F7F1E8"/>

  <text x="80" y="80" font-size="34" font-weight="700" fill="#2A241B">反馈速率即速度上限</text>
  <text x="80" y="116" font-size="16" fill="#5C5345" font-style="italic" font-family="Cormorant Garamond, Songti SC, serif">"The rate of feedback is your speed limit." — Pragmatic Programmer</text>
  <line x1="80" y1="138" x2="280" y2="138" stroke="#B85A3A" stroke-width="2"/>

  <!-- axes -->
  <g transform="translate(120,200)">
    <!-- chart area -->
    <rect x="0" y="0" width="1000" height="420" fill="#FFFEFA" stroke="#ECE5D3" stroke-width="1" rx="4"/>

    <!-- x axis -->
    <line x1="80" y1="380" x2="960" y2="380" stroke="#2A241B" stroke-width="1.5"/>
    <text x="500" y="408" text-anchor="middle" font-size="13" font-family="SF Mono, Menlo, monospace" letter-spacing="2" fill="#5C5345">代码累计行数 →</text>

    <!-- y axis -->
    <line x1="80" y1="40" x2="80" y2="380" stroke="#2A241B" stroke-width="1.5"/>
    <text x="40" y="220" text-anchor="middle" font-size="13" font-family="SF Mono, Menlo, monospace" letter-spacing="2" fill="#5C5345" transform="rotate(-90 40 220)">质量 / 可控性</text>

    <!-- Pocock curve (steady) -->
    <path d="M 80 100 Q 280 110 480 130 T 880 180" fill="none" stroke="#B85A3A" stroke-width="3"/>
    <circle cx="880" cy="180" r="6" fill="#B85A3A"/>
    <text x="900" y="175" font-size="14" font-weight="700" fill="#B85A3A">TDD · 小步反馈</text>
    <text x="900" y="195" font-size="11" fill="#5C5345">代码可控质量随时间稳态衰减</text>

    <!-- specs-to-code curve (collapse) -->
    <path d="M 80 100 Q 280 130 380 200 Q 500 320 720 360 T 880 370" fill="none" stroke="#2A241B" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="880" cy="370" r="6" fill="#2A241B"/>
    <text x="600" y="280" font-size="14" font-weight="700" fill="#2A241B">specs-to-code 重跑 compiler</text>
    <text x="600" y="300" font-size="11" fill="#5C5345">熵在每一次"局部最优"里累积</text>

    <!-- horizon line: outrun headlights -->
    <line x1="80" y1="240" x2="960" y2="240" stroke="#8A8472" stroke-width="1" stroke-dasharray="3,4"/>
    <text x="100" y="232" font-size="11" font-family="SF Mono, Menlo, monospace" letter-spacing="2" fill="#8A8472">OUTRUNNING-HEADLIGHTS LINE</text>
  </g>

  <!-- caption -->
  <text x="80" y="680" font-size="14" fill="#5C5345">AI 的默认动作是"一口气写一大段再回头检查" — 在 outrun own headlights line 之上，</text>
  <text x="80" y="704" font-size="14" fill="#5C5345">每一步都比上一次更脱离反馈。TDD 把步长卡回反馈速率以下，是给 AI 装制动器。</text>

  <text x="80" y="735" font-family="SF Mono, Menlo, monospace" font-size="10" letter-spacing="3" fill="#8A8472">AI FORCE · 慕铭整理</text>
</svg>
