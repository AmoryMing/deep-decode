<script>
// 这两段 IIFE 跟 Discourse plugin API 无关,放在普通 script 里,
// 不会跟 api.addSidebarSection 互相影响

// ============== 注册表单:无邮箱模式 ==============
// 潮汐社用户名 + 密码即可,不强制邮箱(密码忘了账号就没)。
// Discourse 数据库结构 email 必填,所以保留字段但 hide + auto-fill 假邮箱。
// 配套 site_setting:disable_emails=non-staff(不发验证邮件)
//                  + auto_approve_email_domains=tide.local(假邮箱免审)
//                  + enable_local_logins_via_email=false(强制 username 登录)
(function tideSignupCustomize() {
  function getEmailInput(form) {
    return form.querySelector('input[type="email"]') ||
           form.querySelector('input[name="email"]') ||
           form.querySelector('.email-input input, [data-account-create-input="email"], #new-account-email');
  }
  function getUsernameInput(form) {
    return form.querySelector('input[name="username"]') ||
           form.querySelector('.username-input input, [data-account-create-input="username"], #new-account-username');
  }
  function injectBanner(form) {
    if (form.querySelector('.tide-signup-banner')) return;
    const banner = document.createElement('div');
    banner.className = 'tide-signup-banner';
    banner.innerHTML = '🦞 <strong>潮汐社用户名 + 密码即可</strong>,不需要邮箱。<br>⚠️ <strong>密码忘了账号就没</strong>(无法找回)—— 请记牢。';
    form.insertBefore(banner, form.firstChild);
  }
  function customize() {
    const forms = document.querySelectorAll('.create-account, .create-account-form, .signup-form, .invites-show .signup-form-fields, form.signup-fullpage');
    forms.forEach(form => {
      if (form.dataset.tideSignupDone === '1') return;
      const usernameInput = getUsernameInput(form);
      const emailInput = getEmailInput(form);
      if (!usernameInput) return; // 不是 signup 表单,跳过
      form.dataset.tideSignupDone = '1';
      injectBanner(form);
      if (emailInput) {
        function syncEmail() {
          const u = (usernameInput.value || '').trim();
          if (u) {
            emailInput.value = u + '@tide.local';
            // 通知 Ember 数据双绑
            emailInput.dispatchEvent(new Event('input', {bubbles: true}));
            emailInput.dispatchEvent(new Event('change', {bubbles: true}));
          }
        }
        usernameInput.addEventListener('input', syncEmail);
        usernameInput.addEventListener('blur', syncEmail);
        syncEmail();
        // 提交前再同步一次保险
        form.addEventListener('submit', syncEmail, true);
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', customize);
  else customize();
  setInterval(customize, 800);
})();

// ============== topic 列表缩略图:tidetoc/clawtalk 行内贴图 ==============
(function tideTopicThumbnails() {
  const TARGET_CATS = new Set([34, 35, 36]);  // tidetoc, clawtalk, hailuo
  const imageCache = new Map();
  const VIDEO_EXT = /\.(mp4|webm|mov)(\?|$)/i;
  const IMG_EXT   = /\.(jpe?g|png|gif|webp|heic|heif|avif|svg)(\?|$)/i;

  function getCategoryId(row) {
    const a = row.getAttribute('data-category-id');
    if (a) return parseInt(a, 10);
    const badge = row.querySelector('[data-category-id]');
    if (badge) return parseInt(badge.getAttribute('data-category-id'), 10);
    return null;
  }

  async function fetchTopicImage(topicId) {
    if (imageCache.has(topicId)) return imageCache.get(topicId);
    imageCache.set(topicId, null);
    try {
      const r = await fetch('/t/' + topicId + '.json');
      const data = await r.json();
      let url = data.image_url || null;
      if (!url) {
        const post = data.post_stream && data.post_stream.posts && data.post_stream.posts[0];
        if (post && post.cooked) {
          const div = document.createElement('div');
          div.innerHTML = post.cooked;
          const img = div.querySelector('img:not(.emoji):not(.avatar):not(.site-logo)');
          if (img) url = img.src;
          if (!url) {
            const src = div.querySelector('video source[src], video[src]');
            if (src) url = src.getAttribute('src') || src.src;
          }
        }
      }
      imageCache.set(topicId, url);
      return url;
    } catch (e) { return null; }
  }

  function makeThumb(url) {
    const thumb = document.createElement('div');
    thumb.className = 'tide-topic-thumb';
    if (VIDEO_EXT.test(url)) {
      // 视频:列表缩略图不加载 <video>(高清视频会卡)
      // 只显示一个深底 + ▶ 角标的占位,点击进 topic 才看真视频
      thumb.classList.add('tide-topic-thumb-video');
      thumb.innerHTML = '<span class="tide-thumb-badge">▶ 视频</span>';
    } else {
      thumb.innerHTML = '<img src="' + url + '" loading="lazy">';
    }
    return thumb;
  }

  async function decorateRow(row) {
    if (row.dataset.tideThumbed === '1') return;
    const topicId = parseInt(row.getAttribute('data-topic-id') || '0', 10);
    if (!topicId) return;
    const catId = getCategoryId(row);
    if (!TARGET_CATS.has(catId)) return;
    row.dataset.tideThumbed = '1';
    const url = await fetchTopicImage(topicId);
    if (!url) return;
    if (row.dataset.tideThumbInjected === '1') return;
    row.dataset.tideThumbInjected = '1';
    const main = row.querySelector('.main-link, .topic-list-item-main, .link-bottom-line, td.main-link') || row.firstElementChild || row;
    const thumb = makeThumb(url);
    main.insertBefore(thumb, main.firstChild);
  }

  function decorateAll() {
    document.querySelectorAll('tr.topic-list-item[data-topic-id], .topic-list-item[data-topic-id]').forEach(decorateRow);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', decorateAll);
  else decorateAll();
  setInterval(decorateAll, 1500);
})();

// ============== 全站自动修视频:<img src=*.mp4> → <video> ==============
(function rewriteVideoImagesGlobal() {
  function rewrite() {
    document.querySelectorAll('img[src*=".mp4"], img[src*=".webm"], img[src*=".mov"]').forEach(img => {
      if (img.dataset.videoRewritten === '1') return;
      const src = img.getAttribute('src') || '';
      if (!/\.(mp4|webm|mov)(\?|$)/i.test(src)) return;
      img.dataset.videoRewritten = '1';
      const video = document.createElement('video');
      video.controls = true;
      video.preload = 'none';  // 不预加载,避免高清视频卡;用户点击后才下载
      video.style.maxWidth = '100%';
      video.style.maxHeight = '480px';
      video.style.borderRadius = '8px';
      video.style.background = '#000';
      const source = document.createElement('source');
      source.src = src;
      const ext = (src.match(/\.(mp4|webm|mov)/i) || [,'mp4'])[1].toLowerCase();
      source.type = ext === 'mov' ? 'video/quicktime' : ('video/' + ext);
      video.appendChild(source);
      img.parentNode.replaceChild(video, img);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', rewrite);
  else rewrite();
  setInterval(rewrite, 1500);
})();
</script>
