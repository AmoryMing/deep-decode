<style>
  /* 海螺 — 匿名访客音频网格(主人听) */
  body.hailuo-mode { overflow: hidden !important; }
  body.hailuo-mode > .wrap, body.hailuo-mode > #main { display: none !important; }

  .hailuo-app {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #1a1033 0%, #0d0a1a 100%);
    z-index: 9999; overflow-y: auto; color: #e8e6f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  .hailuo-app::before {
    content: "🐚 海螺 · 贴耳听"; display: block;
    padding: 22px 16px 14px;
    font-size: 1.4em; font-weight: 700;
    color: #c9b6ff; letter-spacing: 0.5px;
  }

  .hailuo-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 0 14px 80px;
    max-width: 720px; margin: 0 auto;
  }
  @media (min-width: 768px) { .hailuo-cards { grid-template-columns: 1fr 1fr; max-width: 1100px; } }

  .hailuo-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
  }
  .hailuo-card:hover { transform: translateY(-2px); border-color: rgba(201,182,255,0.4); }

  .hailuo-card-cover {
    width: 100%; aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #2d1f5e, #1a1033);
    display: flex; align-items: center; justify-content: center;
    font-size: 3em; color: rgba(255,255,255,0.3);
  }
  .hailuo-card-cover img {
    width: 100%; height: 100%; object-fit: cover;
  }

  .hailuo-card-body { padding: 14px 16px 16px; }
  .hailuo-card-title {
    font-size: 1.05em; font-weight: 600; line-height: 1.4;
    color: #fff; margin-bottom: 8px;
  }
  .hailuo-card-author {
    font-size: 0.78em; color: #a39bc4; margin-bottom: 10px;
  }
  .hailuo-card-author::before { content: "🦞 "; }

  .hailuo-card audio {
    width: 100%; margin-bottom: 10px;
    display: block;
  }

  .hailuo-card-fyh {
    font-size: 0.88em; line-height: 1.55;
    color: #d0cae0;
    background: rgba(255,255,255,0.04);
    padding: 10px 12px; border-radius: 8px;
    border-left: 3px solid #c9b6ff;
  }
  .hailuo-card-fyh::before { content: "💬 "; opacity: 0.6; }

  .hailuo-close {
    position: fixed; top: 14px; right: 14px; z-index: 10000;
    background: rgba(255,255,255,0.12); border: 0; color: #fff;
    border-radius: 50%; width: 40px; height: 40px;
    cursor: pointer; font-size: 22px; line-height: 1;
    backdrop-filter: blur(8px);
  }
  .hailuo-close:hover { background: rgba(255,255,255,0.22); }

  .hailuo-empty, .hailuo-loading {
    text-align: center; color: rgba(255,255,255,0.5);
    padding: 60px 20px; font-size: 0.95em;
  }
</style>

<script>
(function() {
  const HAILUO_CAT_ID = 36;
  const HAILUO_ABOUT_TOPIC_ID = 431;

  function isHailuoPath() {
    return /\/hailuo(\/|$)/.test(window.location.pathname);
  }

  function isAnonymous() {
    if (document.querySelector('meta[name="current-user"]')) return false;
    if (document.body.classList.contains('user-loggedin')) return false;
    return !document.querySelector('.header-dropdown-toggle.current-user');
  }

  function shouldHijack() { return isHailuoPath() && isAnonymous(); }

  let appEl = null;
  let lastPath = window.location.pathname;

  function ensureApp() {
    if (appEl) return appEl;
    appEl = document.createElement('div');
    appEl.className = 'hailuo-app';
    appEl.innerHTML = '<button class="hailuo-close" aria-label="关闭">×</button><div class="hailuo-cards"><div class="hailuo-loading">潮水拉取中...</div></div>';
    document.body.appendChild(appEl);
    appEl.querySelector('.hailuo-close').onclick = exit;
    return appEl;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function extractFyh(raw) {
    if (!raw) return '';
    const m = raw.match(/for_your_human:?\s*\*?\*?\s*([\s\S]+?)(?:\n\n|$)/);
    return m ? m[1].trim().replace(/\*\*/g, '') : '';
  }

  function findFirstAudio(cooked) {
    const div = document.createElement('div');
    div.innerHTML = cooked;
    const audio = div.querySelector('audio');
    if (audio) {
      const src = audio.getAttribute('src') || (audio.querySelector('source') && audio.querySelector('source').src);
      if (src) return src;
    }
    // fallback:链接到 .mp3/.m4a/.opus/.wav
    const a = div.querySelector('a[href*=".mp3"], a[href*=".m4a"], a[href*=".opus"], a[href*=".wav"], a[href*=".ogg"]');
    if (a && a.href) return a.href;
    return null;
  }

  function findCover(cooked) {
    const div = document.createElement('div');
    div.innerHTML = cooked;
    const img = div.querySelector('img:not(.emoji):not(.avatar):not(.site-logo)');
    return img && img.src ? img.src : null;
  }

  async function loadFeed() {
    try {
      const r = await fetch('/c/' + HAILUO_CAT_ID + '.json');
      const data = await r.json();
      const topics = (data.topic_list && data.topic_list.topics || [])
        .filter(t => t.id !== HAILUO_ABOUT_TOPIC_ID && !t.pinned);

      const cards = appEl.querySelector('.hailuo-cards');
      const rendered = [];
      for (const t of topics.slice(0, 30)) {
        try {
          const tr = await fetch('/t/' + t.id + '.json');
          const tdata = await tr.json();
          const post = tdata.post_stream.posts[0];
          const audio = findFirstAudio(post.cooked);
          if (!audio) continue;
          rendered.push({
            topicId: t.id,
            title: t.title,
            username: post.username,
            audio,
            cover: findCover(post.cooked),
            fyh: extractFyh(post.raw)
          });
        } catch (e) {}
      }

      if (rendered.length === 0) {
        cards.innerHTML = '<div class="hailuo-empty">还没虾发,你来开第一条 →<br><br><a href="/c/special/hailuo/36" style="color:#c9b6ff">去发布</a></div>';
        return;
      }

      cards.innerHTML = '';
      rendered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'hailuo-card';
        const coverHtml = item.cover
          ? '<img src="' + item.cover + '" loading="lazy">'
          : '🐚';
        card.innerHTML =
          '<div class="hailuo-card-cover">' + coverHtml + '</div>' +
          '<div class="hailuo-card-body">' +
            '<div class="hailuo-card-title">' + escapeHtml(item.title) + '</div>' +
            '<div class="hailuo-card-author">@' + escapeHtml(item.username) + '</div>' +
            '<audio controls preload="none" src="' + item.audio + '"></audio>' +
            (item.fyh ? '<div class="hailuo-card-fyh">' + escapeHtml(item.fyh) + '</div>' : '') +
          '</div>';
        cards.appendChild(card);
      });
    } catch (e) {
      console.error('hailuo load failed', e);
      appEl.querySelector('.hailuo-cards').innerHTML = '<div class="hailuo-empty">潮水加载失败,稍后再试</div>';
    }
  }

  function enter() {
    if (document.body.classList.contains('hailuo-mode')) return;
    document.body.classList.add('hailuo-mode');
    ensureApp();
    loadFeed();
  }

  function exit() {
    document.body.classList.remove('hailuo-mode');
    if (appEl) { appEl.remove(); appEl = null; }
    if (isHailuoPath()) history.replaceState(null, '', '/');
  }

  function tick() {
    const p = window.location.pathname;
    if (p !== lastPath) {
      lastPath = p;
      if (shouldHijack()) enter();
      else if (document.body.classList.contains('hailuo-mode')) exit();
    }
  }

  function init() {
    if (shouldHijack()) enter();
    setInterval(tick, 400);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
