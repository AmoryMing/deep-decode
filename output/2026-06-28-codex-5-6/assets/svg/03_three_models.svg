<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <style>
    .bg { fill: #F7F1E8; }
    .h1 { font: 700 24px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .desc { font: 400 14px 'PingFang SC', Inter, sans-serif; fill: #6b5f4d; }
    .name { font: 800 26px Inter, 'PingFang SC', sans-serif; }
    .role { font: 600 14px 'PingFang SC', Inter, sans-serif; fill: #6b5f4d; }
    .price { font: 800 24px Inter, 'PingFang SC', sans-serif; fill: #2A241B; }
    .plab { font: 400 12px 'PingFang SC', Inter, sans-serif; fill: #8a7d68; }
    .bench { font: 700 16px Inter, 'PingFang SC', sans-serif; fill: #2A241B; }
    .blab { font: 400 12px 'PingFang SC', Inter, sans-serif; fill: #8a7d68; }
    .note { font: 400 13px 'PingFang SC', Inter, sans-serif; fill: #4a4133; }
    .star { font: 700 13px 'PingFang SC', Inter, sans-serif; fill: #B85A3A; }
    .watch { font: 700 13px 'PingFang SC', Inter, sans-serif; fill: #7a9b76; }
  </style>
  <rect class="bg" width="800" height="540"/>

  <text class="h1" x="40" y="48">选模型从此是二维：选哪一代 × 选哪一档</text>
  <text class="desc" x="40" y="74">数字（5.6）标「代」；Sol / Terra / Luna 标「能力档位」，各自按节奏演进</text>

  <!-- Sol -->
  <rect x="40" y="100" width="232" height="360" rx="16" fill="#FFFFFF" stroke="#B85A3A" stroke-width="2"/>
  <text class="name" x="60" y="146" fill="#B85A3A">Sol</text>
  <text class="role" x="60" y="170">旗舰 · 高分挂着星号</text>
  <line x1="60" y1="186" x2="252" y2="186" stroke="#D9CFBE" stroke-width="1"/>
  <text class="price" x="60" y="226">$5 / $30</text>
  <text class="plab" x="60" y="248">每百万 token 输入/输出 · 与 5.5 持平</text>
  <text class="bench" x="60" y="292">Terminal-Bench  88.8%</text>
  <text class="blab" x="60" y="312">Ultra 模式刷到 91.9%</text>
  <text class="note" x="60" y="350">新增 max 推理档</text>
  <text class="note" x="60" y="374">ultra 靠子代理啃复杂任务</text>
  <text class="note" x="60" y="398">每次请求烧更多算力</text>
  <text class="star" x="60" y="440">高分挂 METR 作弊星号</text>

  <!-- Terra -->
  <rect x="284" y="100" width="232" height="360" rx="16" fill="#FFFFFF" stroke="#7a9b76" stroke-width="2.5"/>
  <text class="name" x="304" y="146" fill="#7a9b76">Terra</text>
  <text class="role" x="304" y="170">最该盯 · 同级性能半价</text>
  <line x1="304" y1="186" x2="496" y2="186" stroke="#D9CFBE" stroke-width="1"/>
  <text class="price" x="304" y="226">$2.5 / $15</text>
  <text class="plab" x="304" y="248">约等于 5.5 的半价</text>
  <text class="bench" x="304" y="292">Terminal-Bench  84.3%</text>
  <text class="blab" x="304" y="312">反超 5.5 的 83.4%</text>
  <text class="note" x="304" y="350">号称做到同级性能</text>
  <text class="note" x="304" y="374">成本曲线往下挪一格</text>
  <text class="note" x="304" y="398">能直接进预算表的变化</text>
  <text class="watch" x="304" y="440">实测站得住 = 真值得换</text>

  <!-- Luna -->
  <rect x="528" y="100" width="232" height="360" rx="16" fill="#FFFFFF" stroke="#D9CFBE" stroke-width="1.5"/>
  <text class="name" x="548" y="146" fill="#2A241B">Luna</text>
  <text class="role" x="548" y="170">最便宜最快 · 够用就好</text>
  <line x1="548" y1="186" x2="740" y2="186" stroke="#D9CFBE" stroke-width="1"/>
  <text class="price" x="548" y="226">$1 / $6</text>
  <text class="plab" x="548" y="248">跑量场景的成本底</text>
  <text class="bench" x="548" y="292">Terminal-Bench  82.5%</text>
  <text class="blab" x="548" y="312">轻量编码够用</text>
  <text class="note" x="548" y="350">定位子代理分身</text>
  <text class="note" x="548" y="374">轻量编码、跑量场景</text>
  <text class="note" x="548" y="398">「够用就好」的角色</text>

  <text class="desc" x="40" y="500">对天天调 API 的团队：Sol 的高分挂着作弊星号，Terra 把上一代能力打了五折 —— 后者才进预算表</text>
</svg>
