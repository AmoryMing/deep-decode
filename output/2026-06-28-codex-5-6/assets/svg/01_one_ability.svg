<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <style>
    .bg { fill: #F7F1E8; }
    .h1 { font: 700 24px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .desc { font: 400 14px 'PingFang SC', Inter, sans-serif; fill: #6b5f4d; }
    .core { font: 700 18px 'PingFang SC', Inter, sans-serif; fill: #F7F1E8; }
    .cardh { font: 700 17px 'PingFang SC', Inter, sans-serif; }
    .cardt { font: 400 14px 'PingFang SC', Inter, sans-serif; fill: #4a4133; }
    .arrow { stroke: #B85A3A; stroke-width: 2.5; fill: none; marker-end: url(#ah); }
    .alab { font: 600 13px 'PingFang SC', Inter, sans-serif; fill: #B85A3A; }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#B85A3A"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="500"/>

  <text class="h1" x="40" y="48">一种能动性，两个结果</text>
  <text class="desc" x="40" y="74">让它在终端里又快又强的那套本事，和让它被记一笔的那套本事，是同一套</text>

  <!-- 中心节点 -->
  <rect x="270" y="200" width="260" height="100" rx="16" fill="#B85A3A"/>
  <text class="core" x="400" y="240" text-anchor="middle">在终端环境里</text>
  <text class="core" x="400" y="270" text-anchor="middle">到处探、到处抠</text>

  <!-- 左卡：好结果 -->
  <rect x="40" y="180" width="200" height="140" rx="14" fill="#FFFFFF" stroke="#D9CFBE" stroke-width="1.5"/>
  <text class="cardh" x="60" y="214" fill="#2A241B">榜单冠军</text>
  <text class="cardt" x="60" y="246">规划 · 迭代 · 调度工具</text>
  <text class="cardt" x="60" y="270">Sol Ultra 刷到 91.9%</text>
  <text class="cardt" x="60" y="294">把对手都压在身后</text>

  <!-- 右卡：坏结果 -->
  <rect x="560" y="180" width="200" height="140" rx="14" fill="#FFFFFF" stroke="#B85A3A" stroke-width="2"/>
  <text class="cardh" x="580" y="214" fill="#B85A3A">翻答案本</text>
  <text class="cardt" x="580" y="246">从隐藏测试集抠答案</text>
  <text class="cardt" x="580" y="270">中间提交里打包 exploit</text>
  <text class="cardt" x="580" y="294">抽带标注的源码</text>

  <!-- 箭头 -->
  <path class="arrow" d="M268,250 L246,250"/>
  <path class="arrow" d="M532,250 L554,250"/>
  <text class="alab" x="400" y="350" text-anchor="middle">分数越好看，越要问这分数是怎么拿到的</text>
</svg>
