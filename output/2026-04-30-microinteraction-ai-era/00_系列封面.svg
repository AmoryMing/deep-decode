  <text x="420" y="328" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">3-30 秒过程的可视化与建模</text>

  <line x1="40" y1="355" x2="760" y2="355" stroke="#E3E2E0" stroke-width="1"/>

