<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FFFFFF"/>

  <text x="400" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#37352F">三层防护：你只能选一种，没第四种</text>
  <text x="400" y="62" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">无声失败的系统留给你的选项</text>

  <!-- Option 1 -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="230" height="280" rx="10" fill="#EBF5FF" stroke="#2383E2" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#2383E2"/>
    <text x="35" y="42" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="65" y="42" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#2383E2">人在环里</text>

    <text x="20" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">每一步让人确认</text>

    <rect x="20" y="105" width="190" height="0.8" fill="#E3E2E0"/>
    <text x="20" y="135" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">优点</text>
    <text x="20" y="158" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  最可靠</text>
    <text x="20" y="180" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  错误立即被抓</text>

    <text x="20" y="215" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">代价</text>
    <text x="20" y="238" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#EB5757">·  agent 自动化没了</text>
    <text x="20" y="260" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#EB5757">·  人力成本不可扩展</text>
  </g>

  <!-- Option 2 -->
  <g transform="translate(285, 100)">
    <rect x="0" y="0" width="230" height="280" rx="10" fill="#FFF8E1" stroke="#FFB020" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#FFB020"/>
    <text x="35" y="42" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="65" y="42" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#E6A010">穷尽审计</text>

    <text x="20" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">事后人工查所有输出</text>

    <rect x="20" y="105" width="190" height="0.8" fill="#E3E2E0"/>
    <text x="20" y="135" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">优点</text>
    <text x="20" y="158" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  agent 仍能跑</text>
    <text x="20" y="180" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  可批量处理</text>

    <text x="20" y="215" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">代价</text>
    <text x="20" y="238" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#EB5757">·  慢、贵</text>
    <text x="20" y="260" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#EB5757">·  漏检不可避免</text>
  </g>

  <!-- Option 3 -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="230" height="280" rx="10" fill="#FFF5F5" stroke="#EB5757" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#EB5757"/>
    <text x="35" y="42" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="65" y="42" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#EB5757">接受不验证</text>

    <text x="20" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">出了事再说</text>

    <rect x="20" y="105" width="190" height="0.8" fill="#E3E2E0"/>
    <text x="20" y="135" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">优点</text>
    <text x="20" y="158" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  零成本</text>
    <text x="20" y="180" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  跑得最快</text>

    <text x="20" y="215" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">代价</text>
    <text x="20" y="238" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#EB5757">·  代价不可控</text>
    <text x="20" y="260" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#EB5757">·  高风险场景禁用</text>
  </g>

  <!-- Bottom -->
  <rect x="40" y="415" width="720" height="40" rx="6" fill="#F7F7F5"/>
  <text x="400" y="432" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" font-weight="bold">没有第四个选项叫"加 prompt 让它自查"</text>
  <text x="400" y="450" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774" font-style="italic">那不是验证，那是请被告自证清白 —— 可编程验证不在清单里，因为它是前提，不是兜底</text>
</svg>
