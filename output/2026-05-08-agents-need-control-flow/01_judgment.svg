<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FFFFFF"/>

  <text x="400" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="bold" fill="#37352F">一行字判定：你的 agent 是不是已经失控了</text>
  <text x="400" y="64" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">grep 一下你的 prompt，命中即信号</text>

  <!-- Trigger words -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#37352F">命中即触发的关键词</text>
    <rect x="0" y="20" width="680" height="90" rx="8" fill="#FFF5F5" stroke="#EB5757" stroke-width="1.5"/>
    <text x="20" y="50" font-family="Menlo, monospace" font-size="14" fill="#EB5757">MANDATORY</text>
    <text x="160" y="50" font-family="Menlo, monospace" font-size="14" fill="#EB5757">DO NOT SKIP</text>
    <text x="320" y="50" font-family="Menlo, monospace" font-size="14" fill="#EB5757">IMPORTANT</text>
    <text x="460" y="50" font-family="Menlo, monospace" font-size="14" fill="#EB5757">YOU MUST</text>
    <text x="580" y="50" font-family="Menlo, monospace" font-size="14" fill="#EB5757">ALWAYS</text>
    <text x="20" y="85" font-family="Menlo, monospace" font-size="14" fill="#EB5757">NEVER</text>
    <text x="120" y="85" font-family="Menlo, monospace" font-size="14" fill="#EB5757">CRITICAL</text>
    <text x="240" y="85" font-family="Menlo, monospace" font-size="14" fill="#EB5757">UNDER NO CIRCUMSTANCES</text>
    <text x="500" y="85" font-family="Menlo, monospace" font-size="14" fill="#EB5757">!!!</text>
  </g>

  <!-- Diagnosis -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#37352F">这意味着</text>

    <rect x="0" y="20" width="320" height="180" rx="8" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="1.5"/>
    <text x="160" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#787774">表面：你在调试</text>
    <text x="20" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  跑 20 次跳过 3 次验证</text>
    <text x="20" y="110" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  加一行全大写 MANDATORY</text>
    <text x="20" y="135" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  跳过率 15% → 8%</text>
    <text x="20" y="160" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  松一口气，部署上线</text>
    <text x="20" y="185" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774" font-style="italic">看似工作了</text>

    <rect x="360" y="20" width="320" height="180" rx="8" fill="#FFF8E1" stroke="#FFB020" stroke-width="1.5"/>
    <text x="520" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#E6A010">实际：你在做语言学</text>
    <text x="380" y="85" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  用更强措辞驯服非确定性</text>
    <text x="380" y="110" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  这条路天然有上限</text>
    <text x="380" y="135" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  大写字母没有更大写</text>
    <text x="380" y="160" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">·  prompt 工程已经被榨干</text>
    <text x="380" y="185" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#E6A010" font-style="italic">该改架构了</text>
  </g>

  <!-- Bottom quote -->
  <rect x="60" y="445" width="680" height="0.8" fill="#E3E2E0"/>
  <text x="400" y="465" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774" font-style="italic">"prompt engineering 的尽头是把整本 RFC 抄进 system prompt" — HN 评论</text>
</svg>
