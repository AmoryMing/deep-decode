<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#FFFFFF"/>
  <text x="50" y="62" font-family="PingFang SC, Inter, sans-serif" font-size="28" font-weight="700" fill="#111827">两种桌宠路线</text>
  <rect x="60" y="105" width="315" height="320" rx="14" fill="#F7FAFC" stroke="#E3E2E0"/>
  <text x="218" y="145" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Claude buddy</text>
  <text x="218" y="178" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#6B7280">身份型伙伴</text>
  <rect x="100" y="220" width="235" height="52" rx="10" fill="#FFFFFF" stroke="#E3E2E0"/>
