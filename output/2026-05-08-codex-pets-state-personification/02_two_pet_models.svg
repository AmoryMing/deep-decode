  <rect x="100" y="292" width="235" height="52" rx="10" fill="#FFFFFF" stroke="#E3E2E0"/>
  <text x="218" y="324" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#374151">本地配置保存灵魂</text>
  <rect x="100" y="364" width="235" height="52" rx="10" fill="#FFFFFF" stroke="#E3E2E0"/>
  <text x="218" y="396" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#374151">扭蛋、稀有度、反作弊</text>
  <rect x="425" y="105" width="315" height="320" rx="14" fill="#EAF3FF" stroke="#2383E2" stroke-width="2"/>
  <text x="583" y="145" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Codex pets</text>
  <text x="583" y="178" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#4B5563">工作型状态层</text>
  <rect x="465" y="220" width="235" height="52" rx="10" fill="#FFFFFF" stroke="#B9D8FF"/>
