  <rect x="465" y="292" width="235" height="52" rx="10" fill="#FFFFFF" stroke="#B9D8FF"/>
  <text x="583" y="324" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#374151">running / waiting / review</text>
