<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <text x="50" y="62" font-family="PingFang SC, Inter, sans-serif" font-size="28" font-weight="700" fill="#111827">桌宠的位置：通知和主窗口之间</text>
  <line x1="120" y1="250" x2="680" y2="250" stroke="#E3E2E0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="250" r="42" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="3"/>
  <text x="160" y="244" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#111827">通知</text>
  <text x="160" y="268" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#6B7280">打断</text>
  <circle cx="400" cy="250" r="58" fill="#EAF3FF" stroke="#2383E2" stroke-width="4"/>
  <text x="400" y="244" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="17" font-weight="700" fill="#2383E2">桌宠</text>
  <text x="400" y="271" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#374151">常驻、低噪、可扫视</text>
  <circle cx="640" cy="250" r="42" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="3"/>
  <text x="640" y="244" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="700" fill="#111827">窗口</text>
  <text x="640" y="268" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#6B7280">占用</text>
  <rect x="100" y="345" width="600" height="72" rx="12" fill="#F7FAFC" stroke="#E3E2E0"/>
  <text x="400" y="375" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="700" fill="#111827">Agent 长任务需要连续反馈</text>
  <text x="400" y="402" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#6B7280">不适合每一步弹通知，也不适合让用户一直盯着线程</text>
</svg>
