<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#FFFFFF"/>
  <text x="50" y="62" font-family="PingFang SC, Inter, sans-serif" font-size="28" font-weight="700" fill="#111827">入口不是重复，是三种工作流</text>
  <rect x="70" y="125" width="180" height="110" rx="14" fill="#F7FAFC" stroke="#E3E2E0"/>
  <text x="160" y="166" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="700" fill="#111827">Settings</text>
  <text x="160" y="198" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#6B7280">选择 pet</text>
  <text x="160" y="220" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#6B7280">刷新自定义资源</text>
  <rect x="310" y="125" width="180" height="110" rx="14" fill="#EAF3FF" stroke="#2383E2" stroke-width="2"/>
  <text x="400" y="166" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="700" fill="#2383E2">/pet</text>
  <text x="400" y="198" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#374151">在对话里唤醒</text>
  <text x="400" y="220" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#374151">不中断当前线程</text>
  <rect x="550" y="125" width="180" height="110" rx="14" fill="#FFF7E8" stroke="#FFA500" stroke-width="2"/>
  <text x="640" y="166" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="700" fill="#9A5B00">Cmd+K</text>
  <text x="640" y="198" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#6B4E16">跨界面控制</text>
  <text x="640" y="220" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#6B4E16">Wake / Tuck Away</text>
  <path d="M160 250 C160 310 400 305 400 355" fill="none" stroke="#E3E2E0" stroke-width="3"/>
  <path d="M400 250 L400 352" stroke="#2383E2" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 250 C640 310 400 305 400 355" fill="none" stroke="#E3E2E0" stroke-width="3"/>
  <rect x="210" y="355" width="380" height="86" rx="16" fill="#FFFFFF" stroke="#2383E2" stroke-width="3"/>
  <text x="400" y="390" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="700" fill="#111827">可折叠的状态层</text>
  <text x="400" y="420" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="15" fill="#374151">它跟着工作流出现，也能随时退下</text>
</svg>
