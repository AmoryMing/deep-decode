<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" fill="#FFFFFF"/>

  <text x="40" y="50" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">控件代理化  ·  GUI 时代 40 年的转折</text>
  <text x="40" y="78" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">从"设计师穷举路径"到"模型 inference 时刻按意图拼出路径"</text>

  <line x1="40" y1="100" x2="760" y2="100" stroke="#E3E2E0" stroke-width="1"/>

  <!-- Left side: 旧范式 -->
  <g transform="translate(40, 130)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#787774">旧范式  ·  1973 — 2025</text>
    <rect x="0" y="14" width="320" height="280" rx="8" fill="#FAFAF9" stroke="#E3E2E0" stroke-width="1"/>
    <text x="20" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="700" fill="#37352F">离散控件 GUI</text>

    <text x="20" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">起点：施乐 PARC Alto, 1973</text>

    <!-- 模拟控件 -->
    <rect x="20" y="100" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#37352F" stroke-width="1"/>
    <text x="65" y="119" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">输入框</text>

    <rect x="120" y="100" width="70" height="28" rx="4" fill="#37352F"/>
    <text x="155" y="119" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">按钮</text>

    <rect x="200" y="100" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#37352F" stroke-width="1"/>
    <text x="250" y="119" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">下拉菜单</text>

    <text x="20" y="160" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">假设：把用户意图离散化成有限控件</text>
    <text x="20" y="184" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">设计：穷举用户路径 → 压缩成控件</text>
    <text x="20" y="208" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">交互：点击 → 触发预定义 API</text>
    <text x="20" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">交付：固定页面、固定组件库</text>
    <text x="20" y="270" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#EB5757" font-weight="600">瓶颈：用户意图永远比控件穷举更宽</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(380, 270)">
    <text x="0" y="-10" font-family="PingFang SC, Inter, sans-serif" font-size="28" fill="#2383E2" text-anchor="middle">→</text>
    <text x="0" y="20" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">推理成本</text>
    <text x="0" y="36" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">降 30%</text>
  </g>

  <!-- Right side: 新范式 -->
  <g transform="translate(420, 130)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#2383E2">新范式  ·  2026 —</text>
    <rect x="0" y="14" width="320" height="280" rx="8" fill="#F0F7FF" stroke="#2383E2" stroke-width="1"/>
    <text x="20" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="700" fill="#37352F">Generative UI</text>

    <text x="20" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">起点：Google I/O 2026 keynote</text>

    <!-- 模拟生成 UI -->
    <rect x="20" y="100" width="280" height="28" rx="4" fill="#FFFFFF" stroke="#2383E2" stroke-width="1"/>
    <text x="160" y="119" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">用户描述意图 ...</text>

    <rect x="20" y="136" width="135" height="28" rx="4" fill="#2383E2"/>
    <text x="87" y="155" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">现场拼出图表</text>

    <rect x="165" y="136" width="135" height="28" rx="4" fill="#4DB6AC"/>
    <text x="232" y="155" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">现场拼出 mini-app</text>

    <text x="20" y="195" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">假设：意图直接驱动 UI 生成</text>
    <text x="20" y="219" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">设计：组件 + 意图到组件的映射规则</text>
    <text x="20" y="243" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">交互：描述 → 模型现场组装</text>
    <text x="20" y="267" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" font-weight="600">应用概念在变薄</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="40" y="430" width="720" height="60" rx="6" fill="#FFF8E1"/>
  <text x="400" y="460" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" text-anchor="middle">三年前做不了：单次推理成本太高，每次生成 UI 毛利吃光</text>
  <text x="400" y="480" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">今年成立：Gemini 3.5 Flash + TPU 8i 把 AI response cost 较 Gemini 3 降 30%</text>
</svg>
