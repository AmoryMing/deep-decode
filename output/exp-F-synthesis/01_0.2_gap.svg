<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="600" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#222222">0.2 个百分点：噪声还是信号</text>
  <text x="600" y="90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">SWE-bench Verified 重测抖动通常 1-2 个百分点  ·  0.2 落在抖动范围内</text>

  <!-- Distribution band -->
  <rect x="200" y="180" width="800" height="80" fill="#F0F4F8" stroke="none"/>
  <text x="200" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#999999">79.0%</text>
  <text x="990" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#999999">82.0%</text>

  <text x="600" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#999999">典型重测抖动区间</text>

  <!-- Marker V4-Pro at 80.6 -->
  <line x1="624" y1="170" x2="624" y2="270" stroke="#FFA500" stroke-width="3"/>
  <circle cx="624" cy="220" r="9" fill="#FFA500"/>
  <text x="624" y="295" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FFA500">V4-Pro</text>
  <text x="624" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">80.6</text>

  <!-- Marker Opus at 80.8 -->
  <line x1="677" y1="170" x2="677" y2="270" stroke="#2383E2" stroke-width="3"/>
  <circle cx="677" cy="220" r="9" fill="#2383E2"/>
  <text x="677" y="155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2383E2">Opus 4.6</text>
  <text x="677" y="135" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">80.8</text>

  <!-- Annotation -->
  <text x="650" y="370" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#999999">两个标记之间的距离 = 0.2  ·  抖动带宽度 ≈ 1-2</text>

  <!-- Other benchmarks -->
  <line x1="200" y1="430" x2="1000" y2="430" stroke="#E0E0E0" stroke-width="1"/>
  <text x="600" y="465" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#222222">其它三个核心代码 benchmark：V4-Pro 全部走在前面</text>

  <text x="220" y="530" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">LiveCodeBench</text>
  <text x="220" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#FFA500">93.5</text>
  <text x="290" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#999999">vs Opus 88.8</text>
  <text x="220" y="580" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#999999">领先 4.7 点（超出噪声）</text>

  <text x="500" y="530" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">Codeforces Rating</text>
  <text x="500" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#FFA500">3206</text>
  <text x="590" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#999999">vs GPT-5.4 3168</text>
  <text x="500" y="580" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#999999">高 38 分（一个等级差）</text>

  <text x="780" y="530" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">Terminal-Bench 2.0</text>
  <text x="780" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#FFA500">67.9</text>
  <text x="850" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#999999">vs Opus 65.4</text>
  <text x="780" y="580" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#999999">领先 2.5 点</text>

  <text x="600" y="650" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">不是开源追平了。是开源在四列里有三列已经走在前面。</text>
</svg>
