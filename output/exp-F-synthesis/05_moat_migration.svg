<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="600" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#222222">护城河被迫迁移</text>
  <text x="600" y="90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">这一周确认的事：模型权重本身不再是护城河</text>

  <!-- Left side: Old moat (filled) -->
  <text x="280" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#999999">过去三年的护城河</text>

  <!-- Old moat box, with strikethrough effect -->
  <rect x="100" y="180" width="360" height="280" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="6,3"/>

  <text x="280" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle" fill="#999999">"我们手上有更强的模型"</text>

  <text x="125" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">○ 1T+ 训练稳定性</text>
  <text x="135" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#999999">→ mHC 已开源</text>

  <text x="125" y="325" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">○ 1M 上下文成本</text>
  <text x="135" y="345" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#999999">→ DSA 节约 73% FLOPs / 90% KV</text>

  <text x="125" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">○ 同代性能溢价</text>
  <text x="135" y="400" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#999999">→ 0.2 个百分点 vs 7.2 倍价差</text>

  <text x="280" y="445" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#FFA500">三个维度同时被开源</text>

  <!-- Arrow -->
  <path d="M 490 320 L 700 320" stroke="#2383E2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383E2"/>
    </marker>
  </defs>
  <text x="595" y="305" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#2383E2">迁移</text>

  <!-- Right side: New moat -->
  <text x="920" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#222222">未来 12 个月的护城河</text>

  <rect x="740" y="180" width="360" height="280" fill="#F0F4F8" stroke="#2383E2" stroke-width="2"/>

  <text x="920" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2383E2">政策 + 生态 + 部署</text>

  <text x="765" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#222222">● 安全合规护栏</text>
  <text x="775" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#666666">RSP 制度化为美/欧监管标准</text>

  <text x="765" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#222222">● 应用层 bundle</text>
  <text x="775" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#666666">Claude Design / 数字员工 / 上下文工程</text>

  <text x="765" y="375" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#222222">● 企业部署稳定性</text>
  <text x="775" y="395" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#666666">SLA / 合规 / 集成深度</text>

  <text x="765" y="430" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#222222">● 差异化训练做行业专版</text>

  <!-- Bottom note -->
  <line x1="200" y1="510" x2="1000" y2="510" stroke="#E0E0E0" stroke-width="1"/>

  <text x="600" y="555" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">如果你的 OKR 写过 "采用闭源 SOTA 是因为它领先 6-12 月"</text>
  <text x="600" y="585" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#666666">这周需要改成 "因为它在合规 / 生态 / 部署稳定性上领先"</text>

  <text x="600" y="640" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFA500">改这句话的过程，比追这周的 benchmark 数字有用得多</text>
</svg>
