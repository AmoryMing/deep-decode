<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <rect width="800" height="540" fill="#FFFFFF"/>

  <text x="40" y="56" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">TPU 8t / 8i：训推分家</text>
  <text x="40" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">训练和推理拆成两颗芯片——承认两类 workload 优化目标完全不同</text>

  <line x1="40" y1="105" x2="760" y2="105" stroke="#E3E2E0" stroke-width="1"/>

  <!-- Left card: TPU 8t -->
  <g transform="translate(40, 140)">
    <rect width="350" height="300" rx="10" fill="#FFF8E1" stroke="#FFB020" stroke-width="2"/>
    <text x="20" y="35" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFB020">TPU 8t · Training</text>
    <text x="20" y="60" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">一次性投入 / 决定模型有多强</text>

    <line x1="20" y1="80" x2="330" y2="80" stroke="#E3E2E0"/>

    <text x="20" y="110" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">硬件优化目标</text>
    <text x="20" y="138" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 堆 HBM 显存</text>
    <text x="20" y="162" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 高带宽 NVLink-equivalent</text>
    <text x="20" y="186" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· fp8 吞吐</text>
    <text x="20" y="210" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 长时间稳定性</text>

    <rect x="20" y="230" width="310" height="50" rx="6" fill="#FFFFFF"/>
    <text x="175" y="260" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#FFB020" text-anchor="middle">下一代 Gemini 在这上面训练</text>
  </g>

  <!-- Right card: TPU 8i -->
  <g transform="translate(410, 140)">
    <rect width="350" height="300" rx="10" fill="#E8F4E1" stroke="#4DB6AC" stroke-width="2"/>
    <text x="20" y="35" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#4DB6AC">TPU 8i · Inference</text>
    <text x="20" y="60" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">24/7 边际成本 / 决定平台能不能赚钱</text>

    <line x1="20" y1="80" x2="330" y2="80" stroke="#E3E2E0"/>

    <text x="20" y="110" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">硬件优化目标</text>
    <text x="20" y="138" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 压 KV cache</text>
    <text x="20" y="162" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 压延迟</text>
    <text x="20" y="186" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 压单 token 功耗</text>
    <text x="20" y="210" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">· 高并发吞吐</text>

    <rect x="20" y="230" width="310" height="50" rx="6" fill="#FFFFFF"/>
    <text x="175" y="260" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#4DB6AC" text-anchor="middle">3.5 Flash "半价"在这上面跑</text>
  </g>

  <!-- Bottom: 行业对比 -->
  <text x="40" y="475" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">行业对比</text>

  <g transform="translate(40, 490)">
    <rect width="720" height="30" rx="4" fill="#FAFAF9"/>
    <text x="20" y="20" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">NVIDIA：H100 vs L40S 也在做，但没把"训推分家"做成发布会主线 · Google 第一个明示这条路径</text>
  </g>
</svg>
