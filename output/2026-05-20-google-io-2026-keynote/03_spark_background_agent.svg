<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <rect width="800" height="540" fill="#FFFFFF"/>

  <text x="40" y="56" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">Spark：Agent 从聊天框搬到后台进程</text>
  <text x="40" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">24/7 跑在 Google Cloud 专属 VM；Halo UI 让任务变成系统级可见对象</text>

  <line x1="40" y1="105" x2="760" y2="105" stroke="#E3E2E0" stroke-width="1"/>

  <!-- Left side: ChatGPT 范式 -->
  <g transform="translate(40, 140)">
    <text x="170" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="600" fill="#787774" text-anchor="middle">ChatGPT 范式</text>
    <rect x="40" y="20" width="260" height="320" rx="20" fill="#FAFAF9" stroke="#E3E2E0" stroke-width="2"/>
    <!-- Phone notch -->
    <rect x="140" y="20" width="60" height="6" rx="3" fill="#E3E2E0"/>

    <!-- Chat screen -->
    <rect x="60" y="50" width="220" height="270" rx="6" fill="#FFFFFF"/>
    <text x="170" y="80" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774" text-anchor="middle">用户在前台等</text>

    <rect x="80" y="100" width="160" height="30" rx="15" fill="#F0F7FF"/>
    <text x="160" y="120" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">帮我订机票</text>

    <rect x="80" y="140" width="180" height="80" rx="6" fill="#F5F5F5"/>
    <text x="170" y="165" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" text-anchor="middle">正在思考...</text>
    <text x="170" y="185" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" text-anchor="middle">（用户必须盯着屏幕）</text>

    <rect x="60" y="280" width="220" height="32" rx="16" fill="#F5F5F5"/>
    <text x="170" y="301" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">输入消息...</text>
  </g>

  <!-- Right side: Spark 范式 -->
  <g transform="translate(420, 140)">
    <text x="170" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="600" fill="#2383E2" text-anchor="middle">Spark + Halo UI 范式</text>
    <rect x="40" y="20" width="260" height="320" rx="20" fill="#FAFAF9" stroke="#2383E2" stroke-width="2"/>
    <rect x="140" y="20" width="60" height="6" rx="3" fill="#E3E2E0"/>

    <!-- Notification 区 -->
    <rect x="60" y="50" width="220" height="65" rx="10" fill="#F0F7FF" stroke="#2383E2"/>
    <circle cx="80" cy="73" r="6" fill="#2383E2"/>
    <text x="96" y="77" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="600" fill="#2383E2">Spark · 正在执行</text>
    <text x="76" y="95" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">订机票任务</text>
    <!-- Progress bar -->
    <rect x="76" y="100" width="180" height="6" rx="3" fill="#E3E2E0"/>
    <rect x="76" y="100" width="120" height="6" rx="3" fill="#2383E2"/>

    <!-- 另一个任务 -->
    <rect x="60" y="130" width="220" height="65" rx="10" fill="#F0F7FF" stroke="#2383E2"/>
    <circle cx="80" cy="153" r="6" fill="#4DB6AC"/>
    <text x="96" y="157" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="600" fill="#4DB6AC">Spark · 后台</text>
    <text x="76" y="175" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">监控股价 + 自动整理周报</text>
    <rect x="76" y="180" width="180" height="6" rx="3" fill="#E3E2E0"/>
    <rect x="76" y="180" width="60" height="6" rx="3" fill="#4DB6AC"/>

    <!-- 锁屏入口 -->
    <text x="170" y="225" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">通知栏 · 锁屏 · Always-on Display</text>

    <rect x="60" y="240" width="220" height="80" rx="6" fill="#FFFFFF" stroke="#E3E2E0"/>
    <text x="170" y="265" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F" text-anchor="middle">用户睡觉时</text>
    <text x="170" y="285" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" text-anchor="middle">VM 在 Google Cloud 持续运行</text>
    <text x="170" y="305" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#4DB6AC" text-anchor="middle">系统级 UI 嵌入操作系统</text>
  </g>

  <text x="400" y="510" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774" text-anchor="middle">关键差异：前者需要用户在前台，后者把 Agent 变成"下载进度条"——可见但不打扰</text>
</svg>
