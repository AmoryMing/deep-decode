<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <rect width="800" height="540" fill="#FFFFFF"/>

  <text x="40" y="56" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">推理价折现：TPU 把 NVIDIA 的毛利让给客户</text>
  <text x="40" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">Gemini 3.5 Flash 价格仅同档模型一半，背后是芯片自研</text>

  <line x1="40" y1="105" x2="760" y2="105" stroke="#E3E2E0" stroke-width="1"/>

  <!-- Bar chart: 单 token 成本结构 -->
  <text x="40" y="140" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="600" fill="#37352F">同档推理：单 token 成本结构（示意）</text>

  <!-- OpenAI bar -->
  <text x="40" y="190" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">OpenAI on NVIDIA</text>
  <rect x="220" y="172" width="380" height="28" fill="#EB5757" opacity="0.85"/>
  <rect x="600" y="172" width="100" height="28" fill="#FFB020" opacity="0.85"/>
  <text x="410" y="191" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">NVIDIA 毛利 + 算力成本</text>
  <text x="650" y="191" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">毛利</text>
  <text x="710" y="191" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">$1.00</text>

  <!-- Google bar -->
  <text x="40" y="240" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">Google on TPU 8i</text>
  <rect x="220" y="222" width="180" height="28" fill="#4DB6AC" opacity="0.85"/>
  <rect x="400" y="222" width="40" height="28" fill="#FFB020" opacity="0.85"/>
  <text x="310" y="241" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">芯片 + 算力</text>
  <text x="450" y="241" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">$0.45</text>

  <!-- 折现箭头 -->
  <line x1="600" y1="265" x2="440" y2="265" stroke="#2383E2" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2383E2"/>
    </marker>
  </defs>
  <text x="520" y="285" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#2383E2" text-anchor="middle">省下的 NVIDIA 毛利 → 折现给客户</text>

  <!-- Lower: 控制三角 -->
  <line x1="40" y1="320" x2="760" y2="320" stroke="#E3E2E0" stroke-width="1"/>
  <text x="40" y="355" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="600" fill="#37352F">Google 同时控制四层（行业唯一）</text>

  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#F0F7FF" stroke="#2383E2"/>
    <text x="75" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#2383E2" text-anchor="middle">模型</text>
    <text x="75" y="70" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">Gemini</text>

    <rect x="170" y="0" width="150" height="100" rx="8" fill="#FFF8E1" stroke="#FFB020"/>
    <text x="245" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#FFB020" text-anchor="middle">芯片</text>
    <text x="245" y="70" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">TPU 8t / 8i</text>

    <rect x="340" y="0" width="150" height="100" rx="8" fill="#E8F4E1" stroke="#4DB6AC"/>
    <text x="415" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#4DB6AC" text-anchor="middle">超算集群</text>
    <text x="415" y="70" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">Google Cloud</text>

    <rect x="510" y="0" width="150" height="100" rx="8" fill="#FFEDED" stroke="#EB5757"/>
    <text x="585" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#EB5757" text-anchor="middle">数据中心</text>
    <text x="585" y="70" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" text-anchor="middle">$180B capex</text>
  </g>

  <text x="40" y="520" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">Anthropic 用 TPU + Trainium 拼装；OpenAI 卡在 NVIDIA 定价权；只有 Google 全栈自有</text>
</svg>
