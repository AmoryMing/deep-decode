<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#FFFFFF"/>

  <text x="40" y="56" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">Capex 5 年 6 倍：从财务科目到护城河深度</text>
  <text x="40" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">Google 年度资本开支：$31B (2022) → $180-190B (2026)</text>

  <line x1="40" y1="105" x2="760" y2="105" stroke="#E3E2E0" stroke-width="1"/>

  <!-- Chart area -->
  <g transform="translate(80, 140)">
    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="320" stroke="#E3E2E0" stroke-width="1"/>
    <!-- X axis -->
    <line x1="0" y1="320" x2="640" y2="320" stroke="#E3E2E0" stroke-width="1"/>

    <!-- Y axis labels -->
    <text x="-10" y="5" font-family="Inter, sans-serif" font-size="11" fill="#787774" text-anchor="end">$200B</text>
    <text x="-10" y="85" font-family="Inter, sans-serif" font-size="11" fill="#787774" text-anchor="end">$150B</text>
    <text x="-10" y="165" font-family="Inter, sans-serif" font-size="11" fill="#787774" text-anchor="end">$100B</text>
    <text x="-10" y="245" font-family="Inter, sans-serif" font-size="11" fill="#787774" text-anchor="end">$50B</text>
    <text x="-10" y="325" font-family="Inter, sans-serif" font-size="11" fill="#787774" text-anchor="end">$0</text>

    <!-- 横向网格线 -->
    <line x1="0" y1="80" x2="640" y2="80" stroke="#F5F5F5" stroke-dasharray="4 4"/>
    <line x1="0" y1="160" x2="640" y2="160" stroke="#F5F5F5" stroke-dasharray="4 4"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#F5F5F5" stroke-dasharray="4 4"/>

    <!-- Bars: 31, 60, 80, 120, 185 (B$) -->
    <!-- y = 320 - (val/200 * 320) -->
    <!-- 31 → 320-49.6=270.4, height=49.6 -->
    <rect x="40" y="270" width="80" height="50" fill="#2383E2" opacity="0.4"/>
    <text x="80" y="262" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">$31B</text>
    <text x="80" y="340" font-family="Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">2022</text>

    <!-- 60 -->
    <rect x="160" y="224" width="80" height="96" fill="#2383E2" opacity="0.55"/>
    <text x="200" y="216" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">$60B</text>
    <text x="200" y="340" font-family="Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">2023</text>

    <!-- 80 (estimated) -->
    <rect x="280" y="192" width="80" height="128" fill="#2383E2" opacity="0.7"/>
    <text x="320" y="184" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">$80B</text>
    <text x="320" y="340" font-family="Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">2024</text>

    <!-- 120 -->
    <rect x="400" y="128" width="80" height="192" fill="#2383E2" opacity="0.85"/>
    <text x="440" y="120" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">$120B</text>
    <text x="440" y="340" font-family="Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">2025</text>

    <!-- 185 -->
    <rect x="520" y="24" width="80" height="296" fill="#EB5757"/>
    <text x="560" y="16" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#EB5757" text-anchor="middle">$185B</text>
    <text x="560" y="340" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#EB5757" text-anchor="middle">2026</text>
  </g>

  <!-- Bottom callout boxes -->
  <g transform="translate(40, 490)">
    <rect width="230" height="60" rx="6" fill="#F0F7FF"/>
    <text x="115" y="26" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#2383E2" text-anchor="middle">规模 6×</text>
    <text x="115" y="46" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" text-anchor="middle">5 年从 $31B 到 $185B</text>

    <rect x="245" width="230" height="60" rx="6" fill="#FFF8E1"/>
    <text x="360" y="26" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#FFB020" text-anchor="middle">变现证据</text>
    <text x="360" y="46" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" text-anchor="middle">月 token 同比 7× → 3.2 千万亿</text>

    <rect x="490" width="230" height="60" rx="6" fill="#FFEDED"/>
    <text x="605" y="26" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#EB5757" text-anchor="middle">对模型层创业者</text>
    <text x="605" y="46" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" text-anchor="middle">自研芯片不是选择题，是生存题</text>
  </g>
</svg>
