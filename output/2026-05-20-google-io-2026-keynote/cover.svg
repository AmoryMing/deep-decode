<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>
    <linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F9AB00"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#188038"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Top label -->
  <text x="60" y="80" font-family="PingFang SC, Inter, sans-serif" font-size="18" fill="#94A3B8" letter-spacing="3">2026 / 05 / 20  ·  DECODE</text>

  <!-- Main title -->
  <text x="60" y="155" font-family="PingFang SC, Inter, sans-serif" font-size="56" font-weight="700" fill="#F8FAFC">Google I/O 2026</text>
  <text x="60" y="205" font-family="PingFang SC, Inter, sans-serif" font-size="26" font-weight="500" fill="#CBD5E1">1800 亿 capex 把 frontier 模型的价格腰斩</text>

  <!-- Color blocks for key launches -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="url(#g-blue)"/>
    <text x="80" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">Gemini</text>
    <text x="80" y="76" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">Omni Flash</text>

    <rect x="170" y="0" width="160" height="110" rx="10" fill="url(#g-red)"/>
    <text x="250" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">3.5 Flash</text>
    <text x="250" y="76" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="white" text-anchor="middle">half the price</text>

    <rect x="340" y="0" width="160" height="110" rx="10" fill="url(#g-yellow)"/>
    <text x="420" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle">Spark</text>
    <text x="420" y="76" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#1F2937" text-anchor="middle">24/7 后台代理</text>

    <rect x="510" y="0" width="160" height="110" rx="10" fill="url(#g-green)"/>
    <text x="590" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">TPU 8t / 8i</text>
    <text x="590" y="76" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="white" text-anchor="middle">训推分家</text>
  </g>

  <!-- Bottom stat -->
  <text x="60" y="420" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#64748B">capex $31B (2022) → $180-190B (2026)   ·   3.2Q tokens/月   ·   900M MAU</text>
</svg>
