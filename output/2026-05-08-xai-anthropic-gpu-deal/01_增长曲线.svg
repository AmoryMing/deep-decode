<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" fill="#FFFFFF"/>

  <text x="40" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#37352F">原计划 10 倍 vs 实际 80 倍</text>
  <text x="40" y="62" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">Anthropic 第一季度年化增长 · Dario Amodei 在 Code with Claude 现场承认</text>

  <!-- Chart area -->
  <g transform="translate(80, 100)">
    <!-- Y axis -->
    <line x1="0" y1="0" x2="0" y2="280" stroke="#787774" stroke-width="1"/>
    <line x1="0" y1="280" x2="640" y2="280" stroke="#787774" stroke-width="1"/>

    <!-- Y labels -->
    <text x="-10" y="285" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">1×</text>
    <text x="-10" y="220" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">10×</text>
    <text x="-10" y="120" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">40×</text>
    <text x="-10" y="35" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">80×</text>

    <!-- Gridlines -->
    <line x1="0" y1="220" x2="640" y2="220" stroke="#E3E2E0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="120" x2="640" y2="120" stroke="#E3E2E0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="35" x2="640" y2="35" stroke="#E3E2E0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Plan line (10x, flat dashed) -->
    <line x1="0" y1="280" x2="640" y2="220" stroke="#787774" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="640" y="215" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">原计划 10×</text>

    <!-- Actual curve -->
    <path d="M 0 280 Q 200 270, 320 200 T 640 30" fill="none" stroke="#2383E2" stroke-width="3"/>
    <circle cx="640" cy="30" r="6" fill="#2383E2"/>
    <text x="640" y="20" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#2383E2" font-weight="bold">实际 80×</text>

    <!-- X labels -->
    <text x="0" y="305" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">2026 Q1 起</text>
    <text x="320" y="305" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">2 月</text>
    <text x="640" y="305" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">5 月（年化）</text>
  </g>

  <!-- Side labels -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="6" height="14" fill="#2383E2"/>
    <text x="14" y="12" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">Claude Code 6 个月做到 $1B 年化 · 百万美元客户两个月翻倍到 1000+</text>
  </g>
  <text x="40" y="438" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Dario 原话："too hard to handle." — 不是机会词，是危机词。</text>
</svg>
