<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" fill="#FFFFFF"/>

  <text x="40" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#37352F">合同里埋的第二条线：轨道数据中心</text>
  <text x="40" y="62" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">把摩尔定律接到 SpaceX 火箭的发射成本曲线上</text>

  <!-- Timeline -->
  <g transform="translate(60, 120)">
    <line x1="0" y1="60" x2="680" y2="60" stroke="#E3E2E0" stroke-width="2"/>

    <!-- 2026 -->
    <circle cx="40" cy="60" r="10" fill="#2383E2"/>
    <text x="40" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F">2026 · 现在</text>
    <text x="40" y="92" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">地面机房</text>
    <text x="40" y="108" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">300MW · Memphis</text>

    <!-- 2027 -->
    <circle cx="220" cy="60" r="8" fill="#FFFFFF" stroke="#787774" stroke-width="2"/>
    <text x="220" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F">2027</text>
    <text x="220" y="92" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">SpaceX FCC 申请</text>
    <text x="220" y="108" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">百万卫星轨道星座</text>

    <!-- 2030 -->
    <circle cx="400" cy="60" r="8" fill="#FFFFFF" stroke="#787774" stroke-width="2"/>
    <text x="400" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F">2030</text>
    <text x="400" y="92" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">首颗 AI 算力卫星</text>
    <text x="400" y="108" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">单星 ~10MW</text>

    <!-- 2035 -->
    <circle cx="600" cy="60" r="10" fill="#2383E2"/>
    <text x="600" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#2383E2">2035</text>
    <text x="600" y="92" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">多吉瓦轨道集群</text>
    <text x="600" y="108" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">太阳能 · 真空散热</text>
  </g>

  <!-- Bottom: comparison -->
  <g transform="translate(60, 280)">
    <text x="0" y="0" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#37352F">地面 vs 轨道：约束差异</text>
    <rect x="0" y="20" width="335" height="130" rx="6" fill="#F7F7F5"/>
    <text x="20" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F">地面机房</text>
    <text x="20" y="74" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">· 受电网容量约束</text>
    <text x="20" y="96" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">· 受土地、冷却塔限制</text>
    <text x="20" y="118" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">· 当地居民环保投诉</text>
    <text x="20" y="140" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">· 18-24 个月新建周期</text>

    <rect x="345" y="20" width="335" height="130" rx="6" fill="#2383E2"/>
    <text x="365" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">轨道数据中心</text>
    <text x="365" y="74" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF">· 太阳能直供，不竞争电网</text>
    <text x="365" y="96" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF">· 真空散热，无冷却塔</text>
    <text x="365" y="118" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF">· 无地面环保审批</text>
    <text x="365" y="140" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF">· 成本随发射价格下降</text>
  </g>

  <text x="40" y="448" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">合同里"表示有兴趣"四个字 · 真实价值不在 2026，在 2030 之后谁能把 100MW 推上轨道</text>
</svg>
