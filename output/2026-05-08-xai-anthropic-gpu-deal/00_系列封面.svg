<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="6" fill="#2383E2"/>

  <!-- Tag -->
  <rect x="40" y="32" width="140" height="26" rx="4" fill="#2383E2"/>
  <text x="110" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">AI 基础设施 · 拆解</text>

  <!-- Title -->
  <text x="40" y="120" font-family="PingFang SC, Inter, sans-serif" font-size="32" font-weight="bold" fill="#37352F">22 万张卡换一句</text>
  <text x="40" y="160" font-family="PingFang SC, Inter, sans-serif" font-size="32" font-weight="bold" fill="#37352F">"没触发我的邪恶探测器"</text>
  <text x="40" y="195" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#787774">Anthropic 把推理跑到了 Musk 的机房里</text>

  <!-- Visual: arrow from xAI box to Anthropic box -->
  <g transform="translate(40, 240)">
    <!-- xAI box -->
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#FFFFFF" stroke="#E3E2E0" stroke-width="2"/>
    <text x="110" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#37352F">xAI · Colossus 1</text>
    <text x="110" y="52" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">Memphis 机房</text>
    <text x="110" y="78" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#2383E2">220,000 GPU</text>
    <text x="110" y="100" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">300 兆瓦电力</text>
    <text x="110" y="118" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">H100 + H200 + GB200</text>

    <!-- Arrow -->
    <line x1="240" y1="65" x2="370" y2="65" stroke="#2383E2" stroke-width="3"/>
    <polygon points="370,65 358,58 358,72" fill="#2383E2"/>
    <text x="305" y="55" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#2383E2" font-weight="bold">整租</text>
    <text x="305" y="85" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">~$5B / 年</text>

    <!-- Anthropic box -->
    <rect x="380" y="0" width="220" height="130" rx="8" fill="#2383E2"/>
    <text x="490" y="28" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Anthropic · Claude</text>
    <text x="490" y="52" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.85">推理产能</text>
    <text x="490" y="80" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">+30%</text>
    <text x="490" y="100" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.85">Claude Code 额度翻倍</text>
    <text x="490" y="118" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Opus 限流大幅放宽</text>
  </g>

  <!-- Footer -->
  <text x="40" y="420" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Code with Claude 2026 · 2026-05-06</text>
  <text x="760" y="420" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">深度拆解 · 2026-05-08</text>
</svg>
