<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="80" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a">三叉发布范式：9 天内三种"最强模型应该怎么发"的回答</text>
  <text x="80" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">2026-04-16 → 2026-04-24</text>

  <rect x="80" y="140" width="320" height="500" fill="#F7F7F5" rx="6"/>
  <rect x="80" y="140" width="320" height="60" fill="#2383E2" rx="6"/>
  <text x="100" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tiered  /  Anthropic</text>
  <text x="100" y="232" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">4-16  Opus 4.7 公开（Tier 2）</text>
  <text x="100" y="258" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">     Mythos Preview 锁 Glasswing</text>
  <text x="100" y="284" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">     联盟（Tier 1）</text>
  <text x="100" y="335" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">押注</text>
  <text x="100" y="365" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">能力稀缺性 + 政策合规</text>
  <text x="100" y="425" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">逻辑</text>
  <text x="100" y="455" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">把"能力"作为可分级</text>
  <text x="100" y="478" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">访问的资产管理</text>
  <text x="100" y="540" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFA500">同周裂缝</text>
  <text x="100" y="570" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">4-21 Pro 移除 Code</text>
  <text x="100" y="593" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">Avasare 公开承认</text>
  <text x="100" y="616" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">订阅架构不匹配</text>

  <rect x="440" y="140" width="320" height="500" fill="#F7F7F5" rx="6"/>
  <rect x="440" y="140" width="320" height="60" fill="#999" rx="6"/>
  <text x="460" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">$20 锚定  /  OpenAI Codex</text>
  <text x="460" y="232" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">4-22  公开声明 Codex stays</text>
  <text x="460" y="258" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">     in Plus ($20/month)</text>
  <text x="460" y="284" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">4-23  GPT-5.5 发布</text>
  <text x="460" y="335" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">押注</text>
  <text x="460" y="365" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">价格档位 + 开发者生态</text>
  <text x="460" y="425" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">逻辑</text>
  <text x="460" y="455" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">把"性能 / 价格比"押在</text>
  <text x="460" y="478" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">订阅档位的可达性上</text>
  <text x="460" y="540" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFA500">同周强项</text>
  <text x="460" y="570" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">$20 档位被 Anthropic</text>
  <text x="460" y="593" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">取消 Code 后接住</text>
  <text x="460" y="616" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">prosumer 用户外溢</text>

  <rect x="800" y="140" width="320" height="500" fill="#F7F7F5" rx="6"/>
  <rect x="800" y="140" width="320" height="60" fill="#FFA500" rx="6"/>
  <text x="820" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Open  /  DeepSeek</text>
  <text x="820" y="232" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">4-24  V4-Pro / V4-Flash</text>
  <text x="820" y="258" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">     MIT 协议 / HuggingFace</text>
  <text x="820" y="284" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">     1.6T 参数权重直发</text>
  <text x="820" y="335" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">押注</text>
  <text x="820" y="365" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">性能追平 + 开源完整性</text>
  <text x="820" y="425" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">逻辑</text>
  <text x="820" y="455" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">把"开放性 + 14% 价格"</text>
  <text x="820" y="478" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#666">作为新的护城河</text>
  <text x="820" y="540" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#FFA500">同周锚撬</text>
  <text x="820" y="570" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">$25 → $3.48 输出价</text>
  <text x="820" y="593" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">闭源派"更强所以更贵"</text>
  <text x="820" y="616" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#666">的能力锚被踩碎</text>

  <text x="80" y="690" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#999">三种范式不是互斥选择，是对"未来 12 个月谁定价"的三种押注</text>
</svg>
