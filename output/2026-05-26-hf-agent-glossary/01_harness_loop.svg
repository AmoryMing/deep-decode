<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">
  <rect width="1200" height="750" fill="#F7F1E8"/>

  <text x="80" y="70" font-size="14" letter-spacing="5" fill="#B85A3A" font-weight="600">FIGURE 01 · INFERENCE-TIME HARNESS LOOP</text>
  <text x="80" y="120" font-size="34" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">推理时 harness 的执行循环</text>
  <text x="80" y="155" font-size="15" fill="#5C5345" font-style="italic">observation → policy → action → tool → observation</text>

  <!-- Loop nodes, arranged in pentagon -->
  <g transform="translate(620,460)">
    <!-- node positions on a 230-radius circle starting at top, clockwise -->
    <!-- 0:  (0, -230) -->
    <!-- 1:  (218, -71) -->
    <!-- 2:  (135, 186) -->
    <!-- 3:  (-135, 186) -->
    <!-- 4:  (-218, -71) -->

    <!-- arrows (drawn as curved arcs between nodes, clockwise) -->
    <g fill="none" stroke="#B85A3A" stroke-width="2.4" marker-end="url(#arrowB85A3A)">
      <path d="M 60,-220 A 230 230 0 0 1 210,-95"/>
      <path d="M 215,-50 A 230 230 0 0 1 165,165"/>
      <path d="M 110,200 A 230 230 0 0 1 -110,200"/>
      <path d="M -165,165 A 230 230 0 0 1 -215,-50"/>
      <path d="M -210,-95 A 230 230 0 0 1 -60,-220"/>
    </g>

    <!-- nodes -->
    <g>
      <circle cx="0" cy="-230" r="62" fill="#ECE5D3" stroke="#2A241B" stroke-width="1.5"/>
      <text x="0" y="-235" text-anchor="middle" font-size="15" font-weight="700" fill="#2A241B">observation</text>
      <text x="0" y="-215" text-anchor="middle" font-size="11" fill="#5C5345">tool 输出 / 历史</text>

      <circle cx="218" cy="-71" r="62" fill="#E8C9B6" stroke="#2A241B" stroke-width="1.5"/>
      <text x="218" y="-76" text-anchor="middle" font-size="15" font-weight="700" fill="#2A241B">policy</text>
      <text x="218" y="-56" text-anchor="middle" font-size="11" fill="#5C5345">model 推理</text>

      <circle cx="135" cy="186" r="62" fill="#ECE5D3" stroke="#2A241B" stroke-width="1.5"/>
      <text x="135" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#2A241B">action</text>
      <text x="135" y="201" text-anchor="middle" font-size="11" fill="#5C5345">tool_call</text>

      <circle cx="-135" cy="186" r="62" fill="#E8C9B6" stroke="#2A241B" stroke-width="1.5"/>
      <text x="-135" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#2A241B">tool</text>
      <text x="-135" y="201" text-anchor="middle" font-size="11" fill="#5C5345">外部世界</text>

      <circle cx="-218" cy="-71" r="62" fill="#ECE5D3" stroke="#2A241B" stroke-width="1.5"/>
      <text x="-218" y="-76" text-anchor="middle" font-size="15" font-weight="700" fill="#2A241B">stop?</text>
      <text x="-218" y="-56" text-anchor="middle" font-size="11" fill="#5C5345">harness 判断</text>
    </g>
  </g>

  <defs>
    <marker id="arrowB85A3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#B85A3A"/>
    </marker>
  </defs>

  <!-- Left annotations -->
  <g transform="translate(80,260)" font-size="14" fill="#2A241B">
    <text x="0" y="0" font-weight="700" fill="#B85A3A">Model 做的：</text>
    <text x="0" y="22">把 observation 翻译成 action 意图（一次 forward）</text>
    <text x="0" y="80" font-weight="700" fill="#B85A3A">Harness 做的：</text>
    <text x="0" y="102">解析 action、调 tool、把 result 拼回 context</text>
    <text x="0" y="124">判断 done/error/timeout、写日志、记账</text>
    <text x="0" y="200" font-weight="700" fill="#B85A3A">和 scaffolding 的边界：</text>
    <text x="0" y="222">scaffolding 决定 prompt 长什么样</text>
    <text x="0" y="244">harness 决定循环跑几圈、何时停</text>
  </g>

  <text x="80" y="710" font-size="12" fill="#8A8472" letter-spacing="2">同一个 model，套不同 harness → 完全不同的 agent 行为</text>
</svg>
