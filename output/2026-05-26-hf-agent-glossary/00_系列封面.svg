<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E8"/>
      <stop offset="1" stop-color="#EFE6D2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Eyebrow -->
  <text x="80" y="80" font-size="16" letter-spacing="6" fill="#B85A3A" font-weight="600">AI 前沿拆解 · 2026-05-26</text>

  <!-- Title -->
  <text x="80" y="140" font-size="44" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC','Noto Serif SC',serif">Agent = Model + Harness</text>
  <text x="80" y="186" font-size="22" fill="#5C5345" font-style="italic" font-family="'Cormorant Garamond','Songti SC',serif">HuggingFace 把行话定了</text>

  <!-- Concentric circles -->
  <g transform="translate(800,420)">
    <!-- Agent (outer) -->
    <circle cx="0" cy="0" r="280" fill="#FFFEFA" stroke="#B85A3A" stroke-width="2"/>
    <text x="0" y="-256" text-anchor="middle" font-size="20" fill="#B85A3A" font-weight="600" letter-spacing="2">AGENT</text>

    <!-- Harness -->
    <circle cx="0" cy="0" r="220" fill="#ECE5D3" stroke="#B85A3A" stroke-width="1.5"/>
    <text x="0" y="-196" text-anchor="middle" font-size="18" fill="#B85A3A" font-weight="600" letter-spacing="2">HARNESS</text>

    <!-- Scaffolding -->
    <circle cx="0" cy="0" r="155" fill="#E8C9B6" stroke="#B85A3A" stroke-width="1.5"/>
    <text x="0" y="-131" text-anchor="middle" font-size="16" fill="#2A241B" font-weight="600" letter-spacing="2">SCAFFOLDING</text>

    <!-- Model (inner) -->
    <circle cx="0" cy="0" r="86" fill="#2A241B"/>
    <text x="0" y="-2" text-anchor="middle" font-size="22" fill="#F7F1E8" font-weight="700" letter-spacing="2">MODEL</text>
    <text x="0" y="24" text-anchor="middle" font-size="13" fill="#E8C9B6">LLM weights</text>
  </g>

  <!-- Left equation block -->
  <g transform="translate(80,320)">
    <text x="0" y="0" font-size="40" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">Agent</text>
    <text x="160" y="0" font-size="40" fill="#B85A3A">=</text>
    <text x="208" y="0" font-size="40" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">Model</text>
    <text x="362" y="0" font-size="40" fill="#B85A3A">+</text>
    <text x="408" y="0" font-size="40" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">Harness</text>
  </g>

  <text x="80" y="380" font-size="17" fill="#5C5345" font-style="italic" font-family="'Cormorant Garamond','Songti SC',serif">If you're not the model, you're the harness.</text>

  <!-- Four bullets -->
  <g transform="translate(80,440)" font-size="15" fill="#2A241B">
    <text x="0" y="0"><tspan fill="#B85A3A" font-weight="700">Model </tspan>权重 / stateless / 一问一答</text>
    <text x="0" y="34"><tspan fill="#B85A3A" font-weight="700">Scaffolding </tspan>system prompt + tool desc + 输出格式</text>
    <text x="0" y="68"><tspan fill="#B85A3A" font-weight="700">Harness </tspan>loop / 解析 / 停机 / guardrail</text>
    <text x="0" y="102"><tspan fill="#B85A3A" font-weight="700">Agent </tspan>三者打包成可独立跑的系统</text>
  </g>

  <!-- Footer -->
  <text x="80" y="700" font-size="13" fill="#8A8472" letter-spacing="3">HuggingFace Blog · Sergio Paniego &amp; Aritra Roy Gosthipaty · 2026-05-25</text>
</svg>
