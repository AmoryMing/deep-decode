<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">
  <rect width="1200" height="750" fill="#F7F1E8"/>

  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#B85A3A"/>
    </marker>
  </defs>

  <text x="80" y="70" font-size="14" letter-spacing="5" fill="#B85A3A" font-weight="600">FIGURE 02 · TRAINING-TIME RL PIPELINE</text>
  <text x="80" y="120" font-size="34" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">训练时四件套：Trainer → Rollouts → Reward → weights</text>
  <text x="80" y="155" font-size="15" fill="#5C5345" font-style="italic">把 agent 从"推理时的工程"链到"训练时的强化学习"</text>

  <!-- Trainer box -->
  <g transform="translate(80,220)">
    <rect width="220" height="120" rx="8" fill="#2A241B"/>
    <text x="110" y="38" text-anchor="middle" font-size="14" fill="#E8C9B6" letter-spacing="3">TRAINER</text>
    <text x="110" y="68" text-anchor="middle" font-size="20" font-weight="700" fill="#F7F1E8" font-family="'Cormorant Garamond','Songti SC',serif">GRPOTrainer</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#E8C9B6">episode 生成 + reward 打分 + weight 更新</text>
  </g>

  <!-- Arrow trainer → rollouts -->
  <path d="M 300,280 L 460,280" stroke="#B85A3A" stroke-width="2.4" fill="none" marker-end="url(#arrow02)"/>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#B85A3A" letter-spacing="2">spawn</text>

  <!-- Many rollouts (stacked rectangles) -->
  <g transform="translate(470,200)">
    <text x="0" y="-8" font-size="13" letter-spacing="2" fill="#B85A3A">PARALLEL ROLLOUTS</text>
    <g>
      <rect x="0" y="0" width="240" height="34" rx="3" fill="#ECE5D3" stroke="#2A241B" stroke-width="1"/>
      <text x="14" y="22" font-size="12" fill="#2A241B">rollout #1  · obs → act → reward seq</text>
      <rect x="6" y="40" width="240" height="34" rx="3" fill="#ECE5D3" stroke="#2A241B" stroke-width="1"/>
      <text x="20" y="62" font-size="12" fill="#2A241B">rollout #2  · trajectory / trace</text>
      <rect x="12" y="80" width="240" height="34" rx="3" fill="#ECE5D3" stroke="#2A241B" stroke-width="1"/>
      <text x="26" y="102" font-size="12" fill="#2A241B">rollout #3</text>
      <rect x="18" y="120" width="240" height="34" rx="3" fill="#ECE5D3" stroke="#2A241B" stroke-width="1"/>
      <text x="32" y="142" font-size="12" fill="#2A241B">...</text>
      <rect x="24" y="160" width="240" height="34" rx="3" fill="#E8C9B6" stroke="#2A241B" stroke-width="1.5"/>
      <text x="38" y="182" font-size="12" font-weight="600" fill="#2A241B">rollout #N  (TRL 默认 N=16-64)</text>
    </g>
  </g>

  <!-- RL Environment label box -->
  <g transform="translate(740,260)">
    <rect width="200" height="80" rx="8" fill="#FFFEFA" stroke="#B85A3A" stroke-width="1.5"/>
    <text x="100" y="26" text-anchor="middle" font-size="12" fill="#B85A3A" letter-spacing="3">RL ENVIRONMENT</text>
    <text x="100" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#2A241B">action → state' → obs</text>
    <text x="100" y="68" text-anchor="middle" font-size="11" fill="#5C5345">e.g. 文件系统 / 浏览器 / IDE</text>
  </g>

  <!-- arrows from rollouts to env (single arrow group) -->
  <path d="M 712,300 L 740,300" stroke="#B85A3A" stroke-width="2" fill="none" marker-end="url(#arrow02)"/>
  <path d="M 740,310 L 712,330" stroke="#5C5345" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow02)"/>

  <!-- Reward / Rubric -->
  <g transform="translate(80,460)">
    <rect width="540" height="170" rx="8" fill="#E8C9B6" stroke="#B85A3A" stroke-width="1.5"/>
    <text x="270" y="30" text-anchor="middle" font-size="13" fill="#B85A3A" letter-spacing="3">REWARD / RUBRIC</text>
    <text x="270" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">把"好不好"变成一个数 / 一组数</text>

    <g font-size="13" fill="#2A241B">
      <text x="40" y="98" font-weight="700">Reward 维度（HF 给的四象限）</text>
      <text x="40" y="120">· verifiable  ↔  learned</text>
      <text x="40" y="140">· sparse  ↔  dense</text>
      <text x="320" y="98" font-weight="700">Rubric =</text>
      <text x="320" y="120">WeightedSum / Sequential / Gate</text>
      <text x="320" y="140">（OpenEnv &amp; Verifiers 实现）</text>
    </g>
  </g>

  <!-- Arrow rewards → trainer (update weights) -->
  <path d="M 350,460 L 350,360 L 220,360 L 220,340" stroke="#B85A3A" stroke-width="2.4" fill="none" marker-end="url(#arrow02)" stroke-dasharray="6,4"/>
  <text x="240" y="396" font-size="12" fill="#B85A3A" letter-spacing="2">update model weights</text>

  <!-- right side annotation -->
  <g transform="translate(680,460)" font-size="13" fill="#2A241B">
    <text x="0" y="0" font-weight="700" fill="#B85A3A">为什么这条管线要术语对齐？</text>
    <text x="0" y="26">训练用的 harness ＝ 部署用的 harness</text>
    <text x="0" y="48">不然 RL 学到的 policy 会和实际系统行为脱钩</text>
    <text x="0" y="74">所以 scaffold / harness 必须拆开建模——</text>
    <text x="0" y="96">trainer 只更新 model 权重，</text>
    <text x="0" y="118">scaffolding 在产品端可换，harness 不动。</text>
  </g>

  <text x="80" y="710" font-size="12" fill="#8A8472" letter-spacing="2">RL 视角下，agent 就是一个 observation → action 的函数；LLM agent 让这个函数变成 model 的输出而已</text>
</svg>
