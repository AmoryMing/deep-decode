<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">
  <rect width="1200" height="750" fill="#F7F1E8"/>

  <defs>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#B85A3A"/>
    </marker>
  </defs>

  <text x="80" y="70" font-size="14" letter-spacing="5" fill="#B85A3A" font-weight="600">FIGURE 04 · MEMORY</text>
  <text x="80" y="120" font-size="34" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">Short-term vs Long-term：边界就是 context window</text>
  <text x="80" y="155" font-size="15" fill="#5C5345" font-style="italic">窗口内是 short-term，窗口外是 long-term，retrieval 是搬运工</text>

  <!-- Context window box -->
  <g transform="translate(80,220)">
    <rect width="640" height="380" rx="8" fill="#FFFEFA" stroke="#2A241B" stroke-width="2"/>
    <text x="320" y="40" text-anchor="middle" font-size="13" letter-spacing="4" fill="#B85A3A">CONTEXT WINDOW</text>
    <text x="320" y="68" text-anchor="middle" font-size="20" font-weight="700" fill="#2A241B" font-family="'Cormorant Garamond','Songti SC',serif">Short-term Memory</text>

    <!-- contents inside -->
    <g transform="translate(30,108)" font-size="13" fill="#2A241B">
      <rect x="0" y="0" width="260" height="50" rx="4" fill="#ECE5D3"/>
      <text x="14" y="20" font-weight="700">system prompt</text>
      <text x="14" y="38" font-size="11" fill="#5C5345">scaffolding 写入的指令 + tool desc</text>

      <rect x="290" y="0" width="260" height="50" rx="4" fill="#ECE5D3"/>
      <text x="304" y="20" font-weight="700">conversation history</text>
      <text x="304" y="38" font-size="11" fill="#5C5345">用户消息 + 模型回复</text>

      <rect x="0" y="68" width="260" height="50" rx="4" fill="#E8C9B6"/>
      <text x="14" y="88" font-weight="700">tool results</text>
      <text x="14" y="106" font-size="11" fill="#5C5345">harness 拼回来的 obs</text>

      <rect x="290" y="68" width="260" height="50" rx="4" fill="#E8C9B6"/>
      <text x="304" y="88" font-weight="700">intermediate reasoning</text>
      <text x="304" y="106" font-size="11" fill="#5C5345">thinking / scratchpad</text>

      <rect x="0" y="136" width="550" height="50" rx="4" fill="#FFFEFA" stroke="#B85A3A" stroke-width="1.5" stroke-dasharray="5,4"/>
      <text x="14" y="156" font-weight="700" fill="#B85A3A">retrieved long-term memory</text>
      <text x="14" y="174" font-size="11" fill="#5C5345">本轮被检索后塞回来的外部知识</text>

      <text x="0" y="220" font-size="11" fill="#8A8472" letter-spacing="2">本轮跑完即丢失（除非显式写回外部存储）</text>
    </g>
  </g>

  <!-- Long-term memory store outside -->
  <g transform="translate(800,220)">
    <rect width="320" height="380" rx="8" fill="#2A241B" stroke="#B85A3A" stroke-width="2"/>
    <text x="160" y="40" text-anchor="middle" font-size="13" letter-spacing="4" fill="#E8C9B6">EXTERNAL STORE</text>
    <text x="160" y="68" text-anchor="middle" font-size="20" font-weight="700" fill="#F7F1E8" font-family="'Cormorant Garamond','Songti SC',serif">Long-term Memory</text>

    <g transform="translate(20,100)" font-size="13" fill="#E8C9B6">
      <text x="0" y="0" font-weight="700">实现方式（HF 没收敛）</text>
      <text x="0" y="22">· vector store</text>
      <text x="0" y="42">· KV store</text>
      <text x="0" y="62">· hybrid search</text>
      <text x="0" y="82">· per-entity 文件</text>

      <text x="0" y="120" font-weight="700">切片策略</text>
      <text x="0" y="142">· 按 session</text>
      <text x="0" y="162">· 按 entity</text>
      <text x="0" y="182">· 按 task</text>

      <text x="0" y="220" font-weight="700">读写模式</text>
      <text x="0" y="242">· read-only</text>
      <text x="0" y="262">· write-back</text>
    </g>
  </g>

  <!-- arrows between -->
  <path d="M 720,400 L 800,400" stroke="#B85A3A" stroke-width="2.4" fill="none" marker-end="url(#arrow04)"/>
  <text x="760" y="392" text-anchor="middle" font-size="12" fill="#B85A3A">write</text>

  <path d="M 800,440 L 720,440" stroke="#B85A3A" stroke-width="2.4" fill="none" marker-end="url(#arrow04)" stroke-dasharray="5,3"/>
  <text x="760" y="460" text-anchor="middle" font-size="12" fill="#B85A3A">retrieve</text>

  <text x="80" y="710" font-size="12" fill="#8A8472" letter-spacing="2">HF 收敛了"什么是 long-term memory"，没收敛"怎么实现"——这是工程上还在演化的部分</text>
</svg>
