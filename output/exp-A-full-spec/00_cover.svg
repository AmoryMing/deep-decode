<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- 顶部主标题 -->
  <text x="600" y="80" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="36" font-weight="700" fill="#37352F">把 0.2 分给 7 倍价差</text>
  <text x="600" y="120" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="18" fill="#787774">DeepSeek V4 给闭源派算的一道分配题</text>

  <!-- 中央：等式区 -->
  <g>
    <!-- 左数：性能差 0.2 -->
    <rect x="150" y="200" width="240" height="180" rx="12" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="2"/>
    <text x="270" y="245" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">性能差</text>
    <text x="270" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#2383E2">0.2</text>
    <text x="270" y="340" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">SWE-bench Verified</text>
    <text x="270" y="360" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">百分点</text>

    <!-- 除号 -->
    <text x="455" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#37352F">÷</text>

    <!-- 右数：价格差 7× -->
    <rect x="510" y="200" width="240" height="180" rx="12" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="2"/>
    <text x="630" y="245" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">价格差</text>
    <text x="630" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#FFA500">7×</text>
    <text x="630" y="340" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">$25 输出价</text>
    <text x="630" y="360" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">vs $3.48</text>

    <!-- 等号 -->
    <text x="815" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#37352F">=</text>

    <!-- 右：单价 -->
    <rect x="870" y="200" width="240" height="180" rx="12" fill="#FFF3E0" stroke="#FFA500" stroke-width="2"/>
    <text x="990" y="245" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">每点优势单价</text>
    <text x="990" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#37352F">$21.52</text>
    <text x="990" y="340" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">每百万输出 token</text>
    <text x="990" y="360" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">闭源派的明码</text>
  </g>

  <!-- 中段说明 -->
  <text x="600" y="445" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#37352F" font-weight="600">这道分配题以前是没有的</text>
  <text x="600" y="475" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">三年里"闭源 = 更强 = 更贵"是同一回事，没人单独为"领先"标价</text>

  <!-- 底部三栏：三叉范式 -->
  <g>
    <rect x="100" y="525" width="300" height="100" rx="8" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="250" y="555" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="700" fill="#2383E2">Tiered Release</text>
    <text x="250" y="580" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">Anthropic：最强不公开</text>
    <text x="250" y="600" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">11 家联盟分级访问</text>

    <rect x="450" y="525" width="300" height="100" rx="8" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="600" y="555" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFA500">$20 锚定</text>
    <text x="600" y="580" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">OpenAI Codex：性价比兜底</text>
    <text x="600" y="600" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">守住开发者基本盘</text>

    <rect x="800" y="525" width="300" height="100" rx="8" fill="#FFF3E0" stroke="#FFA500" stroke-width="2"/>
    <text x="950" y="555" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="700" fill="#37352F">Open Release</text>
    <text x="950" y="580" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">DeepSeek：最强直接给</text>
    <text x="950" y="600" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">1.6T MIT + 14% 价格</text>
  </g>

  <!-- 底部时间戳 -->
  <text x="600" y="655" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#A0A0A0">2026-04-24 · DeepSeek-V4-Pro / V4-Flash · MIT License · HuggingFace</text>
</svg>
