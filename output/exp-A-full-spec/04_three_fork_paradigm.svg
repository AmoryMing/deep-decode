<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="600" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="700" fill="#37352F">三叉范式：9 天三种发布姿势同台登场</text>
  <text x="600" y="80" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">2026-04-16 → 2026-04-24 · 同一性能等级，三种结构性回答</text>

  <!-- 时间线 -->
  <g>
    <line x1="100" y1="140" x2="1100" y2="140" stroke="#37352F" stroke-width="2"/>

    <!-- 4-16 节点 -->
    <circle cx="160" cy="140" r="8" fill="#2383E2"/>
    <text x="160" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#37352F">4-16</text>
    <text x="160" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2383E2">Opus 4.7 + Glasswing</text>

    <!-- 4-17 节点 -->
    <circle cx="320" cy="140" r="6" fill="#787774"/>
    <text x="320" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#787774">4-17</text>
    <text x="320" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#787774">Claude Design</text>

    <!-- 4-21 节点 -->
    <circle cx="500" cy="140" r="8" fill="#EB5757"/>
    <text x="500" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#37352F">4-21</text>
    <text x="500" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#EB5757">Pro 移除 Claude Code</text>

    <!-- 4-22 节点 -->
    <circle cx="680" cy="140" r="8" fill="#FFA500"/>
    <text x="680" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#37352F">4-22</text>
    <text x="680" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#FFA500">Codex $20 声明</text>

    <!-- 4-23 节点 -->
    <circle cx="860" cy="140" r="6" fill="#787774"/>
    <text x="860" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#787774">4-23</text>
    <text x="860" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#787774">GPT-5.5 + 三连降智披露</text>

    <!-- 4-24 节点 -->
    <circle cx="1040" cy="140" r="10" fill="#FFA500"/>
    <text x="1040" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#37352F">4-24</text>
    <text x="1040" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#FFA500" font-weight="700">DeepSeek V4 MIT</text>
  </g>

  <!-- 三栏 -->
  <!-- 第一栏：Tiered Release -->
  <g>
    <rect x="80" y="220" width="340" height="500" rx="12" fill="#F7F7F5" stroke="#2383E2" stroke-width="2"/>
    <rect x="80" y="220" width="340" height="60" rx="12" fill="#2383E2"/>
    <text x="250" y="260" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tiered Release</text>

    <text x="250" y="310" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F">Anthropic · 最强不公开</text>

    <text x="100" y="350" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">动作</text>
    <text x="100" y="372" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Mythos Preview 锁进 Project</text>
    <text x="100" y="390" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Glasswing 联盟（11 家）</text>
    <text x="100" y="408" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">公开版按 Tier 2 发布</text>

    <text x="100" y="445" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">逻辑</text>
    <text x="100" y="467" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">把"能力"作为可分级访问</text>
    <text x="100" y="485" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">的资产</text>

    <text x="100" y="522" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">押注</text>
    <text x="100" y="544" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">能力稀缺性维持高价</text>

    <text x="100" y="580" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">联盟成员</text>
    <text x="100" y="602" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">AWS · Apple · Google · Microsoft</text>
    <text x="100" y="620" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">NVIDIA · JPMorgan · Cisco</text>
    <text x="100" y="638" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">CrowdStrike · Broadcom</text>
    <text x="100" y="656" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">Palo Alto · Linux Foundation</text>

    <rect x="100" y="675" width="300" height="35" rx="6" fill="#E8F4FD"/>
    <text x="250" y="697" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="600" fill="#2383E2">公开版价格 $5/$25 per MTok</text>
  </g>

  <!-- 第二栏：$20 锚定 -->
  <g>
    <rect x="430" y="220" width="340" height="500" rx="12" fill="#F7F7F5" stroke="#FFA500" stroke-width="2"/>
    <rect x="430" y="220" width="340" height="60" rx="12" fill="#FFA500"/>
    <text x="600" y="260" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">$20 锚定</text>

    <text x="600" y="310" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F">OpenAI Codex · 性价比兜底</text>

    <text x="450" y="350" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">动作</text>
    <text x="450" y="372" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Codex 团队公开声明</text>
    <text x="450" y="390" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">"stays in Plus ($20/month)"</text>
    <text x="450" y="408" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">距 Anthropic 取消 24 小时</text>

    <text x="450" y="445" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">逻辑</text>
    <text x="450" y="467" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">把"性价比"押在订阅</text>
    <text x="450" y="485" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">档位的可达性上</text>

    <text x="450" y="522" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">押注</text>
    <text x="450" y="544" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">守住开发者基本盘</text>

    <text x="450" y="580" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">关键差异</text>
    <text x="450" y="602" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">和 Anthropic 一周前裁掉</text>
    <text x="450" y="620" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">$20 档 Claude Code 形成对照</text>
    <text x="450" y="638" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">"我们有算力撑住它"</text>

    <rect x="450" y="675" width="300" height="35" rx="6" fill="#FFF3E0"/>
    <text x="600" y="697" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="600" fill="#FFA500">API 价格 $2.5/$15 per MTok</text>
  </g>

  <!-- 第三栏：Open Release -->
  <g>
    <rect x="780" y="220" width="340" height="500" rx="12" fill="#FFF3E0" stroke="#FFA500" stroke-width="3"/>
    <rect x="780" y="220" width="340" height="60" rx="12" fill="#37352F"/>
    <text x="950" y="260" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Open Release</text>

    <text x="950" y="310" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F">DeepSeek · 最强直接给</text>

    <text x="800" y="350" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">动作</text>
    <text x="800" y="372" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">V4-Pro 1.6T 参数权重</text>
    <text x="800" y="390" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">MIT 协议直接上 HuggingFace</text>
    <text x="800" y="408" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">tech report 完整公开</text>

    <text x="800" y="445" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">逻辑</text>
    <text x="800" y="467" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">把"开放性 + 价格"</text>
    <text x="800" y="485" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">作为护城河</text>

    <text x="800" y="522" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">押注</text>
    <text x="800" y="544" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">性能追平 + 开源完整</text>
    <text x="800" y="562" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">直接踩薄对手定价空间</text>

    <text x="800" y="600" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#37352F">三个维度同时开源</text>
    <text x="800" y="622" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">权重 · mHC 训练稳定性 ·</text>
    <text x="800" y="640" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">DSA 1M 上下文成本压缩</text>

    <rect x="800" y="675" width="300" height="35" rx="6" fill="#FFE6CC"/>
    <text x="950" y="697" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="700" fill="#37352F">价格 $1.74/$3.48 per MTok</text>
  </g>

  <!-- 底部金句 -->
  <text x="600" y="755" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-style="italic" fill="#787774">"上周的'分叉领先'框架，本周需要扩成三叉。第三叉是开源的全维度同代。"</text>
</svg>
