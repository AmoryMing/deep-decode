<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="600" y="50" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="700" fill="#37352F">$3.48 vs $25：定价权易手</text>
  <text x="600" y="80" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">输出价格阶梯 + 50M token / 月企业实算（Buildfastwithai 算例）</text>

  <!-- 上半：价格柱状图 -->
  <g>
    <text x="100" y="130" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">输出价格 ($/MTok)</text>

    <!-- 横轴基线 -->
    <line x1="100" y1="320" x2="700" y2="320" stroke="#37352F" stroke-width="2"/>

    <!-- V4-Flash bar -->
    <rect x="140" y="316" width="100" height="4" fill="#FFA500"/>
    <text x="190" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFA500">$0.28</text>
    <text x="190" y="345" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#37352F">V4-Flash</text>
    <text x="190" y="362" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#FFA500">1.12% of Opus</text>

    <!-- V4-Pro bar -->
    <rect x="280" y="278" width="100" height="42" fill="#FFA500"/>
    <text x="330" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFA500">$3.48</text>
    <text x="330" y="345" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#37352F">V4-Pro</text>
    <text x="330" y="362" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#FFA500">13.92% of Opus</text>

    <!-- GPT-5.4 bar -->
    <rect x="420" y="140" width="100" height="180" fill="#787774"/>
    <text x="470" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#37352F">$15</text>
    <text x="470" y="345" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#37352F">GPT-5.4</text>

    <!-- Opus 4.6 bar -->
    <rect x="560" y="20" width="100" height="300" fill="#2383E2"/>
    <text x="610" y="14" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#2383E2">$25</text>
    <text x="610" y="345" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#37352F">Opus 4.6</text>

    <!-- 价差箭头 -->
    <line x1="380" y1="278" x2="555" y2="20" stroke="#FFA500" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="470" y="170" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFA500" transform="rotate(-30, 470, 170)">差额 $21.52 = 闭源溢价</text>
  </g>

  <!-- 中线分隔 -->
  <line x1="100" y1="395" x2="1100" y2="395" stroke="#E3E2E0" stroke-width="1"/>

  <!-- 下半：50M token 月成本 -->
  <g>
    <text x="100" y="430" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">50M output token / 月 · 一条 agent coding 流水线的真实账单</text>

    <!-- V4-Pro 卡片 -->
    <rect x="100" y="455" width="280" height="190" rx="12" fill="#FFF3E0" stroke="#FFA500" stroke-width="2"/>
    <text x="240" y="490" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">DeepSeek V4-Pro</text>
    <text x="240" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="56" font-weight="700" fill="#FFA500">$174</text>
    <text x="240" y="590" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#787774">/ 月</text>
    <text x="240" y="620" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#37352F">50 × $3.48 = $174</text>

    <!-- VS -->
    <text x="430" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#787774">vs</text>

    <!-- Opus 4.6 卡片 -->
    <rect x="480" y="455" width="280" height="190" rx="12" fill="#E8F4FD" stroke="#2383E2" stroke-width="2"/>
    <text x="620" y="490" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F">Claude Opus 4.6</text>
    <text x="620" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="56" font-weight="700" fill="#2383E2">$1,250</text>
    <text x="620" y="590" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#787774">/ 月</text>
    <text x="620" y="620" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#37352F">50 × $25 = $1,250</text>

    <!-- 累计差额 -->
    <rect x="810" y="455" width="290" height="190" rx="12" fill="#37352F"/>
    <text x="955" y="490" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">累计差额</text>
    <text x="955" y="525" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#A0A0A0">月差</text>
    <text x="955" y="548" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFA500">$1,076</text>
    <text x="955" y="575" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#A0A0A0">年差</text>
    <text x="955" y="598" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFA500">$12,912</text>
    <text x="955" y="624" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">50 人团队年差 $645,600</text>
  </g>

  <!-- 底部金句 -->
  <text x="600" y="680" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-style="italic" fill="#787774">"真正决定钱花到哪里的不是 benchmark 高几位，是每百万 token 多少钱"</text>
</svg>
