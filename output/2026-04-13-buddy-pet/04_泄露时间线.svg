<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="28" font-weight="bold" fill="#37352F">一场计划好的"泄露"？</text>

  <!-- Timeline (minimal, not the hero) -->
  <line x1="100" y1="100" x2="700" y2="100" stroke="#E3E2E0" stroke-width="2"/>

  <!-- Code clue above timeline -->
  <text x="100" y="80" font-family="monospace" font-size="11" fill="#FFB020">salt = 'friend-2026-401'</text>

  <!-- Timeline nodes (small, understated) -->
  <circle cx="160" cy="100" r="5" fill="#EB5757"/>
  <text x="160" y="125" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#37352F">3/31</text>
  <text x="160" y="142" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">泄露</text>

  <circle cx="320" cy="100" r="5" fill="#FFB020"/>
  <text x="320" y="125" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">4/1</text>
  <text x="320" y="142" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">Teaser 开启</text>

  <circle cx="530" cy="100" r="4" fill="#E3E2E0"/>
  <text x="530" y="125" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">4/7</text>
  <text x="530" y="142" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">窗口关闭</text>

  <circle cx="660" cy="100" r="7" fill="#2383E2"/>
  <text x="660" y="125" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#2383E2">4/8</text>
  <text x="660" y="142" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#2383E2">正式上线</text>

  <!-- Teaser window bracket -->
  <line x1="320" y1="148" x2="320" y2="158" stroke="#FFB020" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="158" x2="530" y2="158" stroke="#FFB020" stroke-width="1" opacity="0.5"/>
  <line x1="530" y1="148" x2="530" y2="158" stroke="#FFB020" stroke-width="1" opacity="0.5"/>
  <text x="425" y="172" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#FFB020">"Teaser window: April 1-7"</text>

  <!-- ===== HERO: Giant number (magazine pull-quote style) ===== -->
  <text x="400" y="280" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="72" font-weight="bold" fill="#2383E2">50,000</text>
  <text x="400" y="310" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#787774">GitHub Stars</text>
  <text x="400" y="335" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#37352F">泄露后 120 分钟内</text>

  <!-- Supporting metrics (small, flanking) -->
  <text x="160" y="280" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#4DB6AC">41,500</text>
  <text x="160" y="300" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">Forks</text>

  <text x="640" y="280" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="bold" fill="#FFB020">1600 万</text>
  <text x="640" y="300" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#787774">推文浏览量</text>

  <!-- Quotes (detail level, supporting) -->
  <line x1="100" y1="370" x2="700" y2="370" stroke="#E3E2E0" stroke-width="0.5"/>

  <text x="120" y="400" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" font-style="italic">"他们预期会在推特上病毒传播，</text>
  <text x="120" y="418" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" font-style="italic"> 所以在分批放出预告。"</text>
  <text x="120" y="436" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#BCBCBC">-- avaer (疑似内部知情者), Hacker News</text>

  <text x="470" y="400" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" font-style="italic">"大多数愚人节功能是一次性代码，</text>
  <text x="470" y="418" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F" font-style="italic"> 我没想到会有这种工程量级。"</text>
  <text x="470" y="436" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#BCBCBC">-- RAXXO Studios, dev.to</text>

  <!-- Bottom insight -->
  <rect x="170" y="458" width="460" height="32" rx="8" fill="#37352F"/>
  <text x="400" y="479" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">如果这是事故，它是历史上 ROI 最高的事故</text>
</svg>
