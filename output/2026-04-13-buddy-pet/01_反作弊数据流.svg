<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="28" font-weight="bold" fill="#37352F">79KB 里的反作弊工程</text>

  <!-- Waterline -->
  <line x1="60" y1="195" x2="740" y2="195" stroke="#2383E2" stroke-width="1.5" opacity="0.4"/>
  <text x="735" y="190" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#2383E2" opacity="0.6">waterline</text>

  <!-- ICEBERG: Above water (small tip) -->
  <path d="M 400 80 L 340 195 L 460 195 Z" fill="#F7F7F5" stroke="#E3E2E0" stroke-width="1.5"/>

  <!-- Above water labels (what people see) -->
  <text x="400" y="130" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">5 files</text>
  <text x="400" y="150" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">79KB</text>
  <text x="400" y="170" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">/buddy</text>

  <!-- "looks like" label -->
  <text x="620" y="145" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774">看起来是</text>
  <text x="620" y="165" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#787774">愚人节彩蛋</text>

  <!-- ICEBERG: Below water (large body - the engineering depth) -->
  <path d="M 310 195 L 180 320 L 220 460 L 580 460 L 620 320 L 490 195 Z" fill="#2383E2" opacity="0.08" stroke="#2383E2" stroke-width="2"/>

  <!-- Below water engineering stack -->
  <text x="400" y="240" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#2383E2">实际工程量</text>

  <!-- Engineering items (progressively wider = deeper) -->
  <text x="400" y="275" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">FNV-1a 哈希 + salt 'friend-2026-401'</text>

  <text x="400" y="305" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">Mulberry32 PRNG 确定性生成全部属性</text>

  <text x="400" y="335" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">合并覆盖 { ...stored, ...bones } 反篡改</text>

  <text x="400" y="365" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">String.fromCharCode() 绕过构建扫描器</text>

  <text x="400" y="395" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F">Capybara 十六进制编码 (下代模型代号)</text>

  <!-- "actually is" label -->
  <text x="660" y="280" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#2383E2">实际是</text>
  <text x="660" y="300" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#2383E2">产品级工程</text>

  <!-- Depth scale on right side -->
  <line x1="140" y1="195" x2="140" y2="460" stroke="#2383E2" stroke-width="1" opacity="0.3"/>
  <text x="135" y="210" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#2383E2" opacity="0.5">浅</text>
  <text x="135" y="450" text-anchor="end" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#2383E2" opacity="0.5">深</text>

  <!-- Bottom insight (hero sentence) -->
  <rect x="150" y="490" width="500" height="45" rx="8" fill="#37352F"/>
  <text x="400" y="518" text-anchor="middle" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">一个彩蛋不需要反作弊架构</text>
</svg>
