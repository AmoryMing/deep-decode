<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="PingFang SC, Inter, sans-serif">
  <rect width="1080" height="1350" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1080" height="8" fill="#2383E2"/>

  <text x="60" y="100" font-size="20" fill="#787774" letter-spacing="2">SECTION 3 · 两条路线</text>
  <text x="60" y="170" font-size="52" font-weight="700" fill="#37352F">购物界面 vs 购物入口</text>
  <text x="60" y="220" font-size="26" fill="#787774">一字之差，战略截然不同</text>

  <!-- Two columns -->
  <g transform="translate(60, 290)">
    <!-- Route A: 内嵌 -->
    <rect width="460" height="850" fill="#F7F7F5" rx="8"/>
    <text x="30" y="60" font-size="22" fill="#787774">路线 A</text>
    <text x="30" y="105" font-size="30" font-weight="700" fill="#2383E2">电商内嵌 AI</text>
    <text x="30" y="135" font-size="20" fill="#37352F">"成为购物界面"</text>

    <line x1="30" y1="160" x2="200" y2="160" stroke="#E3E2E0" stroke-width="2"/>

    <text x="30" y="200" font-size="18" font-weight="600" fill="#787774">代表玩家</text>
    <text x="30" y="240" font-size="22" font-weight="600" fill="#37352F">Amazon Rufus</text>
    <text x="30" y="270" font-size="18" fill="#37352F">淘宝站内 AI 助手</text>

    <text x="30" y="320" font-size="18" font-weight="600" fill="#787774">用户起点</text>
    <text x="30" y="360" font-size="20" fill="#37352F">打开购物 App</text>

    <text x="30" y="410" font-size="18" font-weight="600" fill="#787774">核心数据</text>
    <text x="30" y="455" font-size="28" font-weight="700" fill="#2383E2">2.5 亿</text>
    <text x="30" y="485" font-size="16" fill="#787774">Rufus 累计用户（2 年）</text>
    <text x="30" y="520" font-size="28" font-weight="700" fill="#2383E2">+60%</text>
    <text x="30" y="550" font-size="16" fill="#787774">购买概率提升</text>
    <text x="30" y="585" font-size="28" font-weight="700" fill="#2383E2">$10B</text>
    <text x="30" y="615" font-size="16" fill="#787774">Evercore 预计年增量销售</text>

    <text x="30" y="680" font-size="18" font-weight="600" fill="#787774">失败模式</text>
    <text x="30" y="720" font-size="18" fill="#37352F">"AI 助手被忽略"</text>
    <text x="30" y="745" font-size="16" fill="#9B9A97">用户没用它，但也不损失</text>

    <text x="30" y="800" font-size="18" font-weight="600" fill="#787774">适合谁</text>
    <text x="30" y="830" font-size="18" fill="#37352F">有 1 亿+ DAU 电商 App 的玩家</text>
  </g>

  <!-- Route B: AI App -->
  <g transform="translate(560, 290)">
    <rect width="460" height="850" fill="#FFF3E0" stroke="#FFA500" stroke-width="2" rx="8"/>
    <text x="30" y="60" font-size="22" fill="#787774">路线 B</text>
    <text x="30" y="105" font-size="30" font-weight="700" fill="#FFA500">AI App 当入口</text>
    <text x="30" y="135" font-size="20" fill="#37352F">"成为购物入口"</text>

    <line x1="30" y1="160" x2="200" y2="160" stroke="#E3E2E0" stroke-width="2"/>

    <text x="30" y="200" font-size="18" font-weight="600" fill="#787774">代表玩家</text>
    <text x="30" y="240" font-size="22" font-weight="600" fill="#37352F">千问 App / 京东 AI 购</text>
    <text x="30" y="270" font-size="18" fill="#37352F">OpenAI 试过 / Perplexity</text>

    <text x="30" y="320" font-size="18" font-weight="600" fill="#787774">用户起点</text>
    <text x="30" y="360" font-size="20" fill="#37352F">打开 chat / AI App</text>

    <text x="30" y="410" font-size="18" font-weight="600" fill="#787774">核心数据</text>
    <text x="30" y="455" font-size="28" font-weight="700" fill="#FFA500">3 亿</text>
    <text x="30" y="485" font-size="16" fill="#787774">千问 MAU（across 多面）</text>
    <text x="30" y="520" font-size="28" font-weight="700" fill="#FFA500">2 亿次</text>
    <text x="30" y="550" font-size="16" fill="#787774">春节一句话下单</text>
    <text x="30" y="585" font-size="28" font-weight="700" fill="#D33">×</text>
    <text x="30" y="615" font-size="16" fill="#787774">OpenAI 14 个月撞墙</text>

    <text x="30" y="680" font-size="18" font-weight="600" fill="#787774">失败模式</text>
    <text x="30" y="720" font-size="18" fill="#37352F">"用户问完不在你这买"</text>
    <text x="30" y="745" font-size="16" fill="#D33">致命：流量白引</text>

    <text x="30" y="800" font-size="18" font-weight="600" fill="#787774">适合谁</text>
    <text x="30" y="830" font-size="18" fill="#37352F">拥有商品库 + AI 流量的玩家</text>
  </g>

  <!-- Conclusion -->
  <g transform="translate(60, 1190)">
    <rect width="960" height="100" fill="#37352F" rx="8"/>
    <text x="40" y="50" font-size="22" font-weight="600" fill="#FFFFFF">阿里能同时押两条路</text>
    <text x="40" y="80" font-size="18" fill="#9B9A97">前提：自己拥有 40 亿 SKU + 已有 3 亿 AI 触点。OpenAI 没有第一项，所以撞墙</text>
  </g>
</svg>
