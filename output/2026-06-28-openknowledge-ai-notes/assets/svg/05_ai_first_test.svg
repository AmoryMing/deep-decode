<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <style>
    .bg { fill: #F7F1E8; }
    .h1 { font: 700 22px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .desc { font: 400 13px 'PingFang SC', Inter, sans-serif; fill: #8A8170; }
    .q { font: 700 17px 'PingFang SC', Inter, sans-serif; fill: #B85A3A; }
    .num { font: 800 30px Inter, 'PingFang SC', sans-serif; fill: #B85A3A; }
    .item-t { font: 700 16px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .small { font: 400 13px 'PingFang SC', Inter, sans-serif; fill: #6B6356; }
    .card { fill: #FFFFFF; stroke: #D9CFBE; stroke-width: 1.5; }
  </style>
  <rect class="bg" width="800" height="460"/>
  <text class="h1" x="40" y="44">怎么判断一个工具是不是真 AI-first</text>
  <text class="desc" x="40" y="66">下次看到 "AI 笔记" "AI 知识库"，拿这三样比对——是真改了架构，还是侧边栏摆了个助手</text>

  <!-- 核心问句 -->
  <rect x="40" y="88" width="720" height="48" rx="10" fill="#FBEFE9" stroke="#B85A3A" stroke-width="2"/>
  <text class="q" x="60" y="118">问一句：AI 是嫁接在面向人的数据上，还是数据结构本身就为 agent 设计？</text>

  <!-- 三件套 -->
  <rect class="card" x="40" y="160" width="230" height="220" rx="12"/>
  <text class="num" x="60" y="206">1</text>
  <text class="item-t" x="60" y="244">纯文本当真相</text>
  <text class="small" x="60" y="276">内容是 markdown / mdx，</text>
  <text class="small" x="60" y="298">不是私有块结构或云数据库</text>
  <text class="small" x="60" y="330" fill="#B85A3A">你和 agent 读的是</text>
  <text class="small" x="60" y="352" fill="#B85A3A">同一份东西</text>

  <rect class="card" x="285" y="160" width="230" height="220" rx="12"/>
  <text class="num" x="305" y="206">2</text>
  <text class="item-t" x="305" y="244">git 做版本</text>
  <text class="small" x="305" y="276">改动有历史、可回滚、</text>
  <text class="small" x="305" y="298">可在 GitHub 上协作</text>
  <text class="small" x="305" y="330" fill="#B85A3A">文件始终是你的，</text>
  <text class="small" x="305" y="352" fill="#B85A3A">想搬走随时能搬</text>

  <rect class="card" x="530" y="160" width="230" height="220" rx="12"/>
  <text class="num" x="550" y="206">3</text>
  <text class="item-t" x="550" y="244">MCP 当进出口</text>
  <text class="small" x="550" y="276">给 agent 一套标准工具接口，</text>
  <text class="small" x="550" y="298">各家模型都能接进来</text>
  <text class="small" x="550" y="330" fill="#B85A3A">出入口是为 agent 开的，</text>
  <text class="small" x="550" y="352" fill="#B85A3A">不是给人界面的附属</text>

  <text class="desc" x="40" y="416">三样都占 → 真改了架构；只占界面侧边栏 → 还是 "做完了再加 AI"。</text>
  <text class="desc" x="40" y="438">接受这个设定，你记笔记的方式会变：开始为 "机器能不能读懂、能不能改" 而组织内容。</text>
</svg>
