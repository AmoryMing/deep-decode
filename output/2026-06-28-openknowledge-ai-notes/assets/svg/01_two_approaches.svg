<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <style>
    .bg { fill: #F7F1E8; }
    .h1 { font: 700 22px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .desc { font: 400 13px 'PingFang SC', Inter, sans-serif; fill: #8A8170; }
    .col-title { font: 700 17px 'PingFang SC', Inter, sans-serif; }
    .label { font: 600 14px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .small { font: 400 12px 'PingFang SC', Inter, sans-serif; fill: #6B6356; }
    .card-old { fill: #FFFFFF; stroke: #D9CFBE; stroke-width: 1.5; }
    .card-new { fill: #FBEFE9; stroke: #B85A3A; stroke-width: 2; }
    .inner { fill: #F2EADC; stroke: #D9CFBE; stroke-width: 1; }
    .ai-old { fill: #D9CFBE; stroke: #B8AE99; stroke-width: 1; }
    .ai-new { fill: #B85A3A; }
    .badge { font: 600 12px 'PingFang SC', Inter, sans-serif; }
  </style>
  <rect class="bg" width="800" height="500"/>
  <text class="h1" x="40" y="44">同一个词，两种做法</text>
  <text class="desc" x="40" y="66">"AI 笔记" 差的不是功能，是架构：AI 从旁边接进来，还是数据本身为它而设计</text>

  <!-- LEFT: 插件式 -->
  <text class="col-title" x="40" y="110" fill="#8A8170">插件式 AI · 软件先为人做好</text>
  <rect class="card-old" x="40" y="124" width="340" height="320" rx="12"/>

  <rect class="inner" x="62" y="150" width="220" height="270" rx="8"/>
  <text class="label" x="80" y="180">面向人的笔记本</text>
  <text class="small" x="80" y="206">Notion / Obsidian</text>
  <text class="small" x="80" y="228">数据锁在块结构 / 云里</text>
  <line x1="80" y1="248" x2="262" y2="248" stroke="#D9CFBE" stroke-width="1"/>
  <text class="small" x="80" y="274">界面</text>
  <text class="small" x="80" y="300">块结构 / 私有格式</text>
  <text class="small" x="80" y="326">云数据库</text>

  <!-- 侧边栏 AI -->
  <rect class="ai-old" x="300" y="150" width="58" height="270" rx="8"/>
  <text class="badge" x="312" y="278" fill="#6B6356" transform="rotate(90 312 278)">侧边栏 AI 助手</text>
  <text class="small" x="62" y="442">AI 拿到的是被包装过的二手数据</text>

  <!-- RIGHT: AI-first -->
  <text class="col-title" x="420" y="110" fill="#B85A3A">AI-first · 数据本身为 agent 设计</text>
  <rect class="card-new" x="420" y="124" width="340" height="320" rx="12"/>

  <rect class="inner" x="442" y="150" width="296" height="56" rx="8"/>
  <text class="label" x="460" y="174">人看：漂亮富文本视图</text>
  <text class="small" x="460" y="194">WYSIWYG 编辑层</text>

  <rect class="inner" x="442" y="222" width="296" height="56" rx="8"/>
  <text class="label" x="460" y="246">底层：纯文本文件 + git</text>
  <text class="small" x="460" y="266">唯一真相来源</text>

  <rect class="ai-new" x="442" y="294" width="296" height="60" rx="8"/>
  <text class="label" x="460" y="320" fill="#F7F1E8">agent 走专用通道直读底层</text>
  <text class="small" x="460" y="340" fill="#F2E2D8">MCP + skills 工具层</text>

  <text class="small" x="442" y="386" fill="#B85A3A">agent 拿到的，和你拿到的是同一份东西</text>
  <text class="small" x="442" y="424">给 AI 单独开了一条进知识库的路，</text>
  <text class="small" x="442" y="440">不是在人的界面旁边接一个助手</text>
</svg>
