<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <text x="40" y="54" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="700" fill="#37352F">三层不是化学比喻，是工程史的常态</text>
  <text x="40" y="84" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#787774">人脑能稳定 hold 住的最大抽象数。再加一层，driver 自己就糊了。</text>

  <g font-family="PingFang SC, Inter, sans-serif">
    <text x="120" y="138" font-size="14" font-weight="700" fill="#787774" text-anchor="middle">领域</text>
    <text x="296" y="138" font-size="14" font-weight="700" fill="#2383E2" text-anchor="middle">原子层</text>
    <text x="464" y="138" font-size="14" font-weight="700" fill="#2383E2" text-anchor="middle">分子层</text>
    <text x="650" y="138" font-size="14" font-weight="700" fill="#FFA500" text-anchor="middle">化合物层</text>
    <line x1="60" y1="156" x2="740" y2="156" stroke="#E3E2E0"/>

    <text x="120" y="196" font-size="14" fill="#37352F" text-anchor="middle">写代码</text>
    <rect x="216" y="174" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="296" y="197" font-size="13" fill="#37352F" text-anchor="middle">函数</text>
    <rect x="384" y="174" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="464" y="197" font-size="13" fill="#37352F" text-anchor="middle">模块</text>
    <rect x="570" y="174" width="160" height="36" rx="6" fill="#FFF3E0" stroke="#FFA500"/>
    <text x="650" y="197" font-size="13" fill="#37352F" text-anchor="middle">服务</text>

    <text x="120" y="244" font-size="14" fill="#37352F" text-anchor="middle">组织</text>
    <rect x="216" y="222" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="296" y="245" font-size="13" fill="#37352F" text-anchor="middle">IC</text>
    <rect x="384" y="222" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="464" y="245" font-size="13" fill="#37352F" text-anchor="middle">经理</text>
    <rect x="570" y="222" width="160" height="36" rx="6" fill="#FFF3E0" stroke="#FFA500"/>
    <text x="650" y="245" font-size="13" fill="#37352F" text-anchor="middle">CTO</text>

    <text x="120" y="292" font-size="14" fill="#37352F" text-anchor="middle">计算</text>
    <rect x="216" y="270" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="296" y="293" font-size="13" fill="#37352F" text-anchor="middle">指令</text>
    <rect x="384" y="270" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="464" y="293" font-size="13" fill="#37352F" text-anchor="middle">子程序</text>
    <rect x="570" y="270" width="160" height="36" rx="6" fill="#FFF3E0" stroke="#FFA500"/>
    <text x="650" y="293" font-size="13" fill="#37352F" text-anchor="middle">进程</text>

    <text x="120" y="340" font-size="14" fill="#37352F" text-anchor="middle">化学</text>
    <rect x="216" y="318" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="296" y="341" font-size="13" fill="#37352F" text-anchor="middle">原子</text>
    <rect x="384" y="318" width="160" height="36" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
    <text x="464" y="341" font-size="13" fill="#37352F" text-anchor="middle">分子</text>
    <rect x="570" y="318" width="160" height="36" rx="6" fill="#FFF3E0" stroke="#FFA500"/>
    <text x="650" y="341" font-size="13" fill="#37352F" text-anchor="middle">化合物</text>

    <text x="120" y="388" font-size="14" font-weight="700" fill="#2383E2" text-anchor="middle">Skill 工程</text>
    <rect x="216" y="366" width="160" height="36" rx="6" fill="#FFFFFF" stroke="#2383E2"/>
    <text x="296" y="389" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">capabilities</text>
    <rect x="384" y="366" width="160" height="36" rx="6" fill="#FFFFFF" stroke="#2383E2"/>
    <text x="464" y="389" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">composites</text>
    <rect x="570" y="366" width="160" height="36" rx="6" fill="#FFF3E0" stroke="#FFA500" stroke-width="2"/>
    <text x="650" y="389" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">playbooks</text>
  </g>

  <text x="400" y="448" font-family="PingFang SC, Inter, sans-serif" font-size="14" fill="#37352F" text-anchor="middle">规律：橙色那一层是人保留判断的位置。</text>
  <text x="400" y="472" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774" text-anchor="middle">7±2 chunk 上限 ≈ Shiv 给出的 8-10 个 molecule 编排极限</text>
</svg>
