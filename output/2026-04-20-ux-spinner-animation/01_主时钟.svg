<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="PingFang SC, Inter, sans-serif">
  <rect width="800" height="520" fill="#FFFFFF"/>
  <text x="400" y="50" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="middle">50ms 主时钟驱动 6 条动画</text>
  <text x="400" y="78" font-size="14" fill="#666666" text-anchor="middle">一次 useAnimationFrame(50)，一分钟刷 1200 帧，所有子动画共享</text>

  <!-- center clock -->
  <circle cx="400" cy="280" r="90" fill="#FFFFFF" stroke="#2383E2" stroke-width="3"/>
  <text x="400" y="270" font-size="18" font-weight="700" fill="#2383E2" text-anchor="middle">50ms</text>
  <text x="400" y="295" font-size="13" fill="#666666" text-anchor="middle">useAnimationFrame</text>
  <text x="400" y="315" font-size="11" fill="#888888" text-anchor="middle">time 秒数共享</text>

  <!-- 6 branches -->
  <!-- top left -->
  <line x1="340" y1="215" x2="200" y2="160" stroke="#E3E2E0" stroke-width="1.5"/>
  <rect x="60" y="135" width="160" height="52" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
  <text x="140" y="158" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">glyph 帧切换</text>
  <text x="140" y="178" font-size="11" fill="#666666" text-anchor="middle">120ms 一帧 · 12 帧循环</text>

  <!-- top right -->
  <line x1="460" y1="215" x2="600" y2="160" stroke="#E3E2E0" stroke-width="1.5"/>
  <rect x="580" y="135" width="160" height="52" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
  <text x="660" y="158" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">shimmer 扫描</text>
  <text x="660" y="178" font-size="11" fill="#666666" text-anchor="middle">50 或 200ms 一步</text>

  <!-- mid left -->
  <line x1="310" y1="280" x2="200" y2="280" stroke="#E3E2E0" stroke-width="1.5"/>
  <rect x="60" y="255" width="160" height="52" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
  <text x="140" y="278" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">token 计数</text>
  <text x="140" y="298" font-size="11" fill="#666666" text-anchor="middle">插值追赶真实值</text>

  <!-- mid right -->
  <line x1="490" y1="280" x2="600" y2="280" stroke="#E3E2E0" stroke-width="1.5"/>
  <rect x="580" y="255" width="160" height="52" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
  <text x="660" y="278" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">已用时长</text>
  <text x="660" y="298" font-size="11" fill="#666666" text-anchor="middle">now - startTime</text>

  <!-- bottom left -->
  <line x1="340" y1="345" x2="200" y2="400" stroke="#E3E2E0" stroke-width="1.5"/>
  <rect x="60" y="375" width="160" height="52" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
  <text x="140" y="398" font-size="13" font-weight="600" fill="#AB2B3F" text-anchor="middle">stalled 红色插值</text>
  <text x="140" y="418" font-size="11" fill="#666666" text-anchor="middle">3s 阈值 · 2s 渐变</text>

  <!-- bottom right -->
  <line x1="460" y1="345" x2="600" y2="400" stroke="#E3E2E0" stroke-width="1.5"/>
  <rect x="580" y="375" width="160" height="52" rx="6" fill="#F7F7F5" stroke="#E3E2E0"/>
  <text x="660" y="398" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">thinking 呼吸</text>
  <text x="660" y="418" font-size="11" fill="#666666" text-anchor="middle">2s sine 波</text>

  <text x="400" y="480" font-size="13" fill="#666666" text-anchor="middle">reducedMotion 模式：useAnimationFrame(null) 一键切断整套时钟</text>
</svg>
