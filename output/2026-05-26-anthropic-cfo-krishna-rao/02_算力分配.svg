<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#F7F1E8"/>

  <!-- title -->
  <text x="800" y="100" font-family="Cormorant Garamond, Songti SC, serif" font-size="48" font-weight="700" fill="#2A241B" text-anchor="middle">算力每天在三件事之间打架</text>
  <text x="800" y="148" font-family="Cormorant Garamond, Songti SC, serif" font-size="22" font-style="italic" fill="#5C5345" text-anchor="middle">CFO 30–40% 时间在做这条配比——前沿模型的最低基线不可让渡。</text>
  <line x1="700" y1="180" x2="900" y2="180" stroke="#B85A3A" stroke-width="2"/>

  <!-- pool box -->
  <g transform="translate(120, 260)">
    <rect x="0" y="0" width="1360" height="140" fill="#ECE5D3" stroke="#2A241B" stroke-width="2" rx="8"/>
    <text x="40" y="55" font-family="SF Mono, Menlo, monospace" font-size="18" fill="#B85A3A" letter-spacing="4">DAILY COMPUTE POOL</text>
    <text x="40" y="105" font-family="Cormorant Garamond, serif" font-size="44" font-weight="700" fill="#2A241B">~ $100B 承诺池 · 每日开会切分</text>
    <text x="1320" y="110" font-family="PingFang SC, sans-serif" font-size="22" fill="#5C5345" text-anchor="end">三向竞争 · 零和</text>
  </g>

  <!-- arrows -->
  <g stroke="#B85A3A" stroke-width="3" fill="none">
    <path d="M 360 420 L 360 480" marker-end="url(#arr)"/>
    <path d="M 800 420 L 800 480" marker-end="url(#arr)"/>
    <path d="M 1240 420 L 1240 480" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B85A3A"/>
    </marker>
  </defs>

  <!-- three pillars -->
  <g transform="translate(160, 500)">
    <rect x="0" y="0" width="400" height="320" fill="#B85A3A" rx="6"/>
    <text x="200" y="60" font-family="SF Mono, Menlo, monospace" font-size="18" fill="#F7F1E8" letter-spacing="4" text-anchor="middle">PRIORITY · I</text>
    <text x="200" y="130" font-family="Cormorant Garamond, serif" font-size="38" font-weight="700" fill="#F7F1E8" text-anchor="middle">前沿模型开发</text>
    <text x="200" y="180" font-family="PingFang SC, sans-serif" font-size="20" fill="#F7F1E8" text-anchor="middle">下一代 Claude 训练</text>
    <line x1="60" y1="220" x2="340" y2="220" stroke="#F7F1E8" stroke-width="1.5" opacity="0.5"/>
    <text x="200" y="260" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#F7F1E8" text-anchor="middle">不可让渡基线</text>
    <text x="200" y="290" font-family="PingFang SC, sans-serif" font-size="18" fill="#F7F1E8" text-anchor="middle">凌驾短期收入机会</text>
  </g>

  <g transform="translate(600, 500)">
    <rect x="0" y="0" width="400" height="320" fill="#2A241B" rx="6"/>
    <text x="200" y="60" font-family="SF Mono, Menlo, monospace" font-size="18" fill="#F7F1E8" letter-spacing="4" text-anchor="middle">PRIORITY · II</text>
    <text x="200" y="130" font-family="Cormorant Garamond, serif" font-size="38" font-weight="700" fill="#F7F1E8" text-anchor="middle">内部使用</text>
    <text x="200" y="180" font-family="PingFang SC, sans-serif" font-size="20" fill="#F7F1E8" text-anchor="middle">产品 · 研发 · 自动化</text>
    <line x1="60" y1="220" x2="340" y2="220" stroke="#F7F1E8" stroke-width="1.5" opacity="0.5"/>
    <text x="200" y="260" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#F7F1E8" text-anchor="middle">财务团队 70+ Claude skills</text>
    <text x="200" y="290" font-family="PingFang SC, sans-serif" font-size="18" fill="#F7F1E8" text-anchor="middle">月报准备 90–95% AI 就绪</text>
  </g>

  <g transform="translate(1040, 500)">
    <rect x="0" y="0" width="400" height="320" fill="#5C5345" rx="6"/>
    <text x="200" y="60" font-family="SF Mono, Menlo, monospace" font-size="18" fill="#F7F1E8" letter-spacing="4" text-anchor="middle">PRIORITY · III</text>
    <text x="200" y="130" font-family="Cormorant Garamond, serif" font-size="38" font-weight="700" fill="#F7F1E8" text-anchor="middle">客户服务</text>
    <text x="200" y="180" font-family="PingFang SC, sans-serif" font-size="20" fill="#F7F1E8" text-anchor="middle">API · Claude.ai · 企业推理</text>
    <line x1="60" y1="220" x2="340" y2="220" stroke="#F7F1E8" stroke-width="1.5" opacity="0.5"/>
    <text x="200" y="260" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#F7F1E8" text-anchor="middle">$30B ARR 来源</text>
    <text x="200" y="290" font-family="PingFang SC, sans-serif" font-size="18" fill="#F7F1E8" text-anchor="middle">Jevons paradox 推动需求暴涨</text>
  </g>

  <!-- footer -->
  <text x="120" y="940" font-family="SF Mono, Menlo, monospace" font-size="16" fill="#8A8472" letter-spacing="3">FIG. 02 · DAILY COMPUTE TRIAGE</text>
  <text x="1480" y="940" font-family="Cormorant Garamond, serif" font-size="20" font-style="italic" fill="#5C5345" text-anchor="end">"算力是 lifeblood，不是成本项。"</text>
</svg>
