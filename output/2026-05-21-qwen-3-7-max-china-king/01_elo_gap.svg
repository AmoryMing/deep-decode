<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="50" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#37352F">追近不追平</text>
  <text x="60" y="76" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">半年 Elo 变化：Qwen +11，LM Arena 头部 +7，绝对差仍 26 分</text>

  <line x1="60" y1="95" x2="740" y2="95" stroke="#E9E9E7" stroke-width="1"/>

  <!-- Chart area: horizontal bars showing Elo on a 1450-1510 scale -->
  <!-- baseline at x=160, scale: (value - 1450) * 9 -->
  <!-- 1450 -> 160; 1510 -> 700 -->

  <g transform="translate(0, 130)">
    <!-- Axis ticks -->
    <g font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9B9A97">
      <text x="160" y="270" text-anchor="middle">1450</text>
      <text x="295" y="270" text-anchor="middle">1465</text>
      <text x="430" y="270" text-anchor="middle">1480</text>
      <text x="565" y="270" text-anchor="middle">1495</text>
      <text x="700" y="270" text-anchor="middle">1510</text>
    </g>
    <!-- Vertical guide lines -->
    <g stroke="#F1F1EF" stroke-width="1">
      <line x1="160" y1="0" x2="160" y2="255"/>
      <line x1="295" y1="0" x2="295" y2="255"/>
      <line x1="430" y1="0" x2="430" y2="255"/>
      <line x1="565" y1="0" x2="565" y2="255"/>
      <line x1="700" y1="0" x2="700" y2="255"/>
    </g>

    <!-- Row 1: Claude Opus 4.6 Thinking (head) -->
    <text x="150" y="40" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" text-anchor="end" font-weight="500">Claude Opus 4.6 Thinking</text>
    <!-- half year ago bar: 1494 -->
    <rect x="160" y="22" width="396" height="14" fill="#D3E5EF"/>
    <text x="562" y="33" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">1494 (半年前)</text>
    <!-- now bar: 1501 -->
    <rect x="160" y="42" width="459" height="14" fill="#2383E2"/>
    <text x="625" y="53" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" font-weight="600">1501 (现)  +7</text>

    <!-- Row 2: Qwen3.7-Max vs Qwen3.5-Max -->
    <text x="150" y="105" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" text-anchor="end" font-weight="500">Qwen Max (阿里)</text>
    <rect x="160" y="87" width="126" height="14" fill="#FBE4E4"/>
    <text x="292" y="98" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">1464 (Qwen3.5-Max)</text>
    <rect x="160" y="107" width="225" height="14" fill="#E03E3E"/>
    <text x="391" y="118" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F" font-weight="600">1475 (Qwen3.7-Max)  +11</text>

    <!-- Gap annotation between 1475 and 1501 -->
    <g transform="translate(0, 160)">
      <line x1="385" y1="0" x2="619" y2="0" stroke="#9B9A97" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="385" y1="-6" x2="385" y2="6" stroke="#9B9A97" stroke-width="1"/>
      <line x1="619" y1="-6" x2="619" y2="6" stroke="#9B9A97" stroke-width="1"/>
      <rect x="465" y="-14" width="74" height="28" fill="#FFFFFF"/>
      <text x="502" y="5" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#37352F" font-weight="600" text-anchor="middle">26 Elo</text>
    </g>
    <text x="502" y="195" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">头部与追赶者的绝对差，半年没缩小</text>

    <!-- Footnote -->
    <text x="60" y="245" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#9B9A97">数据来源：LM Arena Text Leaderboard，2026-05-20 截图</text>
  </g>
</svg>
