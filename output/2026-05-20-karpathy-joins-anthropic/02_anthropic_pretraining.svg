<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="50" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">Anthropic 的差异化：让 Claude 加速 pre-training</text>
  <text x="40" y="78" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">AI-assisted research vs. 纯堆算力 · 一句 PR 背后的人事证据</text>

  <!-- Center node: Karpathy -->
  <rect x="320" y="160" width="160" height="80" fill="#DA7756" rx="6"/>
  <text x="400" y="194" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Andrej Karpathy</text>
  <text x="400" y="218" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">向 Nick Joseph 汇报</text>

  <!-- Top: Anthropic pre-training team -->
  <rect x="280" y="40" width="240" height="60" fill="#FAF9F7" stroke="#37352F" stroke-width="1.5" rx="4"/>
  <text x="400" y="64" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#37352F" text-anchor="middle">Anthropic Pre-training Team</text>
  <text x="400" y="86" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">本周报到 · 组小队</text>
  <line x1="400" y1="100" x2="400" y2="160" stroke="#37352F" stroke-width="1.5"/>

  <!-- Left: Karpathy's strength -->
  <rect x="40" y="140" width="240" height="120" fill="#FFF4ED" stroke="#DA7756" stroke-width="1.5" rx="4"/>
  <text x="60" y="166" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#DA7756">他的强项</text>
  <text x="60" y="190" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">• nanoGPT · llm.c</text>
  <text x="60" y="212" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">• nanochat · LLM101n</text>
  <text x="60" y="234" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">• 把训练流水线压成</text>
  <text x="76" y="252" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">更小、更快、可解释</text>
  <line x1="280" y1="200" x2="320" y2="200" stroke="#DA7756" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Right: Anthropic's bet -->
  <rect x="520" y="140" width="240" height="120" fill="#FFF4ED" stroke="#DA7756" stroke-width="1.5" rx="4"/>
  <text x="540" y="166" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="700" fill="#DA7756">Anthropic 的需要</text>
  <text x="540" y="190" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">把 pre-training 拆成</text>
  <text x="540" y="212" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">Claude 能消化的颗粒：</text>
  <text x="540" y="234" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">可测 / 可重放 / 可解释</text>
  <text x="540" y="252" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">的实验单位</text>
  <line x1="480" y1="200" x2="520" y2="200" stroke="#DA7756" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom: arrow + outcome -->
  <line x1="400" y1="240" x2="400" y2="310" stroke="#DA7756" stroke-width="2.5"/>
  <polygon points="395,300 400,312 405,300" fill="#DA7756"/>

  <rect x="100" y="320" width="600" height="160" fill="#FAF9F7" stroke="#E0E0DE" stroke-width="1" rx="6"/>
  <text x="120" y="350" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="700" fill="#37352F">Karpathy 大概是 LLM 圈最适合做这件事的人</text>
  <text x="120" y="378" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">让 Claude 替研究员做实验设计、跑 ablation、读 log、写 kernel——</text>
  <text x="120" y="398" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#37352F">这要先把 pre-training 工作流变成模型能消化的颗粒度。</text>
  <text x="120" y="430" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#DA7756">TechCrunch 原文："AI-assisted research, rather than pure compute,</text>
  <text x="120" y="450" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="600" fill="#DA7756">is how it stays competitive with OpenAI and Google."</text>
</svg>
