<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="50" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="700" fill="#37352F">Karpathy 11 年五跳：两次离开 OpenAI，两次去对家</text>
  <text x="40" y="78" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">2015 → 2026 完整轨迹 · 终点回到基础模型预训练</text>

  <!-- Horizontal timeline -->
  <line x1="60" y1="260" x2="760" y2="260" stroke="#E0E0DE" stroke-width="2"/>

  <!-- Node 1: OpenAI 2015 -->
  <circle cx="100" cy="260" r="10" fill="#787774"/>
  <text x="100" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">2015</text>
  <text x="100" y="290" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">OpenAI</text>
  <text x="100" y="308" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">联合创办</text>

  <!-- Node 2: Tesla 2017 -->
  <circle cx="240" cy="260" r="10" fill="#2383E2"/>
  <text x="240" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">2017</text>
  <text x="240" y="290" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">Tesla</text>
  <text x="240" y="308" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">AI Director</text>
  <text x="240" y="324" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#DA7756" text-anchor="middle">第一次离开</text>

  <!-- Node 3: OpenAI 2023 -->
  <circle cx="380" cy="260" r="9" fill="#787774"/>
  <text x="380" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">2023</text>
  <text x="380" y="290" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">OpenAI</text>
  <text x="380" y="308" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">回归约一年</text>

  <!-- Node 4: Eureka 2024 -->
  <circle cx="520" cy="260" r="10" fill="#FFB020"/>
  <text x="520" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">2024</text>
  <text x="520" y="290" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="600" fill="#37352F" text-anchor="middle">Eureka Labs</text>
  <text x="520" y="308" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">AI-native 教育</text>
  <text x="520" y="324" font-family="PingFang SC, Inter, sans-serif" font-size="10" fill="#DA7756" text-anchor="middle">第二次离开</text>

  <!-- Node 5: Anthropic 2026 (highlight) -->
  <circle cx="700" cy="260" r="16" fill="#DA7756"/>
  <circle cx="700" cy="260" r="22" fill="none" stroke="#DA7756" stroke-width="1.5" opacity="0.4"/>
  <text x="700" y="226" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="700" fill="#DA7756" text-anchor="middle">2026</text>
  <text x="700" y="296" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="700" fill="#37352F" text-anchor="middle">Anthropic</text>
  <text x="700" y="314" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="600" fill="#DA7756" text-anchor="middle">pre-training team</text>

  <!-- Connection arrow -->
  <path d="M 560 260 L 678 260" stroke="#DA7756" stroke-width="2.5" fill="none" stroke-dasharray="0"/>
  <polygon points="678,255 690,260 678,265" fill="#DA7756"/>

  <!-- Bottom annotation boxes -->
  <rect x="40" y="380" width="350" height="86" fill="#FAF9F7" stroke="#E0E0DE" stroke-width="1" rx="4"/>
  <text x="56" y="404" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="700" fill="#37352F">2017 → Tesla</text>
  <text x="56" y="424" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">Musk 跟 OpenAI 分家的载体</text>
  <text x="56" y="446" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Ilya Sutskever 当时还在 OpenAI</text>

  <rect x="410" y="380" width="350" height="86" fill="#FFF4ED" stroke="#DA7756" stroke-width="1.5" rx="4"/>
  <text x="426" y="404" font-family="PingFang SC, Inter, sans-serif" font-size="12" font-weight="700" fill="#DA7756">2026 → Anthropic</text>
  <text x="426" y="424" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">Amodei 兄妹跟 OpenAI 分家的载体</text>
  <text x="426" y="446" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">Sutskever 已离开 · Altman 沉默</text>
</svg>
