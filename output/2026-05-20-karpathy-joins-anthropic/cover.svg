<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#2A1F1A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="62" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#F5EFE7">Karpathy 加入 Anthropic</text>
  <text x="40" y="92" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14" fill="#DA7756">明星个体迁徙作为路线信号</text>

  <!-- Timeline horizontal line -->
  <line x1="60" y1="240" x2="740" y2="240" stroke="#4A3A30" stroke-width="2"/>

  <!-- Node: OpenAI 2015 -->
  <circle cx="120" cy="240" r="10" fill="#7A7A7A"/>
  <text x="120" y="220" font-family="PingFang SC, sans-serif" font-size="12" fill="#CFCFCF" text-anchor="middle">2015</text>
  <text x="120" y="270" font-family="PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#F5EFE7" text-anchor="middle">OpenAI</text>
  <text x="120" y="286" font-family="PingFang SC, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">联创</text>

  <!-- Node: Tesla 2017 -->
  <circle cx="245" cy="240" r="8" fill="#5A5A5A"/>
  <text x="245" y="220" font-family="PingFang SC, sans-serif" font-size="12" fill="#CFCFCF" text-anchor="middle">2017</text>
  <text x="245" y="270" font-family="PingFang SC, sans-serif" font-size="12" fill="#E5E0D8" text-anchor="middle">Tesla</text>
  <text x="245" y="286" font-family="PingFang SC, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">AI 总监</text>

  <!-- Node: OpenAI again 2023 -->
  <circle cx="370" cy="240" r="8" fill="#5A5A5A"/>
  <text x="370" y="220" font-family="PingFang SC, sans-serif" font-size="12" fill="#CFCFCF" text-anchor="middle">2023</text>
  <text x="370" y="270" font-family="PingFang SC, sans-serif" font-size="12" fill="#E5E0D8" text-anchor="middle">OpenAI</text>
  <text x="370" y="286" font-family="PingFang SC, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">回归一年</text>

  <!-- Node: Eureka 2024 -->
  <circle cx="495" cy="240" r="8" fill="#5A5A5A"/>
  <text x="495" y="220" font-family="PingFang SC, sans-serif" font-size="12" fill="#CFCFCF" text-anchor="middle">2024</text>
  <text x="495" y="270" font-family="PingFang SC, sans-serif" font-size="12" fill="#E5E0D8" text-anchor="middle">Eureka Labs</text>
  <text x="495" y="286" font-family="PingFang SC, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">AI 教育</text>

  <!-- Node: Anthropic 2026 (highlighted) -->
  <circle cx="660" cy="240" r="14" fill="#DA7756" stroke="#F5EFE7" stroke-width="2"/>
  <text x="660" y="216" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#DA7756" text-anchor="middle">2026</text>
  <text x="660" y="276" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#F5EFE7" text-anchor="middle">Anthropic</text>
  <text x="660" y="294" font-family="PingFang SC, sans-serif" font-size="11" fill="#DA7756" text-anchor="middle">pre-training team</text>

  <!-- Arrow accent -->
  <path d="M 545 240 L 635 240" stroke="#DA7756" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#DA7756"/>
    </marker>
  </defs>

  <!-- Bottom tagline -->
  <text x="40" y="380" font-family="PingFang SC, sans-serif" font-size="13" fill="#9A9A9A">联创第二次离开 OpenAI，第二次去对家。</text>
  <text x="40" y="402" font-family="PingFang SC, sans-serif" font-size="13" fill="#9A9A9A">这次坐到的是 pre-training。</text>
  <text x="40" y="430" font-family="PingFang SC, sans-serif" font-size="11" fill="#DA7756">decode · 2026-05-20</text>
</svg>
