<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <style>
    .bg { fill: #F7F1E8; }
    .h1 { font: 800 24px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .desc { font: 400 14px 'PingFang SC', Inter, sans-serif; fill: #8A8073; }
    .section { font: 700 15px 'PingFang SC', Inter, sans-serif; fill: #B85A3A; }
    .stat-num { font: 800 30px Inter, 'PingFang SC', sans-serif; fill: #2A241B; }
    .stat-label { font: 500 13px 'PingFang SC', Inter, sans-serif; fill: #6B6256; }
    .card { fill: #FFFFFF; stroke: #D9CFBE; stroke-width: 1.5; }
    .dim-title { font: 700 16px 'PingFang SC', Inter, sans-serif; fill: #2A241B; }
    .dim-body { font: 400 13px 'PingFang SC', Inter, sans-serif; fill: #6B6256; }
    .pill { fill: #EFE6D6; }
    .pill-txt { font: 600 12px 'PingFang SC', Inter, sans-serif; fill: #B85A3A; }
  </style>
  <rect class="bg" width="800" height="540"/>

  <text class="h1" x="40" y="44">VitaBench 2.0 到底在考什么</text>
  <text class="desc" x="40" y="68">一句话：能不能跨天、跨会话地记住并服务同一个人</text>

  <!-- 规模数字条 -->
  <text class="section" x="40" y="104">规模：把「长期」做实了</text>
  <g>
    <rect class="card" x="40" y="118" width="138" height="80" rx="10"/>
    <text class="stat-num" x="60" y="160">56</text>
    <text class="stat-label" x="60" y="182">虚拟用户</text>
  </g>
  <g>
    <rect class="card" x="190" y="118" width="138" height="80" rx="10"/>
    <text class="stat-num" x="210" y="160">819</text>
    <text class="stat-label" x="210" y="182">任务（按序列）</text>
  </g>
  <g>
    <rect class="card" x="340" y="118" width="138" height="80" rx="10"/>
    <text class="stat-num" x="360" y="160">1580</text>
    <text class="stat-label" x="360" y="182">天 平均交互跨度</text>
  </g>
  <g>
    <rect class="card" x="490" y="118" width="138" height="80" rx="10"/>
    <text class="stat-num" x="510" y="160">2000+</text>
    <text class="stat-label" x="510" y="182">动态偏好</text>
  </g>
  <g>
    <rect class="card" x="640" y="118" width="120" height="80" rx="10"/>
    <text class="stat-num" x="660" y="160">66</text>
    <text class="stat-label" x="660" y="182">可执行工具</text>
  </g>

  <!-- 四个考核维度 -->
  <text class="section" x="40" y="242">考核拆成四个维度（前三个属个性化，第四个是主动性）</text>

  <g>
    <rect class="card" x="40" y="258" width="350" height="120" rx="12"/>
    <rect class="pill" x="58" y="276" width="86" height="22" rx="11"/>
    <text class="pill-txt" x="71" y="291">个性化 1</text>
    <text class="dim-title" x="58" y="328">偏好抽取</text>
    <text class="dim-body" x="58" y="352">从碎片化交互里推断用户没</text>
    <text class="dim-body" x="58" y="370">明说的真实偏好</text>
  </g>
  <g>
    <rect class="card" x="410" y="258" width="350" height="120" rx="12"/>
    <rect class="pill" x="428" y="276" width="86" height="22" rx="11"/>
    <text class="pill-txt" x="441" y="291">个性化 2</text>
    <text class="dim-title" x="428" y="328">偏好运用</text>
    <text class="dim-body" x="428" y="352">把推断出的偏好真正用进</text>
    <text class="dim-body" x="428" y="370">决策，而不是摆设</text>
  </g>
  <g>
    <rect class="card" x="40" y="392" width="350" height="120" rx="12"/>
    <rect class="pill" x="58" y="410" width="86" height="22" rx="11"/>
    <text class="pill-txt" x="71" y="425">个性化 3</text>
    <text class="dim-title" x="58" y="462">偏好更新</text>
    <text class="dim-body" x="58" y="486">偏好会增删改（忌口香菜→</text>
    <text class="dim-body" x="58" y="504">接受了），能不能跟着改</text>
  </g>
  <g>
    <rect class="card" x="410" y="392" width="350" height="120" rx="12"/>
    <rect class="pill" x="428" y="410" width="72" height="22" rx="11" fill="#B85A3A"/>
    <text class="pill-txt" x="441" y="425" fill="#F7F1E8">主动性</text>
    <text class="dim-title" x="428" y="462">信息不足时主动追问</text>
    <text class="dim-body" x="428" y="486">而不是硬着头皮替用户拍板</text>
    <text class="dim-body" x="428" y="504">（含 20% 噪音干扰判断）</text>
  </g>
</svg>
