<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="PingFang SC, Inter, sans-serif">
  <rect width="800" height="540" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#37352F">扩散 vs 自回归: 文字和像素谁先想清楚</text>
  <text x="40" y="72" font-size="14" fill="#787774">Uni-1.1 在主流路径之外押注 decoder-only Transformer</text>

  <!-- Diffusion side -->
  <g transform="translate(40, 100)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#787774">扩散模型 (主流)</text>
    <rect x="0" y="20" width="340" height="60" fill="#F7F6F3" stroke="#E3E2E0" rx="4"/>
    <text x="20" y="46" font-size="14" fill="#37352F">文字 prompt</text>
    <text x="20" y="65" font-size="12" fill="#787774">通过 cross-attention 注入</text>

    <line x1="170" y1="80" x2="170" y2="110" stroke="#787774" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="0" y="115" width="340" height="120" fill="#FFFFFF" stroke="#E3E2E0" rx="4"/>
    <text x="20" y="142" font-size="14" font-weight="700" fill="#37352F">从噪声雕刻图像</text>
    <text x="20" y="166" font-size="12" fill="#787774">U-Net 多步去噪</text>
    <text x="20" y="186" font-size="12" fill="#787774">文字与像素分两个空间</text>
    <text x="20" y="210" font-size="11" fill="#C0392B">短板: 逻辑约束容易丢</text>
    <text x="20" y="226" font-size="11" fill="#C0392B">画三个苹果 → 经常给两个</text>

    <rect x="0" y="255" width="340" height="80" fill="#FBEDED" stroke="#E0AAAA" rx="4"/>
    <text x="20" y="282" font-size="13" font-weight="700" fill="#A82A2A">速度: 5-10 秒/张</text>
    <text x="20" y="305" font-size="12" fill="#5A2B2B">文字渲染精度: 低</text>
    <text x="20" y="325" font-size="12" fill="#5A2B2B">复杂版面控制: 弱</text>
  </g>

  <!-- Autoregressive side -->
  <g transform="translate(420, 100)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#2383E2">Uni-1.1 自回归</text>
    <rect x="0" y="20" width="340" height="60" fill="#E8F1FB" stroke="#2383E2" rx="4"/>
    <text x="20" y="46" font-size="14" fill="#37352F">文字 token + 图像 token</text>
    <text x="20" y="65" font-size="12" fill="#2383E2">塞进同一条序列</text>

    <line x1="170" y1="80" x2="170" y2="110" stroke="#2383E2" stroke-width="2" marker-end="url(#arrb)"/>

    <rect x="0" y="115" width="340" height="120" fill="#FFFFFF" stroke="#2383E2" rx="4"/>
    <text x="20" y="142" font-size="14" font-weight="700" fill="#37352F">同一个 forward pass</text>
    <text x="20" y="166" font-size="12" fill="#787774">先在内部推理布局</text>
    <text x="20" y="186" font-size="12" fill="#787774">再开始落像素</text>
    <text x="20" y="210" font-size="11" fill="#2383E2">优势: 推理类任务可控</text>
    <text x="20" y="226" font-size="11" fill="#2383E2">RISEBench 排名第一</text>

    <rect x="0" y="255" width="340" height="80" fill="#E8F1FB" stroke="#2383E2" rx="4"/>
    <text x="20" y="282" font-size="13" font-weight="700" fill="#2383E2">速度: 31 秒/张</text>
    <text x="20" y="305" font-size="12" fill="#37352F">文字渲染精度: 接近零错</text>
    <text x="20" y="325" font-size="12" fill="#37352F">价格: 同类不到一半</text>
  </g>

  <text x="400" y="475" text-anchor="middle" font-size="13" fill="#37352F" font-weight="700">关键差异: 文字与像素是否被等价对待</text>
  <text x="400" y="498" text-anchor="middle" font-size="12" fill="#787774">扩散把 prompt 当外部信号 / 自回归把 prompt 当序列的一部分</text>
  <text x="400" y="522" text-anchor="middle" font-size="11" fill="#9B9A97">资料: Luma 官方架构说明</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#787774"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#2383E2"/>
    </marker>
  </defs>
</svg>
