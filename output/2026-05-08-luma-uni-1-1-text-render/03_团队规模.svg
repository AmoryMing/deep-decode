<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="PingFang SC, Inter, sans-serif">
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#37352F">15 人对标 OpenAI 和 Google 是什么概念</text>
  <text x="40" y="72" font-size="14" fill="#787774">团队规模 vs Arena ELO 位置</text>

  <!-- bars -->
  <g transform="translate(60, 110)">
    <!-- OpenAI -->
    <text x="0" y="20" font-size="14" font-weight="700" fill="#37352F">OpenAI · GPT-Image-2</text>
    <rect x="200" y="0" width="500" height="32" fill="#37352F"/>
    <text x="710" y="22" font-size="13" fill="#37352F">~80+ 人</text>
    <text x="200" y="55" font-size="12" fill="#787774">Arena ELO: 第 1</text>
  </g>
  <g transform="translate(60, 200)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#37352F">Google · Nano Banana 2</text>
    <rect x="200" y="0" width="540" height="32" fill="#37352F"/>
    <text x="200" y="55" font-size="12" fill="#787774">Arena ELO: 第 2 (规模未公开, 估计更大)</text>
  </g>
  <g transform="translate(60, 290)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#2383E2">Luma · Uni-1.1</text>
    <rect x="200" y="0" width="55" height="32" fill="#2383E2"/>
    <text x="265" y="22" font-size="13" font-weight="700" fill="#2383E2">~15 人</text>
    <text x="200" y="55" font-size="12" fill="#37352F">Arena ELO: 第 3 (1193) · RISEBench 第 1</text>
  </g>

  <g transform="translate(40, 380)">
    <rect width="720" height="60" fill="#F7F6F3" stroke="#E3E2E0" rx="4"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#37352F">两位华人学者领衔</text>
    <text x="20" y="48" font-size="12" fill="#37352F">宋佳铭 (DDIM 奠基作者, 清华→斯坦福) · 沈博魁 (CVPR 2018 最佳论文, RSS 2022 最佳学生论文)</text>
  </g>
</svg>
