<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Top label -->
  <text x="40" y="56" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774" letter-spacing="2">2026 / 05 / 21  ·  DECODE</text>

  <!-- Main title -->
  <text x="40" y="118" font-family="PingFang SC, Inter, sans-serif" font-size="34" font-weight="700" fill="#37352F">云厂商开始卖"默认数据团队"</text>
  <text x="40" y="160" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="500" fill="#37352F">腾讯 DataBuddy 把三个工种折成一个对话框</text>

  <line x1="40" y1="195" x2="760" y2="195" stroke="#E3E2E0" stroke-width="1"/>

  <!-- Visual anchor: 3 roles folding into one chat box -->
  <g transform="translate(40, 230)">
    <!-- Role 1: 分析师 -->
    <rect x="0" y="0" width="140" height="56" rx="6" fill="#F0F7FF" stroke="#2383E2" stroke-width="1"/>
    <text x="70" y="24" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">业务分析</text>
    <text x="70" y="44" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F" text-anchor="middle">数据分析师</text>

    <!-- Role 2: 治理员 -->
    <rect x="0" y="70" width="140" height="56" rx="6" fill="#FFF8E1" stroke="#FFB020" stroke-width="1"/>
    <text x="70" y="94" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">数据治理</text>
    <text x="70" y="114" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F" text-anchor="middle">数据治理员</text>

    <!-- Role 3: 数仓工程师 -->
    <rect x="0" y="140" width="140" height="56" rx="6" fill="#E8F5F1" stroke="#4DB6AC" stroke-width="1"/>
    <text x="70" y="164" font-family="PingFang SC, Inter, sans-serif" font-size="12" fill="#787774" text-anchor="middle">数据工程</text>
    <text x="70" y="184" font-family="PingFang SC, Inter, sans-serif" font-size="14" font-weight="600" fill="#37352F" text-anchor="middle">数仓工程师</text>

    <!-- Arrows folding -->
    <path d="M 145 28 L 280 96" stroke="#787774" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 145 98 L 280 100" stroke="#787774" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 145 168 L 280 104" stroke="#787774" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <!-- Chat box: DataBuddy -->
    <rect x="290" y="60" width="280" height="80" rx="10" fill="#37352F"/>
    <text x="430" y="92" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" opacity="0.7">一个对话框</text>
    <text x="430" y="118" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">DataBuddy</text>

    <!-- Underneath: WeData -->
    <text x="430" y="180" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774" text-anchor="middle">嵌在 WeData 控制台</text>

    <!-- Right column: 4 vendors -->
    <rect x="595" y="0" width="125" height="196" rx="6" fill="#FAFAF8" stroke="#E3E2E0" stroke-width="1"/>
    <text x="657" y="22" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774" text-anchor="middle">同周四家动作</text>
    <text x="608" y="48" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">4/13  Snowflake</text>
    <text x="608" y="68" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">  Cortex Agents</text>
    <text x="608" y="92" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">4/15  阿里云</text>
    <text x="608" y="112" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#787774">  DataWorks 商业化</text>
    <text x="608" y="136" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">5/19  腾讯</text>
    <text x="608" y="156" font-family="PingFang SC, Inter, sans-serif" font-size="11" font-weight="700" fill="#2383E2">  DataBuddy</text>
    <text x="608" y="180" font-family="PingFang SC, Inter, sans-serif" font-size="11" fill="#37352F">同周  Databricks Genie</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#787774"/>
    </marker>
  </defs>

  <!-- Bottom stat -->
  <text x="40" y="470" font-family="PingFang SC, Inter, sans-serif" font-size="13" fill="#787774">2026 Q2 起，"数据分析师 + 数据治理员 + 数仓工程师"被云厂商打包成一个 Agent 工作台</text>
</svg>
